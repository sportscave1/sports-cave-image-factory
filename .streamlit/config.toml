[server]
address = "0.0.0.0"
headless = true
fileWatcherType = "none"
runOnSave = false
enableStaticServing = true

enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

# Dataframe-only theme settings: keep the rest of the Sports Cave theme intact.
[theme]
dataframeBorderColor = "#eeece5"
dataframeHeaderBackgroundColor = "#f3f2ec"
