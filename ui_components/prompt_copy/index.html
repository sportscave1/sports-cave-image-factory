<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: #0b0b0d;
        font-family: Arial, sans-serif;
      }

      .copy-wrap {
        padding: 2px 0;
      }

      button {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid rgba(11, 11, 13, 0.55);
        border-radius: 14px;
        padding: 12px 14px;
        background: #fff;
        color: #0b0b0d;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
      }

      button.primary {
        border-color: #d4a54c;
        background: #d4a54c;
      }

      button:disabled {
        border-color: #d4d0c7;
        background: #e6e2d9;
        color: #817d75;
        cursor: not-allowed;
      }

      .status {
        min-height: 18px;
        margin-top: 6px;
        color: #5c4309;
        font-size: 0.82rem;
      }
    </style>
  </head>
  <body>
    <div class="copy-wrap">
      <button id="copy-button" type="button" aria-describedby="copy-status"></button>
      <div id="copy-status" class="status" role="status" aria-live="polite"></div>
    </div>
    <script src="clipboard.js"></script>
    <script>
      (() => {
        const button = document.getElementById("copy-button");
        const status = document.getElementById("copy-status");
        let args = {};
        let pending=null,handled=null,busy=false;

        function sendMessage(type, extra = {}) {
          window.parent.postMessage(
            { isStreamlitMessage: true, type, ...extra },
            "*",
          );
        }

        function setFrameHeight() {
          sendMessage("streamlit:setFrameHeight", { height: args.compact ? Math.max(58,document.body.scrollHeight || 0) : 68 });
        }

        function setComponentValue(value) {
          sendMessage("streamlit:setComponentValue", {
            value,
            dataType: "json",
          });
        }

        function render(nextArgs) {
          args = nextArgs || {};
          button.textContent = args.label || "Copy Prompt";
          button.className = args.primary ? "primary" : "";
          button.disabled = Boolean(args.disabled);
          if(args.disabled)pending=null;
          button.setAttribute("aria-label", button.textContent);
          if(!args.validation_mode)status.textContent = "";
          if(args.compact){button.style.cssText='padding:6px 10px;font-size:13px;border-radius:6px';}
          if(args.validation_mode&&args.response_id&&args.response_id===pending&&handled!==pending){
            handled=pending;performCopy(args.response_id);
          }
          setFrameHeight();
        }

        async function performCopy(requestId=null){
          if(busy)return;busy=true;
          const text=String(args.prompt_text||'');
          const copied=await window.scCopyText(text);
          const confirmation=args.success_label||'Prompt copied';
          button.textContent=copied?confirmation:'Copy failed';
          status.textContent=copied?confirmation:(args.compact?'Copy failed — open View prompt and copy manually.':'Copy failed — use the prompt preview to copy manually.');
          if(args.validation_mode){
            setComponentValue({type:copied?'copied':'failed',event:requestId});pending=null;
          }else if(copied)setComponentValue(Boolean(args.prompt_text));
          busy=false;setFrameHeight();
          if(!args.compact)window.setTimeout(()=>{button.textContent=args.label||'Copy Prompt';status.textContent='';setFrameHeight();},1400);
        }
        function copyPrompt(event){
          event.preventDefault();if(button.disabled||busy||pending)return;
          if(args.validation_mode){
            pending=crypto.randomUUID();status.textContent='Checking current facts…';
            setComponentValue({type:'prepare',event:pending});return;
          }
          performCopy();
        }

        window.addEventListener("message", (event) => {
          if (event.source === window.parent && event.data && event.data.type === "streamlit:render") {
            render(event.data.args);
          }
        });
        button.addEventListener("click", copyPrompt);
        sendMessage("streamlit:componentReady", { apiVersion: 1 });
        setFrameHeight();
      })();
    </script>
  </body>
</html>
