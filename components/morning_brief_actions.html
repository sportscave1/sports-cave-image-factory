<style>
.sc-brief-row {position:relative;margin:.25rem 0;border:1px solid #d6cdbb;border-radius:12px;background:var(--secondary-background-color,#f8f6ef);color:var(--text-color,#212121)}
.sc-brief-row summary {display:flex;align-items:center;gap:.5rem;min-height:36px;padding:0 11rem 0 .7rem;cursor:pointer;list-style:none}
.sc-brief-row summary::-webkit-details-marker {display:none}
.sc-brief-row summary::before {content:"›";flex:none;font-size:1.15rem;line-height:1}
.sc-brief-row details[open] summary::before {transform:rotate(90deg)}
.sc-brief-row summary span {overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.875rem}
.sc-brief-actions {position:absolute;top:0;right:.42rem;height:36px;display:flex;align-items:center;gap:.28rem}
.sc-brief-actions a,.sc-brief-actions span {text-decoration:none;color:inherit;border:1px solid #b8aa8a;border-radius:6px;padding:.16rem .42rem;font-size:.72rem;font-weight:600;white-space:nowrap}
.sc-brief-actions span {opacity:.48}
.sc-brief-actions a:hover {background:#c29a43;color:#17130c}
.sc-brief-row :focus-visible {outline:2px solid #956810;outline-offset:2px}
.sc-brief-body {padding:.55rem .9rem .8rem;font-size:.875rem;line-height:1.5;overflow-wrap:anywhere;border-top:1px solid #d6cdbb}
.sc-brief-body h4 {font-size:1rem;margin:.1rem 0 .45rem}
.sc-brief-body p {max-width:78ch}
.sc-brief-links a {font-size:.76rem;text-underline-offset:.15rem}
.sc-brief-body p {white-space:pre-wrap;margin:0 0 .4rem}
.sc-brief-links {display:flex;flex-wrap:wrap;gap:.35rem .85rem}
.sc-brief-toast {position:fixed;z-index:9999;bottom:1rem;right:1rem;max-width:calc(100vw - 2rem);padding:.6rem .85rem;border-radius:6px;background:#202020;color:white;font-size:.85rem}
@media(max-width:480px){.sc-brief-row summary{padding-right:9.1rem}.sc-brief-actions a{padding:.16rem .25rem;font-size:.66rem}}

.sc-cal {margin:1rem 0 .3rem}
.sc-cal-header {display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.35rem}
.sc-cal-header h3 {font-size:1rem;margin:0}
.sc-cal-markets {display:flex;gap:.24rem}
.sc-cal button,.sc-cal-dialog button {cursor:pointer;color:inherit;font:inherit;font-size:.73rem;border:1px solid #b8aa8a;border-radius:6px;padding:.13rem .45rem;background:transparent;white-space:nowrap}
.sc-cal button[aria-pressed="true"] {background:#c29a43;color:#17130c;border-color:#c29a43}
.sc-cal-wrap {max-height:24rem;overflow:auto;border:1px solid #d6cdbb;border-radius:10px}
.sc-cal-wrap table {border-collapse:separate;border-spacing:0;width:100%;margin:0;font-size:.79rem}
.sc-cal-wrap :is(th,td) {padding:.3rem .55rem;border-bottom:1px solid #d6cdbb;text-align:left;vertical-align:middle}
.sc-cal-wrap thead th {position:sticky;top:0;z-index:1;background:var(--secondary-background-color,#f8f6ef);white-space:nowrap}
.sc-cal-wrap td small {display:block;opacity:.78}
.sc-cal-state {white-space:nowrap;font-weight:600}
.sc-cal-dialog {width:min(48rem,calc(100vw - 1.5rem));max-height:80dvh;padding:.9rem;border:1px solid #b8aa8a;border-radius:12px;background:var(--background-color,#fff);color:var(--text-color,#222)}
.sc-cal-dialog::backdrop {background:#181512a0}
.sc-cal-dialog header {display:flex;justify-content:space-between;gap:.5rem;align-items:center;position:sticky;top:0;z-index:2;background:inherit}
.sc-cal-dialog h3 {margin:0;font-size:1rem}
.sc-cal-dialog h4 {font-size:.83rem;margin:.6rem 0 .3rem}
</style>
<div class="sc-brief-recommendations">
<!-- RECOMMENDATIONS -->
<section class="sc-cal">
<header class="sc-cal-header"><h3>Sports calendar</h3><div class="sc-cal-markets" aria-label="Market">
<button type="button" data-market-tab="AUS" aria-pressed="true">AUS</button>
<button type="button" data-market-tab="USA" aria-pressed="false">USA</button>
<button type="button" data-market-tab="UK" aria-pressed="false">UK</button>
</div></header>
<!-- CALENDARS -->
</section>
<dialog class="sc-cal-dialog" aria-labelledby="sc-cal-history-title">
<header><h3 id="sc-cal-history-title">News / updates</h3>
<form method="dialog"><button>Close</button></form></header>
<div class="sc-cal-stories"></div>
<p class="sc-cal-status" role="status"></p>
<button type="button" class="sc-cal-older" hidden>Older editions</button>
</dialog>
<div class="sc-brief-toast" role="status" hidden></div>
</div>
<script>
{
  const panel = document.currentScript?.previousElementSibling ||
    [...document.querySelectorAll(".sc-brief-recommendations")].at(-1);
  if (panel && !panel.dataset.actionsReady) {
    panel.dataset.actionsReady = "true";
    const dialog = panel.querySelector("dialog");
    const stories = dialog.querySelector(".sc-cal-stories");
    const status = dialog.querySelector(".sc-cal-status");
    const older = dialog.querySelector(".sc-cal-older");
    let cursor, current, pending;
    async function loadHistory() {
      pending?.abort();
      const request = new AbortController();
      pending = request;
      const query = new URLSearchParams(current);
      if (cursor) query.set("before", cursor);
      older.hidden = true;
      status.textContent = "Loading updates…";
      try {
        const response = await fetch("/ops/morning-brief/history?" + query, {signal:request.signal});
        if (!response.ok) throw Error("History unavailable");
        const result = await response.json();
        if (pending !== request) return;
        stories.insertAdjacentHTML("beforeend", result.html);
        cursor = result.before;
        older.hidden = !cursor;
        status.textContent = stories.childElementCount ? "" : "No briefings for this market in these editions.";
      } catch (error) {
        if (error.name === "AbortError" || pending !== request) return;
        status.textContent = "Briefing history is unavailable.";
      }
    }
    older.addEventListener("click", loadHistory);
    dialog.addEventListener("close", () => pending?.abort());
    const toast = panel.querySelector(".sc-brief-toast");
    let hideToast;
    panel.addEventListener("click", event => {
      const market = event.target.closest("button[data-market-tab]");
      if (market) {
        panel.querySelectorAll("[data-market-tab]").forEach(button =>
          button.setAttribute("aria-pressed", String(button === market)));
        panel.querySelectorAll("[data-calendar]").forEach(table =>
          table.hidden = table.dataset.calendar !== market.dataset.marketTab);
        return;
      }
      const news = event.target.closest("button.sc-cal-news");
      if (news) {
        current = {sport:news.dataset.sport, market:news.dataset.market};
        cursor = null;
        stories.replaceChildren();
        dialog.querySelector("h3").textContent = current.sport + " · " + current.market;
        dialog.showModal();
        loadHistory();
        return;
      }
      const action = event.target.closest("a[data-prompt]");
      if (!action) return;
      const prompt = action.dataset.prompt;
      const fallback = () => {
        const field = document.createElement("textarea");
        field.value = prompt;
        field.style.cssText = "position:fixed;left:-9999px";
        panel.append(field);
        field.select();
        let copied = false;
        try { copied = document.execCommand("copy"); } catch {}
        field.remove();
        action.focus({preventScroll:true});
        if (!copied) window.prompt("Copy this prompt, then paste it into Sports Cave Designs.", prompt);
      };
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(prompt).catch(fallback);
      } else {
        fallback();
      }
      toast.textContent = "Paste the prompt into Sports Cave Designs and send it.";
      toast.hidden = false;
      clearTimeout(hideToast);
      hideToast = setTimeout(() => { toast.hidden = true; }, 4500);
    });
  }
}
</script>
