<style>
html,body{margin:0;overflow:hidden;background:transparent}
button{appearance:none;display:block;width:100%;aspect-ratio:1.414;background:#151515;border:1px solid #52462b;border-radius:9px;padding:0;cursor:zoom-in;overflow:hidden}
button:focus-visible{outline:3px solid #b88728;outline-offset:-4px}
img{display:block;width:100%;height:100%;object-fit:contain}
</style>
<button type="button" id="open" aria-label="Open artwork viewer"><img id="art" src="__IMAGE__" alt="__TITLE__"></button>
<script>
const art=document.getElementById('art'), opener=document.getElementById('open');
const fit=()=>{if(frameElement)frameElement.style.height=Math.ceil(opener.getBoundingClientRect().height)+'px';};
new ResizeObserver(fit).observe(opener);fit();
opener.addEventListener('click',()=>{
  const d=parent.document, dialog=d.createElement('dialog');
  dialog.setAttribute('aria-label',art.alt+' artwork viewer');
  dialog.style.cssText='position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#171612;color:white;z-index:2147483000';
  const surface=d.createElement('div'), image=d.createElement('img'), close=d.createElement('button'), hint=d.createElement('p');
  surface.style.cssText='position:absolute;inset:54px 12px 42px;overflow:hidden;touch-action:none;display:grid;place-items:center';
  image.src=art.src;image.alt=art.alt;image.draggable=false;
  image.style.cssText='pointer-events:none;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;user-select:none';
  close.type='button';close.textContent='Close';close.style.cssText='position:absolute;right:16px;top:12px;z-index:1;background:#302b21;color:white;border:1px solid #c9a959;border-radius:7px;padding:8px 14px;';
  hint.textContent='Scroll or pinch to zoom · Drag to pan · Double-click to zoom or reset · Esc to close';
  hint.style.cssText='position:absolute;bottom:8px;left:12px;right:12px;text-align:center;margin:0;font:13px system-ui;color:#e4dac8';
  dialog.append(surface,close,hint);surface.append(image);d.body.append(dialog);
  const pointers=new Map();let scale=1,x=0,y=0;
  const paint=()=>{image.style.transform='translate('+x+'px,'+y+'px) scale('+scale+')';surface.style.cursor=scale===1?'zoom-in':'grab';};
  const zoom=(next,cx=surface.clientWidth/2,cy=surface.clientHeight/2)=>{
    const old=scale;scale=Math.min(6,Math.max(1,next));
    x=(x-(cx-surface.clientWidth/2))*scale/old+(cx-surface.clientWidth/2);
    y=(y-(cy-surface.clientHeight/2))*scale/old+(cy-surface.clientHeight/2);
    if(scale===1)x=y=0;paint();
  };
  surface.addEventListener('wheel',e=>{e.preventDefault();const b=surface.getBoundingClientRect();zoom(scale*Math.exp(-Math.max(-70,Math.min(70,e.deltaY))/270),e.clientX-b.left,e.clientY-b.top);},{passive:false});
  surface.addEventListener('dblclick',e=>{const b=surface.getBoundingClientRect();zoom(scale===1?2.4:1,e.clientX-b.left,e.clientY-b.top);});
  surface.addEventListener('pointerdown',e=>{surface.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);});
  surface.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;
    const old=pointers.get(e.pointerId),other=[...pointers.entries()].find(([id])=>id!==e.pointerId)?.[1];
    const next=[e.clientX,e.clientY];pointers.set(e.pointerId,next);
    if(other){
      const a=Math.hypot(old[0]-other[0],old[1]-other[1]), b=Math.hypot(next[0]-other[0],next[1]-other[1]), box=surface.getBoundingClientRect();
      if(a>0)zoom(scale*b/a,(next[0]+other[0])/2-box.left,(next[1]+other[1])/2-box.top);
    }else if(scale>1){x+=next[0]-old[0];y+=next[1]-old[1];paint();}
  });
  for(const event of ['pointerup','pointercancel','lostpointercapture'])surface.addEventListener(event,e=>pointers.delete(e.pointerId));
  dialog.addEventListener('keydown',e=>{
    if(e.key==='+'||e.key==='=')zoom(scale*1.3);else if(e.key==='-')zoom(scale/1.3);
    else if(e.key==='0')zoom(1);else if(scale>1&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
      x+=e.key==='ArrowLeft'?35:e.key==='ArrowRight'?-35:0;y+=e.key==='ArrowUp'?35:e.key==='ArrowDown'?-35:0;paint();
    }else return;e.preventDefault();
  });
  close.addEventListener('click',()=>dialog.close());
  dialog.addEventListener('close',()=>{dialog.remove();opener.focus();},{once:true});
  paint();dialog.showModal();close.focus();
});
</script>
