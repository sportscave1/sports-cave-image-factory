<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open PSD · Sports Cave OS</title><style>
body{font:14px system-ui;margin:0;background:#f5f6f8;color:#20242c}main{max-width:580px;margin:20px auto;padding:20px;background:white;border:1px solid #e3e6eb;border-radius:10px}h2{font-size:19px;margin:0 0 12px}button,a.option{font:inherit;border:1px solid #d5dae2;border-radius:6px;background:white;color:#20242c;padding:9px 12px;text-decoration:none;cursor:pointer}button:hover,a.option:hover{background:#f1f4f8}#files{grid-column:1/-1;background:#f1f4f8}nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}#app{background:#202b3f;color:white}#status{white-space:pre-wrap;line-height:1.5}#name{overflow-wrap:anywhere;color:#576174}#preview{max-width:100%;max-height:60vh;object-fit:contain}#guidance{color:#576174;font-size:13px;line-height:1.5}#controls{display:flex;gap:8px;flex-wrap:wrap}[hidden]{display:none!important}@media(max-width:620px){main{margin:8px}nav{grid-template-columns:1fr 1fr}button,a.option{font-size:12px;padding:9px 6px}}
</style></head><body><main><h2>Open PSD</h2><p id="name"></p><nav aria-label="PSD opening options"><button id="app">Open in App</button><button id="artwork">Preview Artwork</button><button id="dropbox">Open in Dropbox</button><a class="option" id="download">Download Original PSD</a><button id="files">Open from Files</button></nav><p id="application" hidden><label for="app-choice">Application: </label><select id="app-choice"><option value="openPhotoshop">Adobe Photoshop</option><option value="openPsdApp">Windows default PSD app</option></select></p><p id="status" role="status" aria-live="polite"></p><img id="preview" alt="Artwork preview" hidden><p id="guidance"></p><div id="controls"><a id="dropbox-link" class="option" target="_blank" rel="noopener noreferrer" hidden>Continue in Dropbox</a><a id="mac" class="option" hidden>Open synced master in Mac app</a><a id="install" href="/api/files-desktop-helper" hidden>Update existing Desktop helper</a><button id="retry" hidden>Retry</button><button id="cancel" hidden>Cancel</button></div></main><script>
const $=id=>document.getElementById(id);let bridge=window.chrome?.webview;try{bridge=window.parent.chrome?.webview||bridge;}catch{}const embedded=window.parent!==window;
if(embedded){document.querySelector('main').style.cssText='margin:0;padding:16px;border:0;max-width:none;border-radius:0';document.body.style.background='white';}
function host(type,extra={}){if(embedded)parent.postMessage({type,...extra},location.origin);}
window.SportsCavePsdDismiss=()=>{generation++;clearTimeout(timer);if(opening)cancelNative();opening=false;bridge?.removeEventListener?.('message',nativeListener);};
window.addEventListener('pagehide',()=>window.SportsCavePsdDismiss(),{once:true});
window.addEventListener('keydown',event=>{if(event.key==='Escape'&&embedded){event.preventDefault();host('sports-cave-psd-cancel');}});
new ResizeObserver(()=>host('sports-cave-psd-size',{height:document.querySelector('main').getBoundingClientRect().height+2})).observe(document.querySelector('main'));
const mobile=/Android|iPhone|iPad|iPod/.test(navigator.userAgent)||(/Mac/.test(navigator.platform)&&navigator.maxTouchPoints>1),macDevice=!mobile&&/Mac/.test(navigator.platform);
let pending='',timer=null,opening=false,generation=0,previewUrl='',lastAction='app',nativeReady=false,nativeCaps=[];
$('download').href='/api/files-psd-original'+location.search;$('download').target=embedded?'_self':'_blank';$('download').rel='noopener noreferrer';
function requestId(prefix){return prefix+'-'+Array.from(crypto.getRandomValues(new Uint32Array(4)),n=>n.toString(16).padStart(8,'0')).join('');}
function message(text){$('status').textContent=text;}
function guide(){ $('guidance').textContent=mobile?'On this device, use Dropbox’s available Open with / Share actions, or download the original and open it from Files or Downloads in a compatible app. App support and available storage vary by device.':macDevice?'With the existing Mac helper and Dropbox sync configured, open the verified local master in your default PSD app. Otherwise download and use Finder → Open With.':'Sports Cave OS Desktop on Windows opens the verified synced master in Photoshop. For other installed apps, download the original and choose Open with in your device’s file manager.';}
function fail(text,helper=false){clearTimeout(timer);opening=false;message(text);$('install').hidden=!helper;$('retry').hidden=false;$('cancel').hidden=true;pending='';}
function post(action,id,extra={}){bridge.postMessage({action,request_id:id,...extra});}
function cancelNative(){try{if(pending)post('cancel',pending);}catch{}}
function begin(action){$('dropbox-link').hidden=true;$('guidance').hidden=action!=='app';generation++;clearTimeout(timer);if(opening)cancelNative();opening=false;pending='';lastAction=action;$('retry').hidden=true;$('cancel').hidden=true;$('install').hidden=true;$('mac').hidden=true;return generation;}
async function api(action){const response=await fetch(location.pathname+location.search,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});if(action==='preview'&&response.ok)return response;
 let value;try{value=await response.json();}catch{throw Error('The server did not return PSD details. Sign in to Sports Cave OS and retry, or contact an administrator.');}if(!response.ok)throw Error((value.message||'The linked master could not be prepared.')+(value.reference?' Support reference: '+value.reference:''));return value;}
async function nativeOpen(){const attempt=generation;opening=true;$('cancel').hidden=false;message('Verifying the linked Dropbox master…');try{const grant=await api('openPhotoshop');if(attempt!==generation||!opening)return;$('name').textContent=grant.name;const action=$('app-choice').value;if(!nativeCaps.includes(action))throw Error('Update the existing Desktop helper for default-app opening, or select Photoshop.');pending=requestId('psd-open');message('Making the synced Dropbox master available and opening Adobe Photoshop…');timer=setTimeout(()=>{cancelNative();fail('Dropbox is taking too long to make this master available. Check Dropbox Desktop sync, then retry.');},180000);post(action,pending,{transfer:{base_url:location.origin,ticket:grant.ticket,secret:grant.secret}});}catch(error){if(attempt===generation)fail(error.message);}}
async function app(){begin('app');if(bridge?.postMessage&&bridge?.addEventListener){if(nativeReady){nativeOpen();return;}pending=requestId('psd-hello');timer=setTimeout(()=>fail('The Desktop bridge did not respond. Restart or update Sports Cave OS Desktop.',true),4000);try{post('hello',pending);}catch{fail('The Desktop bridge is unavailable. Restart or update Sports Cave OS Desktop.',true);}return;}
 if(macDevice){const attempt=generation;message('Verifying the linked Mac master…');try{const info=await api('describe');if(attempt!==generation)return;$('name').textContent=info.name;if(!info.mac_url)throw Error('Dropbox has not supplied verification metadata. Retry after sync, or download the original.');$('mac').href=info.mac_url;$('mac').hidden=false;$('install').href='/api/files-desktop-helper?platform=macos';$('install').hidden=false;message('Use the existing updated Mac helper to open the synced master in your default PSD app. If nothing opens, use Download Original PSD and Finder → Open With.');}catch(error){if(attempt===generation)fail(error.message);}return;}
 message(mobile?'Choose Open in Dropbox for supported app/share actions, or Download Original PSD and open it from Files or Downloads.':'Open in App needs a supported Desktop helper. Open Sports Cave OS Desktop on Windows, or download the PSD and choose Open with in your file manager.');}
async function artwork(){const attempt=begin('artwork');message('Loading a lightweight artwork preview…');try{const response=await api('preview');const blob=await response.blob();if(attempt!==generation)return;if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(blob);$('preview').src=previewUrl;$('preview').hidden=false;message('Artwork preview only. Download Original PSD provides the complete layered master.');}catch(error){if(attempt===generation)fail(error.message);}}
async function dropbox(){const attempt=begin('dropbox');message('Verifying the linked Dropbox master…');try{const info=await api('describe');if(attempt!==generation)return;$('name').textContent=info.name;message('Opening the exact linked master in Dropbox. Sign in with your authorised team account if prompted.');if(embedded){$('dropbox-link').href=info.dropbox_url;$('dropbox-link').hidden=false;message('Continue in Dropbox to use authorised access in its own tab. Dropbox sign-in cannot be embedded in this popup.');}else location.assign(info.dropbox_url);}catch(error){if(attempt===generation)fail(error.message);}}
const nativeListener=event=>{const data=event.data;if(data?.type!=='sports-cave-desktop'||data.request_id!==pending)return;
 if(data.action==='hello'&&!data.ok){fail(data.code==='origin_denied'?'This Sports Cave OS address is not allowed by Desktop. Update the existing helper configuration for your Sports Cave OS address.':(data.message||'The Desktop bridge could not start.'),true);return;}
 if(data.action==='capabilities'){clearTimeout(timer);if(!data.ok||!data.capabilities?.includes('openPhotoshop')){fail('Update the existing Sports Cave OS Desktop helper to enable verified Photoshop master opening.',true);return;}nativeReady=true;nativeCaps=data.capabilities;$('application').hidden=false;$('app-choice').options[1].disabled=!nativeCaps.includes('openPsdApp');nativeOpen();return;}
 if(data.action==='progress'){message('Making the synced Dropbox master available…');return;}
 if(data.action==='openPhotoshop'||data.action==='openPsdApp'){clearTimeout(timer);opening=false;$('cancel').hidden=true;if(data.ok){message(data.action==='openPhotoshop'?'Opened the linked master in Adobe Photoshop.':'Opened the linked master in your default PSD app.');pending='';}else fail(data.message||'Photoshop could not open the linked master. Check Desktop and Dropbox sync.',['desktop_outdated','origin_denied'].includes(data.code));}
};if(bridge?.addEventListener)bridge.addEventListener('message',nativeListener);
$('files').onclick=()=>{begin('files');host('sports-cave-psd-files');location.assign('/files-window?psd_product_gid='+encodeURIComponent(new URLSearchParams(location.search).get('product_gid')||''));};$('app').onclick=app;$('artwork').onclick=artwork;$('dropbox').onclick=dropbox;$('download').onclick=()=>{begin('download');message('Downloading the complete layered master using your signed-in session. Keep this connection open. If interrupted, retry the download. Large files need enough device storage.');};$('mac').onclick=()=>message('Mac helper requested. If no app opens, check the existing helper and Dropbox sync, or download and use Finder → Open With.');$('retry').onclick=()=>({app,artwork,dropbox}[lastAction]||app)();$('cancel').onclick=()=>{generation++;if(opening)cancelNative();fail('Opening cancelled. No master file was changed.');};guide();$('guidance').hidden=true;if(bridge?.postMessage&&!embedded)app();else message('Choose how to open the linked master. No original PSD is downloaded until you request it.');
</script></body></html>
