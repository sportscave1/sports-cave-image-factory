<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; overflow: hidden; }
      body { font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
      button {
        align-items: center;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        color: #202124;
        cursor: default;
        display: flex;
        font: 400 14px/1 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        height: 38px;
        padding: 0 12px;
        text-align: left;
        width: 100%;
      }
      button:hover { background: #e9eaec; border-color: #dcdee1; }
      button:active { background: #dfe1e4; }
      button:focus-visible { outline: 2px solid #0f6cbd; outline-offset: -2px; }
    </style>
  </head>
  <body>
    <button id="launcher" type="button">Files</button>
    <script>
      const button = document.getElementById("launcher");
      const listenerController = new AbortController();
      const listenerOptions = {signal: listenerController.signal};
      let launchPending = false;

      function send(type, data) {
        window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), "*");
      }

      function setHeight(height) {
        send("streamlit:setFrameHeight", { height });
      }

      function safeRelativePath(value) {
        const raw = String(value || "");
        if (!raw || raw !== raw.trim() || raw.startsWith("/") || raw.includes("\\") || raw.includes(":") || raw.includes("\0")) return "";
        const parts = raw.split("/");
        if (parts.some(part => !part || part === "." || part === "..")) return "";
        return parts.join("/");
      }

      function filesUrl(relativePath) {
        const clean = safeRelativePath(relativePath);
        return clean
          ? `/files-window?relative_path=${encodeURIComponent(clean)}`
          : "/files-window";
      }

      function openBrowserFilesWindow(relativePath = "") {
        const features = [
          "popup=yes",
          "width=1280",
          "height=860",
          "left=80",
          "top=40",
          "resizable=yes",
          "scrollbars=yes",
          "noopener=no"
        ].join(",");
        const href = filesUrl(relativePath);
        const popup = window.open(href, "sports-cave-files-window", features);
        if (popup) {
          popup.focus();
          return;
        }
        window.open(href, "_blank");
      }

      function openFilesWindow() {
        if (launchPending) return;
        launchPending = true;
        button.disabled = true;
        try {
          openBrowserFilesWindow();
        } finally {
          queueMicrotask(() => {
            launchPending = false;
            if (document.contains(button)) button.disabled = false;
          });
        }
      }

      function destroy() {
        listenerController.abort();
        launchPending = false;
        if (window.parent.SportsCaveFilesWindow === sharedFilesWindow) {
          delete window.parent.SportsCaveFilesWindow;
        }
      }

      const sharedFilesWindow = {open: openBrowserFilesWindow};
      window.SportsCaveFilesLauncher?.destroy?.();
      window.SportsCaveFilesLauncher = {destroy};
      window.parent.SportsCaveFilesWindow = sharedFilesWindow;
      button.addEventListener("click", openFilesWindow, listenerOptions);
      window.addEventListener("pagehide", destroy, {once: true, signal: listenerController.signal});
      send("streamlit:componentReady", { apiVersion: 1 });
      setHeight(38);
    </script>
  </body>
</html>
