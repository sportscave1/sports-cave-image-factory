<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Health</title>
<style>
:root{color-scheme:light;--bg:#faf9f5;--line:#ddd9ce;--gold:#b28e36;--ink:#191b19;--muted:#66685f;--bad:#9c342d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:12px 'Segoe UI Variable','Segoe UI',system-ui,sans-serif}main{height:100dvh;min-height:450px;display:flex;flex-direction:column;gap:7px;padding:8px}button,input,select{font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:4px;min-height:27px;padding:3px 8px}button{cursor:pointer}button:hover{border-color:var(--gold);background:#f4efdf}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--gold);outline-offset:1px}h1{font-size:16px;margin:0;line-height:25px}.bar{display:flex;align-items:center;gap:8px;min-width:0}.grow{flex:1;min-width:0}.muted{color:var(--muted)}.tag{font-weight:600}.tag:before{content:'●';font-size:9px;color:var(--gold);margin-right:5px}.tag[data-state=Failed]:before,.tag[data-state=Degraded]:before,.tag[data-state=Offline]:before{color:var(--bad)}#strip{border-bottom:1px solid var(--line);padding-bottom:7px;position:sticky;top:0;background:var(--bg);z-index:2}#current{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#job-progress{width:70px;height:4px;accent-color:var(--gold)}#backlog-progress{width:100%;height:5px;display:block;margin:5px 0;accent-color:var(--gold)}#numbers{display:flex;gap:14px;flex-wrap:wrap;line-height:19px}#numbers b{font-weight:600}#last{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:19px}#warning{color:var(--bad);line-height:18px}#health{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));overflow-x:auto;border-bottom:1px solid var(--line)}.subsystem{padding:4px 8px;border-right:1px solid var(--line);min-width:0}.subsystem:first-child{padding-left:0}.subsystem:last-child{border:0}.subsystem strong{font-weight:600;font-size:11px}.subsystem small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;line-height:17px}.subsystem .reason{color:var(--bad)}#queue-tools{flex-wrap:wrap}#filter{min-width:115px}#jobs-pane{flex:1;min-height:120px;overflow:auto;border:1px solid var(--line);border-radius:4px}table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}thead{position:sticky;top:0;z-index:1;background:#f0eee6}th{text-align:left;font-weight:600;color:#55584f;height:29px;padding:4px 8px;border-bottom:1px solid var(--line)}td{height:30px;padding:2px 8px;border-bottom:1px solid #ebe8df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}tbody tr[data-id]{cursor:pointer}tbody tr[data-id]:hover,tbody tr.selected{background:#f2ecdc}td button{height:23px;min-height:23px;padding:1px 7px}tr.details td{white-space:normal;height:auto;padding:8px 12px;background:#f4f2eb;line-height:20px}.detail-grid{display:flex;gap:5px 20px;flex-wrap:wrap}.detail-history{margin-top:5px;color:var(--muted)}#pager{justify-content:flex-end}details#logs-panel{border-top:1px solid var(--line);min-height:28px}summary{cursor:pointer;font-weight:600;line-height:28px}#logs-tools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}#log-search{flex:1;min-width:140px}#log-list{max-height:210px;overflow:auto}#log-list details{border-bottom:1px solid var(--line);padding:0 6px}#log-list summary{font-weight:400;line-height:27px;font-size:12px}#log-list p{margin:3px 0 8px;white-space:pre-line}.trace{font-family:Consolas,monospace;font-size:11px}dialog{width:min(640px,96vw);border:1px solid var(--line);padding:8px;border-radius:6px;background:var(--bg)}dialog::backdrop{background:#0005}dialog iframe{width:100%;height:440px;border:0}#updated{font-size:11px;white-space:nowrap}#empty{padding:14px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:650px){main{padding:6px}.bar{gap:5px}#updated{max-width:132px;overflow:hidden;text-overflow:ellipsis}#numbers{gap:2px 10px}#jobs-pane table{min-width:820px}h1{font-size:15px}.subsystem{min-width:170px}#health{grid-template-columns:repeat(5,170px)}#current{max-width:180px}#logs-tools input[type=date]{width:125px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
progress::-webkit-progress-bar{background:#e5e1d7;border-radius:2px}progress::-webkit-progress-value{background:var(--gold);border-radius:2px}progress::-moz-progress-bar{background:var(--gold)}progress:not([value]){accent-color:var(--gold)}
</style></head><body><main>
<section id="strip" aria-label="Live worker progress">
 <div class="bar"><h1>Worker Health</h1><span id="overall" class="tag" role="status">Loading</span><span class="grow"></span><span id="updated" class="muted"></span><button id="refresh">Refresh</button></div>
 <div class="bar"><b id="current" class="grow">Loading authoritative checkpoints…</b><span id="stage"></span><progress id="job-progress" hidden aria-label="Current job progress is not measurable"></progress><button id="pause" disabled>Pause</button><button id="resume" disabled>Resume</button></div>
 <progress id="backlog-progress" max="1" value="0" aria-label="Verified completed jobs"></progress>
 <div id="numbers"><span><b id="completed">—</b> / <b id="total">—</b> verified</span><span>Runnable remaining <b id="remaining">—</b></span><span>Elapsed <b id="elapsed">—</b></span><span>ETA <b id="eta">Calculating</b></span><span id="human" class="muted"></span></div>
 <div id="last" class="muted">Last completed —</div><div id="warning" role="status"></div>
</section>
<div id="colour-counts" class="muted" role="status">Colour evidence awaiting queue snapshot.</div>
<section id="health" aria-label="Subsystem health"></section>
<div id="queue-tools" class="bar"><b>Job queue</b><select id="filter" aria-label="Job filter"><option>All</option><option>Active</option><option>Queued</option><option>Failed</option><option>Needs Review</option><option>Completed</option></select><span id="queue-count" class="muted"></span><span class="grow"></span><span id="revision" class="trace muted"></span></div>
<div id="jobs-pane"><table aria-label="Worker job queue"><colgroup><col style="width:27%"><col style="width:8%"><col style="width:11%"><col style="width:15%"><col style="width:9%"><col style="width:21%"><col style="width:9%"></colgroup><thead><tr><th>Design</th><th>Priority</th><th>Stage</th><th>Status</th><th>Duration</th><th>Last Activity</th><th>Action</th></tr></thead><tbody id="jobs"></tbody></table><div id="empty" hidden>No jobs in this filter.</div></div>
<div id="pager" class="bar"><span id="page-label" class="muted"></span><button id="previous" disabled>Previous</button><button id="next" disabled>Next</button></div>
<details id="logs-panel"><summary>Worker Diagnostics</summary><div id="logs-tools"><input id="log-search" type="search" placeholder="Search design, code or cause" aria-label="Diagnostic search"><select id="severity" aria-label="Severity"><option value="">All severities</option><option>error</option><option>warning</option><option>info</option></select><select id="component" aria-label="Component"><option value="">All components</option><option>Render</option><option>Companion</option><option>Photoshop</option><option>Dropbox</option><option>Database</option></select><input id="date-from" type="date" aria-label="From Sydney date"><input id="date-to" type="date" aria-label="To Sydney date"><button id="log-refresh">Search</button></div><div id="log-list"></div><button id="log-more" hidden>More diagnostics</button></details>
</main><dialog id="action-dialog"><div class="bar"><b>Artwork controls</b><span class="grow"></span><button id="close-dialog">Close</button></div><iframe title="Existing Auto Editions review and recovery controls"></iframe></dialog>
<script>
const $=id=>document.getElementById(id),categories=['All','Active','Queued','Failed','Needs Review','Completed'];
for(const option of $('filter').options)option.value=option.textContent;
let data=null,loading=false,reloadPending=false,offset=0,openId=null,jobIndex=new Map(),history=new Map(),logCursor=null,logsLoaded=false,actionPending=false;
const text=(id,value)=>$(id).textContent=value??'—';
function duration(seconds){if(seconds==null)return '—';const n=Math.max(0,Math.round(seconds));return n>=3600?Math.floor(n/3600)+'h '+Math.floor(n%3600/60)+'m':n>=60?Math.floor(n/60)+'m '+n%60+'s':n+'s';}
async function api(path,body){const response=await fetch('/api/worker-health'+path,{credentials:'same-origin',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})});const value=await response.json();if(!response.ok)throw Error(value.error+' '+(value.trace||''));return value;}
function renderHealth(values){const existing=new Map([...$('health').children].map(el=>[el.dataset.component,el]));for(const value of values){let el=existing.get(value.component);if(!el){el=document.createElement('div');el.className='subsystem';el.dataset.component=value.component;el.append(document.createElement('strong'),document.createElement('small'),document.createElement('small'));$('health').append(el);}el.children[0].textContent=value.label+' · '+value.status;el.children[1].textContent=(value.last_seen||'No heartbeat')+(value.revision?' · '+value.revision.slice(0,8):'');el.children[2].textContent=value.reason||'';el.children[2].className=value.status==='Degraded'||value.status==='Offline'?'reason':'';el.title=value.reason||'';}}
function rowAction(id){const job=jobIndex.get(id);if(!job)return;$('action-dialog').querySelector('iframe').src='/auto-editions/status?product_gid='+encodeURIComponent(id);$('action-dialog').showModal();}
function detailNode(job){const tr=document.createElement('tr');tr.className='details';tr.dataset.detail=job.id;const td=document.createElement('td');td.colSpan=7;tr.append(td);const grid=document.createElement('div');grid.className='detail-grid';
 for(const value of ['Stage: '+job.stage,'Attempts: '+job.attempts,'Checkpoint: '+job.checkpoint,'Job: '+job.id]){const item=document.createElement('span');item.textContent=value;grid.append(item);}td.append(grid);
 const reason=document.createElement('div');reason.textContent=job.diagnostic?job.diagnostic.description+' '+job.diagnostic.recommended_action:job.reason||'No recorded failure.';td.append(reason);
 const b=document.createElement('button');b.textContent=job.category==='Needs Review'?'Review':'Existing artwork controls';b.onclick=()=>rowAction(job.id);td.append(b);
 const list=document.createElement('div');list.className='detail-history';list.textContent='Loading recent diagnostics…';td.append(list);populateHistory(job.id,list);return tr;}
async function populateHistory(id,el){try{let entries=history.get(id);if(!entries){entries=(await api('/diagnostics?design='+encodeURIComponent(id))).rows;history.set(id,entries);}if(!el.isConnected)return;el.replaceChildren();for(const row of entries.slice(0,5)){const line=document.createElement('div');line.textContent=row.timestamp+' · '+row.trace+' · '+row.description;el.append(line);}if(!entries.length)el.textContent='No failure diagnostic recorded for this design.';}catch(e){el.textContent=e.message;}}
function detailKey(job){return [job.status,job.stage,job.checkpoint,job.attempts].join('|');}
function updateDetail(tr,job){const cells=tr.querySelectorAll('.detail-grid span');['Stage: '+job.stage,'Attempts: '+job.attempts,'Checkpoint: '+job.checkpoint,'Job: '+job.id].forEach((value,i)=>cells[i].textContent=value);tr.querySelector('.detail-grid').nextElementSibling.textContent=job.diagnostic?job.diagnostic.description+' '+job.diagnostic.recommended_action:job.reason||'No recorded failure.';if(tr.dataset.activity!==detailKey(job)){tr.dataset.activity=detailKey(job);history.delete(job.id);populateHistory(job.id,tr.querySelector('.detail-history'));}}
function toggleJob(id){openId=openId===id?null:id;renderJobs(data.jobs);}
function renderJobs(jobs){const pane=$('jobs-pane'),scroll=pane.scrollTop,existing=new Map([...$('jobs').querySelectorAll('tr[data-id]')].map(el=>[el.dataset.id,el])),details=new Map([...$('jobs').querySelectorAll('tr[data-detail]')].map(el=>[el.dataset.detail,el]));const keep=new Set();jobIndex=new Map(jobs.map(job=>[job.id,job]));
 for(const job of jobs){let tr=existing.get(job.id);if(!tr){tr=document.createElement('tr');tr.dataset.id=job.id;tr.tabIndex=0;for(let n=0;n<7;n++)tr.append(document.createElement('td'));tr.onclick=()=>toggleJob(job.id);tr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleJob(job.id);}};const action=document.createElement('button');action.onclick=e=>{e.stopPropagation();toggleJob(job.id);};tr.children[6].append(action);}
  const values=[job.design,job.priority===8?'Paid':job.priority===10?'Now':job.priority===7?'Advertised':job.priority,job.stage,job.status,duration(job.elapsed_seconds??job.duration_seconds),job.last_activity];values.forEach((value,n)=>{if(tr.children[n].textContent!==String(value??'—'))tr.children[n].textContent=value??'—';});tr.children[0].title=job.design;tr.children[6].firstChild.textContent='Details';tr.classList.toggle('selected',openId===job.id);tr.setAttribute('aria-expanded',String(openId===job.id));$('jobs').append(tr);keep.add(tr);
  if(openId===job.id){let detail=details.get(job.id);if(detail)updateDetail(detail,job);else{detail=detailNode(job);detail.dataset.activity=detailKey(job);}$('jobs').append(detail);keep.add(detail);}
 }
 for(const el of [...$('jobs').children])if(!keep.has(el))el.remove();pane.scrollTop=scroll;$('empty').hidden=jobs.length>0;
}
function render(value){data=value;text('overall',value.overall);$('overall').dataset.state=value.overall;text('updated',value.updated_at);text('current',value.current?.design||'No active preparation');text('stage',value.current?.stage||'');$('job-progress').hidden=!value.current;
 const colour=value.colour;text('colour-counts',colour?'Colour: '+colour.affected+' affected · '+colour.repaired+' recovered · '+colour.remaining+' unresolved':'Colour evidence unavailable');
 const c=value.counts;text('completed',c.completed);text('total',c.eligible);text('remaining',c.remaining);text('elapsed',duration(value.current?.elapsed_seconds));text('eta',value.eta_seconds==null?value.eta_label:duration(value.eta_seconds));$('eta').title=value.eta_label+' · '+value.eta_samples+' measured successful attempts; excludes human review and repair.';text('human','Review '+c.review+' · Repair '+c.repair+' · Failed '+c.failed);
 $('backlog-progress').max=value.progress.total||1;$('backlog-progress').value=value.progress.completed;text('last',value.last_completed?'Last completed '+value.last_completed.design+' · '+value.last_completed.at:'Last completed —');text('warning',value.warnings.join(' '));$('pause').disabled=actionPending||value.control.paused;$('resume').disabled=actionPending||!value.control.paused;renderHealth(value.health);
 for(const option of $('filter').options)option.textContent=option.value+' ('+(value.filters[option.value]||0)+')';text('queue-count',value.total_rows+' jobs');text('revision',value.revision==='local'?'Local build':value.revision.slice(0,8));renderJobs(value.jobs);text('page-label',value.total_rows?Math.min(offset+1,value.total_rows)+'–'+Math.min(offset+25,value.total_rows)+' / '+value.total_rows:'0 jobs');$('previous').disabled=offset===0;$('next').disabled=offset+25>=value.total_rows;
}
async function load(){if(loading){reloadPending=true;return;}loading=true;const filter=$('filter').value,pageOffset=offset;try{const value=await api('?filter='+encodeURIComponent(filter)+'&offset='+pageOffset);if(filter===$('filter').value&&pageOffset===offset)render(value);}catch(e){text('overall','Unavailable');$('overall').dataset.state='Degraded';text('warning',e.message);$('pause').disabled=true;$('resume').disabled=true;}finally{loading=false;if(reloadPending){reloadPending=false;await load();}}}
async function control(paused){if(actionPending)return;actionPending=true;$('pause').disabled=$('resume').disabled=true;try{const result=await api('/control',{paused});text('overall',result.state);await load();}catch(e){text('warning',e.message);}finally{actionPending=false;if(data){$('pause').disabled=data.control.paused;$('resume').disabled=!data.control.paused;}}}
async function loadLogs(more=false){try{const query=new URLSearchParams({severity:$('severity').value,component:$('component').value,date_from:$('date-from').value,date_to:$('date-to').value,search:$('log-search').value,cursor:more?logCursor||0:0});const result=await api('/diagnostics?'+query);if(!more)$('log-list').replaceChildren();for(const row of result.rows){const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p');s.textContent=row.timestamp+' · '+row.component+' · '+row.design+' · '+row.description;p.textContent=[row.trace+' · '+row.code,'Stage: '+row.stage+' · Attempt: '+(row.attempts??'Unavailable'),'Last checkpoint: '+(row.last_checkpoint||'Unavailable'),'Revision: '+(row.revision||'Not recorded'),'Recovery: '+(row.recovery_attempted?row.recovery_result:'No recovery attempt recorded'),'Next retry: '+(row.next_retry_at||'Not recorded'),row.recommended_action].join('\n');d.append(s,p);$('log-list').append(d);}if(!result.rows.length&&!more)$('log-list').textContent='No matching diagnostics in this bounded history window.';logCursor=result.next_cursor;$('log-more').hidden=!logCursor;logsLoaded=true;}catch(e){$('log-list').textContent=e.message;}}
$('refresh').onclick=load;$('pause').onclick=()=>control(true);$('resume').onclick=()=>control(false);$('filter').onchange=()=>{offset=0;load();};$('previous').onclick=()=>{offset=Math.max(0,offset-25);load();};$('next').onclick=()=>{offset+=25;load();};$('logs-panel').ontoggle=()=>{if($('logs-panel').open&&!logsLoaded)loadLogs();};$('log-refresh').onclick=()=>loadLogs();$('log-more').onclick=()=>loadLogs(true);$('log-search').onkeydown=e=>{if(e.key==='Enter')loadLogs();};$('close-dialog').onclick=()=>$('action-dialog').close();
const timer=setInterval(()=>{if(!document.hidden)load();},20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});addEventListener('pagehide',()=>clearInterval(timer));load();
</script></body></html>
