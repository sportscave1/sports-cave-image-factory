function rowAction(id){const job=jobIndex.get(id);if(!job)return;$('action-dialog').querySelector('iframe').src='/auto-editions/status?product_gid='+encodeURIComponent(id);$('action-dialog').showModal();}
function visualReason(job){const reason=job.diagnostic?job.diagnostic.description+' '+job.diagnostic.recommended_action:job.reason||'No recorded failure.';return job.approval_status&&job.approval_status!==job.status?'Visual: '+job.approval_status+' · '+reason:reason;}
function detailNode(job){const tr=document.createElement('tr');tr.className='details';tr.dataset.detail=job.id;const td=document.createElement('td');td.colSpan=7;tr.append(td);const grid=document.createElement('div');grid.className='detail-grid';
 for(const value of ['Stage: '+job.stage,'Attempts: '+job.attempts,'Checkpoint: '+job.checkpoint,'Job: '+job.id]){const item=document.createElement('span');item.textContent=value;grid.append(item);}td.append(grid);
 const reason=document.createElement('div');reason.textContent=visualReason(job);td.append(reason);

async function populateHistory(id,el){try{let value=history.get(id);if(!value){value=await api('/details?product_gid='+encodeURIComponent(id));history.set(id,value);if(history.size>100)history.delete(history.keys().next().value);}if(!el.isConnected)return;el.replaceChildren();const technical=document.createElement('details'),heading=document.createElement('summary'),pre=document.createElement('pre');heading.textContent='Original technical error and attempt history';pre.className='technical';pre.textContent=['Job: '+id,'Attempt timestamp: '+value.attempt_timestamp,'Original error: '+(value.technical_error||'Not recorded'),...(value.events||[]).map(r=>r.at+' · AE-'+r.id+' · '+r.event+' · '+JSON.stringify(r.detail))].join('\n');technical.append(heading,pre);el.append(technical);}catch(e){el.textContent=e.message;const retry=document.createElement('button');retry.textContent='Retry details';retry.onclick=()=>populateHistory(id,el);el.append(retry);}}
function detailKey(job){return [job.status,job.approval_status,job.stage,job.checkpoint,job.attempts].join('|');}
function updateDetail(tr,job){const cells=tr.querySelectorAll('.detail-grid span');['Stage: '+job.stage,'Attempts: '+job.attempts,'Checkpoint: '+job.checkpoint,'Job: '+job.id].forEach((value,i)=>nodeText(cells[i],value));nodeText(tr.querySelector('.detail-grid').nextElementSibling,visualReason(job));const retry=tr.querySelector('.retry-job');retry.hidden=!job.retry_eligible;retry.disabled=submitting.has(job.id);if(tr.dataset.activity!==detailKey(job)){tr.dataset.activity=detailKey(job);history.delete(job.id);populateHistory(job.id,tr.querySelector('.detail-history'));}}
function toggleJob(id){openId=openId===id?null:id;renderJobs([...jobIndex.values()]);}
function renderJobs(jobs){const pane=$('jobs-pane'),scroll=pane.scrollTop,existing=new Map([...$('jobs').querySelectorAll('tr[data-id]')].map(el=>[el.dataset.id,el])),details=new Map([...$('jobs').querySelectorAll('tr[data-detail]')].map(el=>[el.dataset.detail,el]));const keep=new Set();let cursor=$('jobs').firstChild;const place=el=>{if(el===cursor)cursor=cursor.nextSibling;else $('jobs').insertBefore(el,cursor);};jobIndex=new Map(jobs.map(job=>[job.id,job]));
 for(const job of jobs){let tr=existing.get(job.id);if(!tr){tr=document.createElement('tr');tr.dataset.id=job.id;tr.tabIndex=0;for(let n=0;n<7;n++)tr.append(document.createElement('td'));tr.onclick=()=>toggleJob(job.id);tr.onkeydown=e=>{if(e.target!==tr)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleJob(job.id);}};const action=document.createElement('button');action.onclick=e=>{e.stopPropagation();toggleJob(job.id);};const retry=document.createElement('button');retry.className='retry-job';retry.textContent='Retry';retry.onclick=e=>{e.stopPropagation();retryJob(job.id);};tr.children[6].append(action,retry);}
  const values=[job.design,job.priority===8?'Paid':job.priority===10?'Now':job.priority===7?'Advertised':job.priority,job.stage,job.status,duration(job.elapsed_seconds??job.duration_seconds),job.last_activity];values.forEach((value,n)=>{if(tr.children[n].textContent!==String(value??'—'))tr.children[n].textContent=value??'—';});tr.children[0].title=job.design;tr.children[3].title=job.diagnostic?.recommended_action||job.reason||'';const retry=tr.children[6].querySelector('.retry-job');retry.hidden=!job.retry_eligible;retry.disabled=submitting.has(job.id);if((job.status==='Uploading'||job.status==='Pending'||job.category==='Active')&&!tr.children[3].querySelector('.wh-spinner')){const spinner=document.createElement('span');spinner.className='wh-spinner';spinner.setAttribute('aria-label',job.status==='Pending'?'Pending':'Processing');tr.children[3].prepend(spinner);}if(tr.children[6].firstChild.textContent!=='Details')tr.children[6].firstChild.textContent='Details';tr.classList.toggle('selected',openId===job.id);tr.setAttribute('aria-expanded',String(openId===job.id));place(tr);keep.add(tr);
  if(openId===job.id){let detail=details.get(job.id);if(detail)updateDetail(detail,job);else{detail=detailNode(job);detail.dataset.activity=detailKey(job);}place(detail);keep.add(detail);}
 }
 for(const el of [...$('jobs').children])if(!keep.has(el))el.remove();pane.scrollTop=scroll;$('empty').hidden=jobs.length>0;
}
function render(value){data=value;text('overall',value.overall);$('overall').dataset.state=value.overall;text('updated',value.updated_at);text('current',value.current?.design||'No active preparation');text('stage',value.current?.stage||'');$('job-progress').hidden=!value.current;
 const colour=value.colour,r=value.recovery;text('colour-counts',(colour?'Colour: '+colour.affected+' affected · '+colour.repaired+' recovered · '+colour.remaining+' unresolved':'Colour evidence unavailable')+(r?' · Runnable '+r.runnable+' · Recovering '+r.recovering+' · Needs review '+(r.needs_review??'awaiting scan')+' · '+Object.entries(r.categories||{}).map(([k,v])=>k+' '+v).join(' / '):''));
 const c=value.counts;text('completed',c.completed);text('total',c.eligible);text('remaining',c.remaining);text('elapsed',duration(value.current?.elapsed_seconds));text('eta',value.eta_seconds==null?value.eta_label:duration(value.eta_seconds));$('eta').title=value.eta_label+' · '+value.eta_samples+' measured successful attempts; excludes human review and repair.';text('human','Review '+c.review+' · Repair '+c.repair+' · Failed '+c.failed);
 $('backlog-progress').max=value.progress.total||1;$('backlog-progress').value=value.progress.completed;text('last',value.last_completed?'Last completed '+value.last_completed.design+' · '+value.last_completed.at:'Last completed —');text('warning',value.warnings.join(' '));$('pause').disabled=actionPending||value.control.paused;$('resume').disabled=actionPending||!value.control.paused;renderHealth(value.health);
 for(const option of $('filter').options)nodeText(option,option.value+' ('+(value.filters[option.value]||0)+')');text('revision',value.revision==='local'?'Local build':value.revision.slice(0,8));}
let nextCursor='',scannedTo='',loadedOnce=false,failedList=false,lastRead=0;
function mergeRows(value,replace=false){const merged=replace?new Map():new Map(jobIndex);for(const id of value.removed||[])merged.delete(id);for(const job of value.jobs||[])merged.set(job.id,job);renderJobs([...merged.values()].sort((a,b)=>a.id.localeCompare(b.id)));data={...value.summary,jobs:[...jobIndex.values()]};render(value.summary);text('queue-count',jobIndex.size+' / '+value.total_rows+' loaded');text('page-label','Showing '+jobIndex.size+' of '+value.total_rows+' matching jobs');$('load-more').hidden=nextCursor===null;$('load-more').disabled=loading;}
function load(force=false,more=false){if(loading){if(force===true)reloadPending=true;return inFlight;}loading=true;const epoch=stateEpoch,filter=$('filter').value;inFlight=(async()=>{try{
 const value=(!loadedOnce||more)?await api('/jobs?'+new URLSearchParams({filter,cursor:nextCursor||''})):await api('/updates',{filter,known:Object.fromEntries([...jobIndex].map(([id,j])=>[id,j.version||'0'.repeat(20)])),scanned_to:scannedTo});

 if(!loadedOnce||more){nextCursor=value.next_cursor;scannedTo=value.scanned_to;loadedOnce=true;}failedList=false;lastRead=Date.now();$('list-retry').hidden=true;mergeRows(value);
 }catch(e){if(epoch===stateEpoch){failedList=true;$('list-retry').hidden=false;text('overall','Unavailable');$('overall').dataset.state='Degraded';text('warning',e.message);$('pause').disabled=$('resume').disabled=true;}}

async function control(paused){if(actionPending)return;actionPending=true;stateEpoch++;$('pause').disabled=$('resume').disabled=true;try{const result=await api('/control',{paused});text('overall',result.state);await load(true);}catch(e){text('warning',e.message);}finally{actionPending=false;if(data){$('pause').disabled=data.control.paused;$('resume').disabled=!data.control.paused;}}}
async function loadLogs(more=false){if(more&&logsController)return;logsController?.abort();const controller=new AbortController();logsController=controller;const epoch=++logsEpoch;try{const query=new URLSearchParams({severity:$('severity').value,component:$('component').value,date_from:$('date-from').value,date_to:$('date-to').value,search:$('log-search').value,cursor:more?logCursor||0:0});const result=await api('/diagnostics?'+query,undefined,controller.signal);if(epoch!==logsEpoch)return;if(!more)$('log-list').replaceChildren();for(const row of result.rows){const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p');s.textContent=row.timestamp+' · '+row.component+' · '+row.design+' · '+row.description;p.textContent=[row.trace+' · '+row.code,'Stage: '+row.stage+' · Attempt: '+(row.attempts??'Unavailable'),'Last checkpoint: '+(row.last_checkpoint||'Unavailable'),'Revision: '+(row.revision||'Not recorded'),'Recovery: '+(row.recovery_attempted?row.recovery_result:'No recovery attempt recorded'),'Next retry: '+(row.next_retry_at||'Not recorded'),'Recorded technical error: '+(row.technical_error||'Not retained in this server event; inspect its companion diagnostics.'),row.recommended_action].join('\n');d.append(s,p);$('log-list').append(d);}if(!result.rows.length&&!more)$('log-list').textContent='No matching diagnostics in this bounded history window.';logCursor=result.next_cursor;$('log-more').hidden=!logCursor;logsLoaded=true;}catch(e){if(epoch===logsEpoch&&e.name!=='AbortError')$('log-list').textContent=e.message;}finally{if(epoch===logsEpoch)logsController=null;}}
const submitting=new Set(),requestIDs=new Map(),searchRows=new Map();let repairTarget=null,searchTimer,searchController;
async function submitJob(pid,corrected=false){if(submitting.has(pid))return;submitting.add(pid);const storage='worker-health-retry:'+pid;let id=requestIDs.get(pid);try{id=id||sessionStorage.getItem(storage);}catch{}id=id||crypto.randomUUID();requestIDs.set(pid,id);try{sessionStorage.setItem(storage,id);}catch{}renderJobs([...jobIndex.values()]);
