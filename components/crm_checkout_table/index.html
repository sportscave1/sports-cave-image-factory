<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui;color:#30332e;background:#fff}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;background:#f6f6f3;font-size:12px;color:#64665f;font-weight:600}td,th{padding:7px 10px;border-bottom:1px solid #eeeee8}tbody tr:hover{background:#fafaf7}input{accent-color:#3d5141;cursor:pointer}button{font:inherit;color:#30332e;font-weight:600;background:none;border:0;cursor:pointer;padding:0}button:hover{text-decoration:underline}.pill{display:inline-block;border-radius:20px;padding:3px 8px;font-size:12px;font-weight:550}.red{background:#fce9e7;color:#a23930}.orange{background:#fff0d6;color:#915711}.green{background:#e1f2e7;color:#267143}.wrap{overflow:auto;border:1px solid #e5e5df;border-radius:10px}nav{display:flex;gap:18px;justify-content:flex-end;align-items:center;padding:8px}nav button:disabled{opacity:.4;cursor:default}.empty{padding:24px;text-align:center;color:#73756e}
.enrollment-progress{font-size:11px;font-weight:400;color:#64665f;margin-top:2px;max-width:230px;white-space:normal}.enrollment-progress button{font-size:11px;text-decoration:underline}.busy:before{content:'';display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%;background:#879584;animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.busy:before{animation:none}}
</style></head><body><div id="root"></div><script>
let args={},page=0,selected=new Set(),signature='',seq=0;
const send=(type,data)=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');
function event(detail=null,retry=null){send('streamlit:setComponentValue',{value:{selected:[...selected],detail,retry,sequence:Date.now()+':'+(++seq)},dataType:'json'});}
function cell(tr,text,tag='td'){let el=document.createElement(tag);el.textContent=text;tr.append(el);return el;}
function progressCell(td,r){
 const progress=r.enrollment_progress||{};if(!progress.result)return;
 const el=document.createElement('div');el.className='enrollment-progress';el.setAttribute('role','status');el.textContent=progress.result;
 if(['SAVING','QUEUED','CHECKING'].includes(progress.state)){el.classList.add('busy');}
 if(progress.state==='FAILED'){const retry=document.createElement('button');retry.textContent='Retry';retry.setAttribute('aria-label','Retry '+r.reference);retry.onclick=()=>{retry.disabled=true;event(null,r.key)};el.append(document.createTextNode(' · '),retry);}
 td.append(el);
}
function render(){const rows=args.rows||[],count=Math.ceil(rows.length/50);page=Math.min(page,Math.max(0,count-1));const root=document.getElementById('root');root.replaceChildren();const wrap=document.createElement('div');wrap.className='wrap';root.append(wrap);const t=document.createElement('table');wrap.append(t);const head=t.createTHead().insertRow();let th=cell(head,'','th'),all=document.createElement('input');all.type='checkbox';all.setAttribute('aria-label','Select visible checkouts');const shown=rows.slice(page*50,page*50+50);all.checked=shown.length>0&&shown.every(r=>selected.has(r.key));all.onchange=()=>{shown.forEach(r=>all.checked?selected.add(r.key):selected.delete(r.key));event();render()};th.append(all);['Checkout','Created','Customer name','Region','Recovery status','Time to send'].forEach(x=>cell(head,x,'th'));const body=t.createTBody();shown.forEach(r=>{let tr=body.insertRow(),td=cell(tr,''),check=document.createElement('input');check.type='checkbox';check.checked=selected.has(r.key);check.setAttribute('aria-label','Select '+r.reference);check.onchange=()=>{check.checked?selected.add(r.key):selected.delete(r.key);event();render()};td.append(check);let link=document.createElement('button');link.textContent=r.reference;link.setAttribute('aria-label','Details '+r.reference);link.onclick=()=>event(r.key);const referenceCell=cell(tr,'');referenceCell.append(link);progressCell(referenceCell,r);cell(tr,r.created);cell(tr,r.customer);cell(tr,r.region);let pill=document.createElement('span');pill.className='pill '+({'Not sent':'red','Not recovered':'orange','Recovered':'green'}[r.status]);pill.textContent=r.status;cell(tr,'').append(pill);cell(tr,r.time_to_send||'—');});if(!rows.length){let e=document.createElement('div');e.className='empty';e.textContent='No matching abandoned checkouts';wrap.append(e)}if(count>1){let nav=document.createElement('nav');for(const [label,delta] of [['Previous',-1],['Next',1]]){let b=document.createElement('button');b.textContent=label;b.disabled=delta<0?page===0:page>=count-1;b.onclick=()=>{page+=delta;render()};nav.append(b)}let label=document.createElement('span');label.textContent=(page+1)+' / '+count;nav.append(label);root.append(nav)}send('streamlit:setFrameHeight',{height:Math.min(720,root.scrollHeight+5)});}
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args;const next=JSON.stringify(args.rows.map(r=>r.key));if(next!==signature){page=0;signature=next}selected=new Set((args.selected||[]).filter(k=>args.rows.some(r=>r.key===k)));render()});send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
