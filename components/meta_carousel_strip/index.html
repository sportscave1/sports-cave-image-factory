<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui,sans-serif;color:#292929;background:transparent}
.strip{display:flex;gap:10px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#bbb transparent;padding:2px 2px 6px}
.card{flex:0 0 160px;min-width:0;scroll-snap-align:start}.refresh .card{flex-basis:190px}
.image{display:block;width:100%;height:160px;object-fit:contain;background:#f3f3f3;border:1px solid #ddd;border-radius:5px}.refresh .image{height:190px}
.actions{display:flex;align-items:center;gap:10px;height:30px}.actions span{color:#666;font-size:11px;margin-right:auto}
a,button{color:#725724;font:600 11px system-ui;text-decoration:none;background:transparent;border:0;cursor:pointer;padding:5px 2px}
a:hover,button:hover{text-decoration:underline}a:focus-visible,button:focus-visible,.strip:focus-visible{outline:2px solid #b99448;outline-offset:2px}
.tools{display:flex;align-items:center;gap:12px;height:34px}.tools button{border:1px solid #ddd;border-radius:4px;padding:6px 8px}
#status{font-size:11px;color:#666}.missing{display:grid;place-content:center;color:#777;font-size:12px}
@media(max-width:600px){.card,.refresh .card{flex-basis:75%}.image,.refresh .image{height:160px}}
</style></head><body><div class="strip" role="region" aria-label="Source carousel cards" tabindex="0"></div><div class="tools"><button id="copy-all" type="button">COPY IMAGE URLS</button><span id="status" role="status" aria-live="polite"></span></div>
<script>
const data=__CAROUSEL_DATA__;document.body.classList.toggle('refresh',data.refresh);
const strip=document.querySelector('.strip'),status=document.querySelector('#status');
const absolute=url=>new URL(url,document.baseURI).href;
async function copyText(text){if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return;}
 const field=document.createElement('textarea');field.value=text;field.style.cssText='position:fixed;left:-10000px';document.body.append(field);field.select();const ok=document.execCommand('copy');field.remove();if(!ok)throw Error('Clipboard unavailable');}
async function png(url){const response=await fetch(url,{credentials:'omit'});if(!response.ok)throw Error('Image unavailable');const blob=await response.blob();if(blob.type==='image/png')return blob;
 const source=URL.createObjectURL(blob);try{const image=new Image();image.src=source;await image.decode();const canvas=document.createElement('canvas');canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;canvas.getContext('2d').drawImage(image,0,0);return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Conversion failed')),'image/png'));}finally{URL.revokeObjectURL(source);}}
data.cards.forEach((card,index)=>{const figure=document.createElement('article');figure.className='card';figure.setAttribute('aria-label','Card '+card.number);
 if(card.preview){const img=new Image();img.className='image';img.alt='Source card '+card.number;img.width=190;img.height=190;img.decoding='async';img.loading=index<4?'eager':'lazy';img.src=card.preview;figure.append(img);}else{const missing=document.createElement('div');missing.className='image missing';missing.textContent='Image unavailable';figure.append(missing);}
 const actions=document.createElement('div');actions.className='actions';const label=document.createElement('span');label.textContent='Card '+card.number;actions.append(label);
 if(card.full){const open=document.createElement('a');open.href=card.full;open.target='_blank';open.rel='noopener noreferrer';open.textContent='OPEN';open.setAttribute('aria-label','Open full-resolution card '+card.number);actions.append(open);
 const copy=document.createElement('button');copy.type='button';copy.textContent='COPY';copy.setAttribute('aria-label','Copy image '+card.number);copy.onclick=async()=>{copy.disabled=true;try{if(!navigator.clipboard?.write||typeof ClipboardItem!=='function')throw Error('Image clipboard unavailable');await navigator.clipboard.write([new ClipboardItem({'image/png':png(absolute(card.full))})]);status.textContent='Card '+card.number+' image copied';}catch(e){try{await copyText(absolute(card.full));status.textContent='Card '+card.number+' URL copied';}catch(e){status.textContent='Clipboard unavailable. Use OPEN to access the image.';}}finally{copy.disabled=false;}};actions.append(copy);}
 figure.append(actions);strip.append(figure);
});
document.querySelector('#copy-all').onclick=async()=>{try{await copyText(data.cards.map(c=>c.number+'. '+(c.full?absolute(c.full):'[image unavailable]')).join('\n'));status.textContent='Image URLs copied in source order';}catch(e){status.textContent='Clipboard unavailable. Use OPEN for each image.';}};
strip.addEventListener('keydown',e=>{if(e.target===strip&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();strip.scrollBy({left:e.key==='ArrowRight'?180:-180,behavior:'smooth'});}});
</script></body></html>
