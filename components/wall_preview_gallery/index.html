<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#171717;background:transparent}button,a.action{font:inherit;cursor:pointer;min-height:40px;border:1px solid #ded8ce;border-radius:6px;background:#faf8f4;color:#171717;padding:7px 12px;text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid #a88c50;outline-offset:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{min-width:0;border:1px solid #e4ded4;border-radius:9px;overflow:hidden;background:#faf8f4}.photo{display:block;width:100%;padding:0;border:0;border-radius:0;aspect-ratio:4/3;background:#eee9e0}.photo img{width:100%;height:100%;object-fit:contain;display:block}.info{padding:9px}.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{font-size:12px;color:#736e66;margin-top:4px;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}details summary{cursor:pointer;min-height:32px;padding:6px 0;font-size:12px}.viewer img{display:block;max-width:100%;width:auto;max-height:440px;object-fit:contain;margin:auto}.notice{min-height:20px;color:#736e66;font-size:12px;margin:6px 0}@media(min-width:1600px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.info{padding:7px}.viewer img{max-height:300px}.actions button{flex:1}}

.card{position:relative}.card.selected{border-color:#D4A54C;box-shadow:inset 0 0 0 1px #D4A54C}.select-card{position:absolute;top:3px;left:3px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;z-index:1}.select-card input,.bulk input{width:19px;height:19px;accent-color:#D4A54C;cursor:pointer}.select-card input{box-shadow:0 0 0 4px #faf8f4;border-radius:3px}.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}.bulk label{display:flex;align-items:center;min-height:44px;gap:6px;cursor:pointer}.bulk .scope{flex-basis:100%;font-size:12px;color:#736e66}.bulk button:disabled{opacity:.45;cursor:default}.bulk .delete{border-color:#D4A54C}.selection-count{font-size:13px;color:#736e66}@media(max-width:480px){.bulk{gap:6px}.bulk button{min-height:44px;flex:1}.bulk .delete{flex-basis:100%;order:3}.bulk .scope{order:4}.bulk label{flex:1}}
</style></head><body><main id="root"></main><script>
const root=document.getElementById('root');let args={},selected=new Set(),scope='',appliedSelection=null,viewed=new Set(),acknowledged=new Set();
function syncSelection(){const ids=(args.items||[]).map(x=>x.id);for(const card of root.querySelectorAll('[data-preview-id]')){const checked=selected.has(card.dataset.previewId);card.classList.toggle('selected',checked);card.querySelector('input').checked=checked}const all=document.getElementById('select-visible');if(all){all.checked=ids.length>0&&ids.every(id=>selected.has(id));all.indeterminate=selected.size>0&&!all.checked}const count=document.getElementById('selected-count');if(count)count.textContent=selected.size+' Selected';for(const control of root.querySelectorAll('[data-selection-action]'))control.disabled=!selected.size}
function toolbar(){const bar=el('div',null,'bulk'),label=el('label'),all=el('input');all.type='checkbox';all.id='select-visible';all.onchange=()=>{selected=all.checked?new Set((args.items||[]).map(x=>x.id)):new Set();syncSelection()};label.append(all,document.createTextNode('Select Visible'));const count=el('span','0 Selected','selection-count');count.id='selected-count';count.setAttribute('aria-live','polite');const del=button('Delete Selected',()=>{action('bulk_delete',null)});del.className='delete';del.dataset.selectionAction='delete';const clear=button('Clear Selection',()=>{selected.clear();syncSelection()});clear.dataset.selectionAction='clear';bar.append(label,count,del,clear,el('div','Selection covers the '+(args.items||[]).length+' previews on this page only.','scope'));return bar}
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function height(){send('streamlit:setFrameHeight',{height:Math.ceil(document.body.scrollHeight)+4})}
function action(name,id){send('streamlit:setComponentValue',{value:{action:name,id,ids:name==='bulk_delete'?[...selected]:undefined,scope:args.scope,nonce:crypto.randomUUID()},dataType:'json'})}
function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function button(label,fn){const b=el('button',label);b.type='button';b.onclick=fn;return b}
function save(){const a=el('a');a.href=args.image;a.download=args.filename||'sports-cave-wall-preview.jpg';a.click()}
async function copy(){const notice=document.getElementById('notice');try{if(!navigator.clipboard?.write||!window.ClipboardItem)throw Error('unsupported');const promise=(async()=>{const img=new Image();img.src=args.image;await img.decode();const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);return new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(Error('image')),'image/png'))})();await navigator.clipboard.write([new ClipboardItem({'image/png':promise})]);notice.textContent='✓ Image copied'}catch(e){notice.textContent='Image copying is unavailable in this browser. Use Save Image instead.'}height()}
function render(){if(args.seenId&&!acknowledged.has(args.seenId)){acknowledged.add(args.seenId);parent.postMessage({type:'sc:wall-inbox-seen',id:args.seenId},location.origin)}root.replaceChildren();if(args.mode==='viewer'){root.className='viewer';if(args.image){const img=el('img');img.src=args.image;img.alt=args.title||'Customer wall preview';img.onload=()=>{height();if(img.naturalWidth>0&&!viewed.has(args.id)){viewed.add(args.id);action('viewed',args.id)}};root.append(img);const tools=el('div',null,'actions');tools.append(button('Copy Image',copy),button('Save Image',save));root.append(tools);const status=el('div',null,'notice');status.id='notice';status.role='status';root.append(status)}else root.append(el('p','Image is still processing or temporarily unavailable.'));height();return}root.className='';if(args.canDelete)root.append(toolbar());const grid=el('div',null,'grid');root.append(grid);for(const item of args.items||[]){const card=el('article',null,'card');if(args.canDelete){card.dataset.previewId=item.id;const label=el('label',null,'select-card'),check=el('input');check.type='checkbox';check.setAttribute('aria-label','Select '+item.title+' — '+item.identity);check.onchange=()=>{if(check.checked)selected.add(item.id);else selected.delete(item.id);syncSelection()};label.append(check);card.append(label)}const photo=button('',()=>action('view',item.id));photo.className='photo';photo.setAttribute('aria-label','View '+item.title);if(item.thumbnail){const img=el('img');img.src=item.thumbnail;img.alt=item.title;img.loading='lazy';img.decoding='async';img.width=256;img.height=192;photo.append(img)}else photo.textContent='Preview processing';card.append(photo);const info=el('div',null,'info');info.append(el('div',item.title,'title'),el('div',item.identity,'meta'),el('div',item.date+' · '+item.status,'meta'));const menu=el('details');menu.append(el('summary','Actions'));const controls=el('div',null,'actions');for(const [key,label] of [['view','View'],['copy','Copy'],['save','Save'],['delete','Delete']])if(key!=='delete'||args.canDelete)controls.append(button(label,()=>action(key,item.id)));menu.append(controls);menu.ontoggle=height;info.append(menu);card.append(info);grid.append(card)}syncSelection();height()}
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&args.mode==='viewer'){e.preventDefault();action('close',args.id)}});
window.addEventListener('message',e=>{if(e.source===parent&&e.data.type==='streamlit:render'){args=e.data.args;if(scope!==args.scope){selected.clear();scope=args.scope}const visible=new Set((args.items||[]).map(x=>x.id));selected=new Set([...selected].filter(id=>visible.has(id)));if(args.selectionRevision&&appliedSelection!==args.selectionRevision){selected=new Set((args.selectedIds||[]).filter(id=>visible.has(id)));appliedSelection=args.selectionRevision}render()}});new ResizeObserver(height).observe(root);send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
