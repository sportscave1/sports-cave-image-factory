<!doctype html><html><head><style>
body{margin:0;font:14px Arial;color:#202020;background:#fffefa}#tray{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}button,.item{border:1px solid #ded8cb;border-radius:6px;background:#fff;padding:8px;cursor:grab}button:focus,.item:focus{outline:2px solid #b49450}.item{margin:4px 0;display:flex;align-items:center;gap:8px}.item.active{border-color:#b49450;background:#faf4e5}.label{flex:1}.drop{border-top:3px solid #b49450}#list{min-height:55px;max-height:225px;overflow:auto;padding:4px}small{color:#666}
</style></head><body><div id="tray"></div><div id="list" aria-label="Email blocks"></div><small>Drag a block here. Drag handles to reorder; click to edit. Alt + arrow keys also reorder.</small><script>
let args={},drag=null;
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{event:crypto.randomUUID(),base:args.blocks.map(b=>b.id),type,...extra}},'*');
const height=()=>parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:Math.min(330,document.body.scrollHeight+10)},'*');
function drop(e,index){e.preventDefault();e.stopPropagation();if(!drag)return;if(drag.kind)send('add',{kind:drag.kind,index});else{let ids=args.blocks.map(b=>b.id),old=ids.indexOf(drag.id);ids.splice(old,1);ids.splice(index>old?index-1:index,0,drag.id);send('order',{ids});}drag=null;}
addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args;let tray=document.getElementById('tray'),list=document.getElementById('list');tray.replaceChildren();list.replaceChildren();
for(const kind of args.kinds){let b=document.createElement('button');b.textContent=kind.replaceAll('_',' ');b.draggable=true;b.title='Drag to add '+kind;b.ondragstart=e=>{drag={kind};e.dataTransfer.setData('text/plain',kind)};b.onclick=()=>send('add',{kind,index:args.blocks.length});tray.append(b);}
args.blocks.forEach((b,i)=>{let row=document.createElement('div');row.className='item'+(b.id===args.selected?' active':'');row.tabIndex=0;row.draggable=true;row.ondragstart=e=>{drag={id:b.id};e.dataTransfer.setData('text/plain',b.id)};row.setAttribute('role','button');row.setAttribute('aria-label','Edit '+b.type+' block '+(i+1));let handle=document.createElement('span');handle.textContent='⋮⋮';handle.draggable=true;handle.title='Drag to reorder';handle.ondragstart=()=>drag={id:b.id};row.append(handle);let label=document.createElement('span');label.className='label';label.textContent=b.type+' '+(b.text||b.label||'').slice(0,38);row.append(label);row.onclick=()=>send('select',{id:b.id});row.onkeydown=e=>{if(e.altKey&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();let ids=args.blocks.map(x=>x.id),j=i+(e.key==='ArrowUp'?-1:1);if(j>=0&&j<ids.length){[ids[i],ids[j]]=[ids[j],ids[i]];send('order',{ids});}}else if(e.key==='Enter')send('select',{id:b.id});};row.ondragover=e=>{e.preventDefault();row.classList.add('drop')};row.ondragleave=()=>row.classList.remove('drop');row.ondrop=e=>drop(e,i);for(const [text,type] of [['Copy','copy'],['×','delete']]){let btn=document.createElement('button');btn.textContent=text;btn.setAttribute('aria-label',type+' block '+(i+1));btn.onclick=e=>{e.stopPropagation();send(type,{id:b.id})};row.append(btn);}list.append(row);});list.ondragover=e=>e.preventDefault();list.ondrop=e=>drop(e,args.blocks.length);height();});
// Pointer sorting also works in embedded browsers that do not expose native HTML drag events.
let pointer=null,suppressClickUntil=0;
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('pointerdown',e=>{const tray=e.target.closest('#tray button'),row=e.target.closest('.item');if(!tray&&!row)return;if(row&&e.target.closest('button'))return;pointer={x:e.clientX,y:e.clientY,kind:tray?args.kinds[[...tray.parentElement.children].indexOf(tray)]:null,id:row?args.blocks[[...row.parentElement.children].indexOf(row)].id:null,moved:false};e.target.setPointerCapture(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!pointer)return;if(Math.abs(e.clientX-pointer.x)+Math.abs(e.clientY-pointer.y)>7)pointer.moved=true;if(pointer.moved){document.querySelectorAll('.drop').forEach(n=>n.classList.remove('drop'));let row=document.elementFromPoint(e.clientX,e.clientY)?.closest('.item');if(row)row.classList.add('drop');}});
document.addEventListener('pointerup',e=>{if(!pointer)return;let p=pointer;pointer=null;if(!p.moved)return;suppressClickUntil=Date.now()+500;let target=document.elementFromPoint(e.clientX,e.clientY),list=target?.closest('#list');document.querySelectorAll('.drop').forEach(n=>n.classList.remove('drop'));if(!list)return;let row=target.closest('.item'),index=row?[...list.children].indexOf(row):args.blocks.length;drag=p.kind?{kind:p.kind}:{id:p.id};drop(e,index);});
document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation();}},true);
parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
</script></body></html>
