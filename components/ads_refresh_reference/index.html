<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
body { margin: 0; color: #0b0b0d; font: 14px "Segoe UI", sans-serif; }
button { background: #fff; color: #0b0b0d; border: 1px solid rgba(11,11,13,.55); border-radius: 6px; padding: 9px 14px; font: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid #d4a54c; outline-offset: 2px; }
a { display: inline-block; color: #776026; margin-top: 8px; font-size: 13px; }
#status { margin-top: 6px; font-size: 12px; }
</style></head><body>
<button id="copy" type="button">Copy winning image</button><br>
<a id="open" target="_blank" rel="noopener">Open full-resolution image</a>
<div id="status" role="status" aria-live="polite"></div>
<script>
const reference = __WINNING_IMAGE__;
const bytes = Uint8Array.from(atob(reference.base64), value => value.charCodeAt(0));
const original = new Blob([bytes], {type: reference.mime});
const originalUrl = URL.createObjectURL(original);
const openImage = document.getElementById('open');
openImage.href = originalUrl;
const button = document.getElementById('copy');
const status = document.getElementById('status');
// PNG can go straight to the clipboard. Other formats are decoded at natural
// resolution into lossless PNG only because image/png is widely supported.
async function clipboardImage() {
  if (original.type === 'image/png') return original;
  const image = new Image();
  image.src = originalUrl;
  await image.decode();
  const canvas = document.createElement('canvas');
  canvas.width = image.naturalWidth;
  canvas.height = image.naturalHeight;
  canvas.getContext('2d').drawImage(image, 0, 0);
  return new Promise((resolve, reject) => canvas.toBlob(
    blob => blob ? resolve(blob) : reject(new Error('Image conversion unavailable')), 'image/png'));
}
button.addEventListener('click', async () => {
  try {
    if (!window.isSecureContext || !navigator.clipboard?.write || typeof ClipboardItem !== 'function') {
      throw new Error('Image clipboard unavailable');
    }
    // Pass the promise immediately, preserving the browser's click activation.
    await navigator.clipboard.write([new ClipboardItem({'image/png': clipboardImage()})]);
    button.textContent = '✓ Copied — paste into ChatGPT';
    status.textContent = '';
  } catch (_error) {
    button.textContent = 'Copy winning image';
    status.textContent = 'Open the full-resolution image, then right-click → Copy image.';
    openImage.focus();
  }
});
</script></body></html>
