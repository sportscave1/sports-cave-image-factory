  if (liveNavigationEpoch > incomingNavigationEpoch) return;

  const icon = (name) => {
    const paths = {
      search: '<circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path>',
      menu: '<path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path>',

    return `<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${paths[name] || ""}</svg>`;

  const css = `

      grid-template-columns: var(--sc-sidebar-width) minmax(0, auto) minmax(260px, 1fr) auto;

      left: 0;
      position: fixed;
      right: 0;
      top: 0;
      width: 100%;
      z-index: 999999;

    #${LOADER_ID} {

      background: rgba(250, 249, 246, .985);
      bottom: 0;
      display: none;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
      justify-content: center;

      pointer-events: none;
      position: fixed;
      right: 0;

    .sc-loading-spinner {

      height: 22px;
      width: 22px;
    }
    .sc-loading-only {

      justify-content: center;
      min-height: 72px;
      width: 100%;

    .sc-loading-only.sc-loading-only--compact { min-height: 44px; }
    @keyframes sc-loading-spin { to { transform: rotate(360deg); } }
    body.sc-navigation-pending .sc-route-loading {

      color: #8a6720 !important;

    }
    #sc-os-order-toast-region[hidden] { display: none !important; }

      position: fixed;
      right: 16px;
      top: calc(var(--sc-topbar-height) + 66px);

      width: min(340px, calc(100vw - 32px));
      z-index: 1000002;
    }
    #sc-os-repair-toast-region[hidden] { display: none !important; }

      border-radius: 7px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, .26);
      color: #fff;
      display: flex;
      font: inherit;
      font-size: 13px;
      font-weight: 680;
      min-height: 46px;
      padding: 0;
      position: relative;
      text-align: left;
      width: 100%;
    }
    .sc-os-toast-open {

      appearance: none;

      border: 0;
      color: inherit;

          }, 1000));
        }
        root.dataset.installStage = "ready";
      },
      beginNavigation(routeKey = "", label = "", sourceElement = null) {
        return beginNavigation(routeKey, label, sourceElement);
      },
      completeNavigation({routeKey = "", epoch = 0, status = "ready"} = {}) {
        const liveEpoch = Number(root.dataset.navigationEpoch || 0);
        if (Number(epoch || 0) && liveEpoch > Number(epoch || 0)) return false;
        if (routeKey && routeKey !== state.config.currentRouteKey) return false;
        const pending = readPendingNavigation();
        if (pending.route_key && !routeKey) return false;
        if (pending.route_key && routeKey && pending.route_key !== routeKey) return false;
        if (
          pending.expected_epoch
          && Number(epoch || 0) < Number(pending.expected_epoch || 0)
        ) return false;
        if (
          root.dataset.acceptedNavigationId
          && pending.navigation_id
          && Number(root.dataset.acceptedNavigationId) !== Number(pending.navigation_id)
        ) return false;
        const wasPending = doc.body.classList.contains("sc-navigation-pending")
          || Boolean(root.dataset.pendingRouteKey);
        if (wasPending || !root.dataset.lastNavigationStatus) {
          root.dataset.lastNavigationStatus = String(status || "ready");
          root.dataset.lastNavigationCompletedAt = String(Date.now());
        }
        if (wasPending) {
          root.dataset.lastNavigationUsableMs = String(
            Math.max(0, Date.now() - Number(root.dataset.navigationStartedAt || Date.now())),
          );
        }
        root.dataset.pendingRouteKey = "";
        root.dataset.acceptedRouteKey = String(routeKey || state.config.currentRouteKey || "");
        root.dataset.acceptedNavigationEpoch = String(epoch || liveEpoch || 0);
        clearNavigationPending({clearIntent: true});
        if (mobileViewport()) closeMobileNavigation();
        return true;
      },
      destroy({preserveDom = false} = {}) {
        state.destroyed = true;
        state.plannerDataRefreshPending = false;
        listenerController.abort();
        if (state.plannerStatusTimer) parentWindow.clearTimeout(state.plannerStatusTimer);
        timers.forEach((timer) => {
          parentWindow.clearTimeout(timer);
          parentWindow.clearInterval(timer);
        });
        timers.clear();
        plannerChannel?.close();
        stopPlannerChime();
        if (state.recorder?.state && state.recorder.state !== "inactive") {
          state.recorder.stop();
        }
        state.recordingStream?.getTracks().forEach((track) => track.stop());
        doc.body.classList.remove("sc-mobile-nav-open", "sc-mobile-search-open");
        if (!preserveDom) {
          navBackdrop.remove();
          navigationLoader.remove();
          doc.body.classList.remove("sc-navigation-pending", "sc-navigation-slow");
          root.remove();
        }
      }
    };
  };

  // Streamlit replaces the component iframe on rerun. Rebind from the live realm
  // while preserving the parent-document shell and aborting every old listener.
  parentWindow.SportsCaveTopBar?.destroy?.({preserveDom: true});
  parentWindow.SportsCaveTopBar = createController();
  parentWindow.SportsCaveTopBar.install(config);
})();
</script>
