<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Download JPG</title>
<style>body{font:14px system-ui;color:#18212f;margin:16px}[hidden]{display:none!important}h2{font-size:17px;margin:0 0 9px}p{margin:8px 0}small{color:#667085;font-size:12px}a,button{font:inherit;border:1px solid #ccd2da;background:#f7f8fa;color:inherit;border-radius:6px;padding:7px 10px;text-decoration:none}.spin{display:inline-block;width:12px;height:12px;margin-right:7px;border:2px solid #ddd;border-top-color:#b58d35;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
<h2>Download edition JPG</h2><p>Dick Johnson &amp; John French — The Comeback<br><strong>SC3284 · #002/100 · unit 1</strong></p>
<small>TEST / NOT PRINT READY — supplier pixels, bleed and safe margins are not yet verified.</small>
<p role="status"><span id="spinner" class="spin"></span><span id="status">Generating...</span></p><a id="download" hidden>Ready — Download JPG</a>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const local='http://127.0.0.1:18762';let nonce='',grant=null,connected=false,started=false,completed=null,timer,url;
const status=t=>$('status').textContent=t;
function send(type,extra={}){parent.postMessage({type:'edition-relay',payload:{studio:1,nonce,type,...extra}},location.origin);}
function fail(message){clearInterval(timer);$('spinner').hidden=true;status(message);}
function begin(){if(connected&&grant&&!started){started=true;clearInterval(timer);send('edition-test',{grant});}}
async function connect(d){if(nonce)return;if(!/^edition=[a-f0-9]{48}$/.test(d.nonce||'')||!d.popup_available){fail('Allow the Sports Cave companion window, then click Download JPG again.');return;}nonce=d.nonce;
try{const response=await fetch('/api/edition-jpg-test/prepare',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const result=await response.json();if(!response.ok)throw Error(result.message||'Your session, Files permission or artwork identity could not be verified.');grant=result.grant;begin();let attempts=0;send('request');timer=setInterval(()=>{if(started||++attempts>60){clearInterval(timer);if(!started)fail('The existing Windows companion is unavailable. Start it on this computer, then click Download JPG again.');return;}send('request');},500);}catch(error){fail(error.message);}}
window.addEventListener('message',async event=>{if(event.source!==parent||event.origin!==location.origin)return;const d=event.data;if(d?.type==='edition-connect'){connect(d);return;}if(d?.studio!==1||d.nonce!==nonce)return;
if(d.type==='catalog'){connected=true;begin();}
if(d.type==='edition-progress')status('Generating...');
if(d.type==='edition-result'){if(d.error){fail(d.error);return;}const r=d.result;if(!r?.test_only||r.edition!=='002 / 100'||!r.validated){fail('Artwork identity validation failed. Download blocked.');return;}completed=r;status('Preparing download...');send('edition-download',{job_id:r.job_id});}
if(d.type==='edition-download'){try{if(d.error)throw Error(d.error);const r=d.result;if(!r?.test_only||r.edition!=='002 / 100'||!r.validated||r.job_id!==completed?.job_id)throw Error('Download identity validation failed.');const bytes=Uint8Array.from(atob(r.jpg_base64),c=>c.charCodeAt(0));const sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');if(sha!==r.jpg_sha256)throw Error('Download checksum failed.');if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));const a=$('download');a.href=url;a.download=r.filename;a.hidden=false;$('spinner').hidden=true;status('Ready — TEST JPG downloaded. If it did not start, use Download JPG below.');a.click();parent.postMessage({type:'edition-finished'},location.origin);}catch(error){fail(error.message);}}
});
window.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();parent.postMessage({type:'sports-cave-psd-cancel'},location.origin);}});
window.addEventListener('unload',()=>{clearInterval(timer);if(url)URL.revokeObjectURL(url);});
})();
</script></html>
