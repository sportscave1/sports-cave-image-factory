<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edition TEST JPG</title>
<style>body{font:14px system-ui;color:#18212f;margin:20px}button,a{font:inherit;border-radius:6px;padding:8px 12px;border:1px solid #ccd2da;background:#f7f8fa;color:#18212f;text-decoration:none}img{max-width:100%;max-height:55vh;display:block;margin:12px auto}small{color:#667085}#status{white-space:pre-wrap}input{max-width:90%;padding:5px}button:disabled{opacity:.5}</style>
<h2>Edition TEST JPG</h2><p>Dick Johnson &amp; John French — The Comeback<br><strong>SC3284 · #002/100 · unit 1</strong></p><small>TEST ONLY · Original PSD resolution · Not certified for Prodigi. Master PSD is never overwritten.</small>
<p><label>Paired Studio companion <input id="origin" value="http://127.0.0.1:18762" aria-label="Paired Studio companion"></label></p><button id="generate">Generate / Preview TEST JPG</button> <a id="download" hidden>Download TEST JPG</a><p id="status" role="status">Connect the existing paired Windows companion to generate the artwork.</p><img id="preview" hidden alt="Actual generated artwork for SC3284 edition 002 of 100">
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let popup,nonce,local,grant,started=false,connected=false,url,completed=null;const status=t=>$('status').textContent=t;
function send(type,extra={}){popup?.postMessage({studio:1,nonce,type,...extra},local);}
function begin(){if(connected&&grant&&!started){started=true;send('edition-test',{grant});}}
$('generate').onclick=async()=>{try{const u=new URL($('origin').value);if(u.protocol!=='http:'||u.hostname!=='127.0.0.1'||!u.port||u.pathname!=='/'||u.search||u.hash||u.username||u.password)throw Error('Enter the existing companion localhost origin only.');local=u.origin;nonce=Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('');started=false;connected=false;grant=null;popup=window.open(local+'/pair#'+nonce,'_blank');if(!popup)throw Error('Allow the companion popup, then retry.');$('generate').disabled=true;status('Verifying allocation and Dropbox identity…');const r=await fetch('/api/edition-jpg-test/prepare',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Files permission or test identity could not be verified.');grant=d.grant;begin();let attempts=0;const timer=setInterval(()=>{if(started||++attempts>60){clearInterval(timer);if(!started){status('Companion did not connect. Open Developer Studio, confirm this existing device connection, then retry.');$('generate').disabled=false;}return;}send('request');},500);}catch(e){status(e.message);$('generate').disabled=false;}};
window.addEventListener('message',e=>{const d=e.data;if(e.source!==popup||e.origin!==local||!d||d.studio!==1||d.nonce!==nonce)return;if(d.type==='catalog'){connected=true;begin();}if(d.type==='edition-progress')status(d.status||'Generating in Photoshop…');if(d.type==='edition-result'){if(d.error){status(d.error);$('generate').disabled=false;return;}const r=d.result;if(!r?.test_only||r.edition!=='002 / 100'||!r.validated){status('Output identity/validation failed. No download authorised.');return;}completed=r;$('preview').src=r.preview;$('preview').hidden=false;$('download').href='#';$('download').hidden=false;status(`TEST JPG validated · ${r.dimensions.join(' × ')} px · original resolution · #002/100. Not Print Ready.`);$('generate').disabled=false;}});

$('download').onclick=e=>{e.preventDefault();if(!completed)return;status('Rechecking Files permissions, allocation and source before download…');send('edition-download',{job_id:completed.job_id});};
window.addEventListener('message',async e=>{const d=e.data;if(e.source!==popup||e.origin!==local||!d||d.studio!==1||d.nonce!==nonce||d.type!=='edition-download')return;
try{if(d.error)throw Error(d.error);const r=d.result;if(!r?.test_only||r.edition!=='002 / 100'||!r.validated||r.job_id!==completed?.job_id)throw Error('Download identity validation failed.');
const bytes=Uint8Array.from(atob(r.jpg_base64),c=>c.charCodeAt(0));const sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');if(sha!==r.jpg_sha256)throw Error('Download checksum failed.');
if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));const a=document.createElement('a');a.href=url;a.download=r.filename;document.body.append(a);a.click();a.remove();status('Downloaded full-resolution #002/100 TEST JPG. Not certified for Prodigi.');
}catch(error){status(error.message);}});
})();
</script></html>
