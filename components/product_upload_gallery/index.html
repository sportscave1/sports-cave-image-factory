<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:14px system-ui;color:#ece9e3;background:transparent}button,a.action{border:1px solid #555045;border-radius:7px;background:#25241f;color:inherit;padding:8px 13px;cursor:pointer;text-decoration:none;font:inherit}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:8px;align-items:center}img{max-width:100%;height:245px;object-fit:contain;cursor:zoom-in;border-radius:7px}a:focus-visible,button:focus-visible{outline:2px solid #c4a269;outline-offset:2px}#status{font-size:12px;margin-top:7px}#menu{position:fixed;display:none;background:#25241f;z-index:3;padding:5px;border:1px solid #777}#open{font-size:12px;color:#d5bc89}small{font-size:11px;color:#c0bcb3}
</style></head><body><div id="view"></div><div id="status" role="status" aria-live="polite"></div><div id="menu"><button id="contextCopy">Copy full-resolution image</button></div><script>
const config=/*CONFIG*/{};
const view=document.querySelector('#view'),status=document.querySelector('#status');
const origin=new URL(document.referrer||location.href).origin;
const original=config.original?new URL(config.original,origin).href:'';
const controller=new AbortController();
addEventListener('pagehide',()=>controller.abort());
function button(text,id){const b=document.createElement('button');b.textContent=text;b.id=id;return b;}
function openLink(){const a=document.createElement('a');a.href=original;a.target='_blank';a.rel='noopener';a.textContent='Open original';a.id='open';return a;}
let imageButton;
if(config.copyRow){
 view.className='row';imageButton=button('Copy black frame','copyImage');imageButton.disabled=!original;view.append(imageButton);
 const textButton=button('Copy prompt','copyPrompt');view.append(textButton);
 textButton.onclick=async()=>{textButton.textContent='Copying…';status.textContent='';try{if(!navigator.clipboard?.writeText)throw Error();await navigator.clipboard.writeText(config.prompt);textButton.textContent='Copied';}catch{status.textContent='Clipboard access was denied or is unsupported. Allow clipboard access and retry.';textButton.textContent='Copy prompt';}};
}else if(config.preview){
 const a=openLink();a.setAttribute('aria-label','Open '+config.label+' full-resolution original');a.textContent='';const img=document.createElement('img');img.src=config.preview;img.alt=config.label;a.append(img);view.append(a);
 if(config.copyAction){const row=document.createElement('div');row.className='row';imageButton=button('Copy full-resolution image','copyImage');imageButton.disabled=!original;row.append(imageButton);view.append(row);}
 const note=document.createElement('small');note.textContent='Preview shown · click to open original';view.append(note);
 a.oncontextmenu=e=>{e.preventDefault();const menu=document.querySelector('#menu');menu.style.display='block';menu.style.left=Math.min(e.clientX,innerWidth-235)+'px';menu.style.top=Math.min(e.clientY,innerHeight-45)+'px';};
}
async function originalPng(){
 const response=await fetch(original,{credentials:'same-origin',cache:'no-store',signal:controller.signal});
 if(!response.ok)throw Error('Original unavailable or replaced. Reopen the current mockup.');
 const blob=await response.blob();
 if(controller.signal.aborted)throw Error('Selection changed.');
 if(blob.type==='image/png')return blob;
 if(!blob.type.startsWith('image/'))throw Error('The original could not be loaded.');
 const bitmap=await createImageBitmap(blob);
 try{const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;canvas.getContext('2d').drawImage(bitmap,0,0);const png=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('PNG conversion failed.')),'image/png'));if(controller.signal.aborted)throw Error('Selection changed.');return png;}finally{bitmap.close();}
}
async function copyImage(){
 if(!imageButton)imageButton=document.querySelector('#contextCopy');
 if(!original||imageButton.disabled)return;const previous=imageButton.textContent;imageButton.disabled=true;imageButton.textContent='Copying…';status.textContent='';
 try{
  if(!navigator.clipboard?.write||!window.ClipboardItem)throw Error('Image clipboard is unsupported. Open the original to copy it.');
  // Start clipboard write within the click gesture; fetch/decode stays asynchronous.
  await navigator.clipboard.write([new ClipboardItem({'image/png':originalPng()})]);
  imageButton.textContent='Copied';
 }catch(error){imageButton.textContent=previous;status.textContent='Could not copy image. Allow clipboard access or open the original. ';status.append(openLink());}
 finally{imageButton.disabled=false;}
}
if(imageButton)imageButton.onclick=copyImage;
document.querySelector('#contextCopy').onclick=()=>{document.querySelector('#menu').style.display='none';copyImage();};
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))document.querySelector('#menu').style.display='none';});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#menu').style.display='none';});
</script></body></html>
