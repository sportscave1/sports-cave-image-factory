<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text,#252930);font:14px var(--font,system-ui)}main{padding:2px 0}.gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:760px}.preview{min-width:0;text-align:center}.preview a{display:flex;align-items:center;justify-content:center;height:114px;cursor:zoom-in;border-radius:5px}.preview img{display:block;max-width:100%;width:140px;height:110px;object-fit:contain;border-radius:5px}.preview .label{display:block;font-size:12px;line-height:18px;margin-top:3px}.single a{display:flex;align-items:center;justify-content:center;cursor:zoom-in}.single img{max-width:100%;height:245px;object-fit:contain;border-radius:7px}.single small{font-size:11px;color:var(--text,#62676e)}.actions{display:flex;align-items:center;gap:8px}button{font:inherit;font-weight:550;border:1px solid #d4d7db;border-radius:7px;background:var(--background,#fff);color:var(--text,#30343a);padding:8px 13px;min-height:38px;cursor:pointer}button:hover{filter:brightness(.97)}button:disabled{opacity:.5;cursor:default}a:focus-visible,button:focus-visible{outline:2px solid #aa8439;outline-offset:2px}#status{font-size:12px;line-height:18px;margin-top:6px}#status:empty{display:none}#status a{color:inherit;margin-left:5px}
</style></head><body><main id="root"></main><script src="app.js"></script></body></html>
