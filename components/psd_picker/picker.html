<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
[hidden]{display:none!important}body{overflow-wrap:anywhere;font:14px system-ui;margin:16px;color:#222}input,select,button{max-width:100%;font:inherit;padding:7px;box-sizing:border-box}#search,#files{width:100%;margin:6px 0}#files{height:220px}#preview{max-width:140px;max-height:130px;float:right}label{display:block;margin:9px 0}#message{color:#805000;white-space:pre-wrap}button{margin-right:6px}#identity{font-weight:600}
</style></head><body><div id="identity">Loading product…</div><input id="search" placeholder="Search approved PSD filenames" aria-label="Search approved PSD filenames"><select id="files" size="9" aria-label="Approved PSD files"></select><img id="preview" hidden alt="Selected artwork preview"><div id="selected"></div><label id="mismatch-label" hidden><input id="mismatch" type="checkbox">Filename differs — I confirm this is the correct artwork.</label><label id="replace-label" hidden><input id="replace" type="checkbox">Replace this product’s existing PSD mapping and record the change.</label><div id="message" role="status"></div><button id="retry" hidden>Retry</button><button id="save" disabled>Save PSD</button><button id="cancel">Cancel</button><script>
const $=id=>document.getElementById(id),pid=new URLSearchParams(location.search).get('product_gid');let data=null,selected=null;
async function api(url,options){const response=await fetch(url,{credentials:'same-origin',...options});let result;try{result=await response.json();}catch{throw Error('The picker could not be loaded. Sign in with the same authorised account and retry.');}if(!response.ok)throw Error(result.message||'PSD request unavailable');return result;}
function filter(){const query=$('search').value.toLocaleLowerCase();$('files').replaceChildren();for(const file of (data?.files||[]).filter(f=>f.name.toLocaleLowerCase().includes(query))){const option=document.createElement('option');option.value=file.id;option.textContent=file.name;$('files').append(option);}selected=null;$('save').disabled=true;$('preview').hidden=true;$('selected').textContent='';$('mismatch-label').hidden=true;$('replace-label').hidden=true;}
$('search').disabled=true;$('files').disabled=true;$('search').oninput=filter;
addEventListener('keydown',event=>{if(event.key==='Escape')parent.postMessage({type:'sports-cave-psd-cancel'},location.origin);});
new ResizeObserver(()=>parent.postMessage({type:'sports-cave-psd-size',height:document.body.scrollHeight+32},location.origin)).observe(document.body);
$('files').onchange=()=>{selected=data.files.find(f=>f.id===$('files').value);$('selected').textContent=selected?.name||'';$('mismatch').checked=false;$('replace').checked=false;$('mismatch-label').hidden=!selected?.mismatch;$('replace-label').hidden=!data.current_file_id||data.can_replace===false;$('preview').hidden=!selected?.thumbnail_url;if(selected?.thumbnail_url)$('preview').src=selected.thumbnail_url;$('save').disabled=!selected||selected.assigned_other;$('message').textContent=selected?.assigned_other?'This PSD is already assigned to another product.':'';};
$('preview').onerror=()=>{$('preview').hidden=true;};
$('cancel').onclick=()=>parent.postMessage({type:'sports-cave-psd-cancel'},location.origin);
$('save').onclick=async()=>{if(!selected)return;if(selected.mismatch&&!$('mismatch').checked){$('message').textContent='Confirm the filename mismatch first.';return;}if(data.current_file_id&&data.can_replace===false){$('message').textContent='Only an administrator can replace an existing PSD mapping.';return;}if(data.current_file_id&&!$('replace').checked){$('message').textContent='Confirm replacement first.';return;}$('save').disabled=true;try{await api('/api/files-psd-attach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_gid:pid,file_id:selected.id,expected_file_id:data.current_file_id||'',confirm_mismatch:$('mismatch').checked,confirm_replace:$('replace').checked})});parent.postMessage({type:'sports-cave-psd-saved',product_gid:pid},location.origin);}catch(error){$('message').textContent=error.message;$('save').disabled=false;}};
async function load(){data=null;selected=null;$('save').disabled=true;$('search').disabled=true;$('files').disabled=true;$('retry').hidden=true;$('identity').textContent='Loading product…';$('message').textContent='';try{data=await api('/api/files-psd-options?product_gid='+encodeURIComponent(pid));$('identity').textContent='Attach PSD to: '+data.product_title;if(data.current_file_id&&data.can_replace===false)throw Error('Only an administrator can replace an existing PSD mapping.');$('search').disabled=false;$('files').disabled=false;filter();if(!data.files.length)$('message').textContent='No approved PSD masters are available. The review folder is excluded.';}catch(error){$('identity').textContent='PSD picker unavailable';$('message').textContent=error.message;$('retry').hidden=false;}}$('retry').onclick=load;load();
</script></body></html>
