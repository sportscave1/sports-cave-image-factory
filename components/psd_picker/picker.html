<!doctype html><html><head><meta charset="utf-8"><style>
[hidden]{display:none!important}body{font:14px system-ui;margin:16px;color:#222}input,select,button{font:inherit;padding:7px;box-sizing:border-box}#search,#files{width:100%;margin:6px 0}#files{height:220px}#preview{max-width:140px;max-height:130px;float:right}label{display:block;margin:9px 0}#message{color:#805000;white-space:pre-wrap}button{margin-right:6px}#identity{font-weight:600}
</style></head><body><div id="identity">Loading product…</div><input id="search" placeholder="Search approved PSD filenames" aria-label="Search approved PSD filenames"><select id="files" size="9" aria-label="Approved PSD files"></select><img id="preview" hidden alt="Selected artwork preview"><div id="selected"></div><label id="mismatch-label" hidden><input id="mismatch" type="checkbox">Filename differs — I confirm this is the correct artwork.</label><label id="replace-label" hidden><input id="replace" type="checkbox">Replace this product’s existing PSD mapping and record the change.</label><div id="message" role="status"></div><button id="save" disabled>Save PSD</button><button id="cancel">Cancel</button><script>
const $=id=>document.getElementById(id),pid=new URLSearchParams(location.search).get('product_gid');let data=null,selected=null;
async function api(url,options){const response=await fetch(url,options);const result=await response.json();if(!response.ok)throw Error(result.message||'PSD request unavailable');return result;}
function filter(){const query=$('search').value.toLocaleLowerCase();$('files').replaceChildren();for(const file of data.files.filter(f=>f.name.toLocaleLowerCase().includes(query))){const option=document.createElement('option');option.value=file.id;option.textContent=file.name;$('files').append(option);}selected=null;$('save').disabled=true;$('preview').hidden=true;$('selected').textContent='';$('mismatch-label').hidden=true;$('replace-label').hidden=true;}
$('search').oninput=filter;
$('files').onchange=()=>{selected=data.files.find(f=>f.id===$('files').value);$('selected').textContent=selected?.name||'';$('mismatch').checked=false;$('replace').checked=false;$('mismatch-label').hidden=!selected?.mismatch;$('replace-label').hidden=!data.current_file_id;$('preview').hidden=!selected?.thumbnail_url;if(selected?.thumbnail_url)$('preview').src=selected.thumbnail_url;$('save').disabled=!selected;$('message').textContent=selected?.assigned_other?'This PSD is already assigned to another product.':'';};
$('preview').onerror=()=>{$('preview').hidden=true;};
$('cancel').onclick=()=>parent.postMessage({type:'sports-cave-psd-cancel'},location.origin);
$('save').onclick=async()=>{if(!selected)return;if(selected.mismatch&&!$('mismatch').checked){$('message').textContent='Confirm the filename mismatch first.';return;}if(data.current_file_id&&!$('replace').checked){$('message').textContent='Confirm replacement first.';return;}$('save').disabled=true;try{await api('/api/files-psd-attach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_gid:pid,file_id:selected.id,expected_file_id:data.current_file_id||'',confirm_mismatch:$('mismatch').checked,confirm_replace:$('replace').checked})});parent.postMessage({type:'sports-cave-psd-saved',product_gid:pid},location.origin);}catch(error){$('message').textContent=error.message;$('save').disabled=false;}};
api('/api/files-psd-options?product_gid='+encodeURIComponent(pid)).then(result=>{data=result;$('identity').textContent='Attach PSD to: '+data.product_title;filter();}).catch(error=>{$('identity').textContent='PSD picker unavailable';$('message').textContent=error.message;});
</script></body></html>
