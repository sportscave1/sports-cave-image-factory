<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sports Cave Daily Planner</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171715;
      --muted: #706d67;
      --line: #dedbd4;
      --soft: #f6f4ef;
      --paper: #fffefa;
      --gold: #d4a54c;
      --gold-dark: #8d671f;
      --danger: #a33a32;
      --success: #28724b;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--soft); color: var(--ink); font-size: 13px; overflow: hidden; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--gold); outline-offset: 2px;
    }
    .shell { display: grid; grid-template-rows: 48px 39px minmax(0, 1fr) 24px; height: 100%; }
    .header {
      align-items: center; background: #11110f; border-bottom: 1px solid #2b2924;
      color: white; display: flex; gap: 10px; padding: 0 14px;
    }
    .brand-mark { color: var(--gold); font-family: Georgia, serif; font-size: 23px; line-height: 1; }
    .header-title { font-size: 14px; font-weight: 730; }
    .header-subtitle { color: #aaa79f; font-size: 10px; margin-left: 7px; text-transform: uppercase; }
    .header-spacer { flex: 1; }
    .icon-button {
      align-items: center; background: transparent; border: 1px solid transparent; border-radius: 5px;
      color: inherit; display: inline-flex; height: 30px; justify-content: center; min-width: 30px; padding: 0 8px;
    }
    .icon-button:hover { background: #292823; border-color: #3b3932; }
    .tabs { align-items: stretch; background: #fff; border-bottom: 1px solid var(--line); display: flex; padding: 0 12px; }
    .tab {
      background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
      font-weight: 650; min-width: 88px; padding: 0 13px;
    }
    .tab[aria-selected="true"] { border-bottom-color: var(--gold); color: var(--ink); }
    .main { min-height: 0; overflow: auto; padding: 12px 14px 20px; }
    .statusbar {
      align-items: center; background: #eeece6; border-top: 1px solid var(--line); color: var(--muted);
      display: flex; font-size: 10px; justify-content: space-between; padding: 0 12px;
    }
    .toolbar { align-items: center; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .toolbar .date-input { width: 142px; }
    .button {
      align-items: center; background: white; border: 1px solid #cfcac0; border-radius: 5px; color: var(--ink);
      display: inline-flex; font-weight: 650; gap: 5px; height: 31px; justify-content: center; padding: 0 10px;
    }
    .button:hover { background: #f5f2eb; border-color: #a99d84; }
    .button.primary { background: var(--gold); border-color: var(--gold); color: #17130d; }
    .button.finish { background: var(--success); border-color: var(--success); color: white; }
    .button.skip { background: #f1eee7; border-color: #bbb4a8; color: #4f4b44; }
    .button.danger { color: var(--danger); }
    .button.small { height: 27px; padding: 0 8px; }
    .button:disabled { cursor: not-allowed; opacity: .45; }
    .section-title { align-items: center; display: flex; gap: 8px; margin: 14px 0 7px; }
    .section-title h2 { font-size: 14px; margin: 0; }
    .section-title .rule { background: var(--line); flex: 1; height: 1px; }
    .meta-row { color: var(--muted); display: flex; flex-wrap: wrap; gap: 14px; margin: -3px 0 9px; }
    .task-header, .task-row {
      display: grid; gap: 6px; grid-template-columns: 28px minmax(150px, 1.5fr) minmax(170px, 1.8fr) 88px 112px minmax(250px, auto);
    }
    .task-header { color: var(--muted); font-size: 10px; font-weight: 700; padding: 0 5px 4px; text-transform: uppercase; }
    .task-row {
      align-items: start; background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
      margin-bottom: 6px; padding: 7px 6px;
    }
    .task-index { color: var(--gold-dark); font-weight: 800; padding-top: 7px; text-align: center; }
    input, textarea, select {
      background: white; border: 1px solid #cfcac0; border-radius: 4px; color: var(--ink); min-height: 30px; padding: 5px 7px; width: 100%;
    }
    textarea { min-height: 58px; resize: vertical; }
    .timer-cell { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; }
    .duration-input { width: 64px; }
    .countdown { font-variant-numeric: tabular-nums; font-weight: 760; min-width: 54px; padding: 7px 4px 0; }
    .timer-cell .button { flex: 0 0 auto; }
    .move-buttons { display: flex; gap: 3px; margin-top: 4px; }
    .move-buttons button { background: transparent; border: 0; color: var(--muted); padding: 2px 3px; }
    .planning-grid { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
    .planning-grid label, .review-grid label { color: var(--muted); display: grid; font-size: 11px; gap: 4px; }
    .planning-grid .wide { grid-column: 1 / -1; }
    .save-row { align-items: center; display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    .save-state { color: var(--muted); margin-right: auto; }
    .save-state.error { color: var(--danger); }
    .empty {
      align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
      display: flex; justify-content: space-between; min-height: 74px; padding: 14px;
    }
    .empty strong { display: block; margin-bottom: 4px; }
    .notice { border-radius: 5px; margin: 8px 0; padding: 8px 10px; }
    .notice.info { background: #f1ead9; color: #5d471f; }
    .notice.error { background: #f8e7e5; color: #782b25; }
    .notice.success { background: #e3f1e8; color: #1f5b3c; }
    .rollover-notice {
      align-items: center; background: #f1ead9; border: 1px solid #d9c695; color: #4f3d1c;
      display: flex; gap: 8px; margin: 0 0 10px; padding: 7px 8px;
    }
    .rollover-notice span { flex: 1; min-width: 180px; }
    .rollover-notice .dismiss { font-size: 18px; padding: 0; width: 27px; }
    .active-strip {
      align-items: center; background: #1c1a16; border: 1px solid #3f3829; border-radius: 6px; color: white;
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; padding: 8px 10px;
    }
    .active-strip .task-name { font-weight: 700; }
    .active-strip .time { color: #f3d17c; font-size: 17px; font-variant-numeric: tabular-nums; font-weight: 800; }
    .active-strip .spacer { flex: 1; }
    .review-grid { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
    .review-grid .wide { grid-column: 1 / -1; }
    .outcome-summary { display: grid; gap: 6px; grid-template-columns: repeat(6, minmax(0,1fr)); margin-bottom: 9px; }
    .outcome-stat { background: white; border: 1px solid var(--line); border-radius: 5px; min-width: 0; padding: 7px 8px; }
    .outcome-stat strong { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
    .outcome-stat span { color: var(--muted); display: block; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .outcome-lists { display: grid; gap: 8px; grid-template-columns: repeat(3,1fr); margin: 8px 0; }
    .outcome-list { background: white; border: 1px solid var(--line); border-radius: 5px; padding: 8px; }
    .outcome-list strong { display: block; margin-bottom: 4px; }
    .outcome-list ul { margin: 0; padding-left: 17px; }
    .ratings { display: grid; gap: 6px; grid-template-columns: repeat(4, 1fr); margin-top: 8px; }
    .ratings label { color: var(--muted); font-size: 10px; }
    .ratings input { margin-top: 3px; }
    .table-wrap { background: white; border: 1px solid var(--line); border-radius: 6px; max-height: 500px; overflow: auto; }
    table { border-collapse: separate; border-spacing: 0; min-width: 900px; width: 100%; }
    th, td { border-bottom: 1px solid #ebe8e1; padding: 7px 8px; text-align: left; vertical-align: top; }
    th { background: #f5f3ee; color: #5d5952; font-size: 10px; position: sticky; top: 0; text-transform: uppercase; z-index: 1; }
    td { font-size: 12px; }
    .segmented { display: inline-flex; }
    .segmented button { border-radius: 0; margin-left: -1px; }
    .segmented button:first-child { border-radius: 5px 0 0 5px; margin-left: 0; }
    .segmented button:last-child { border-radius: 0 5px 5px 0; }
    .segmented button.active { background: #27251f; color: white; }
    .skeleton { animation: pulse 1.15s ease-in-out infinite; background: #e5e2db; border-radius: 4px; height: 34px; margin-bottom: 8px; }
    .skeleton.short { width: 38%; }
    @keyframes pulse { 50% { opacity: .45; } }
    .toast {
      background: #181714; border: 1px solid var(--gold); border-radius: 6px; bottom: 34px; color: white;
      max-width: 420px; padding: 10px 12px; position: fixed; right: 14px; z-index: 20;
    }
    .outcome {
      background: white; border: 2px solid var(--gold); border-radius: 7px; box-shadow: 0 18px 48px rgba(0,0,0,.25);
      left: 50%; max-width: 540px; padding: 18px; position: fixed; top: 50%; transform: translate(-50%,-50%); width: calc(100% - 36px); z-index: 30;
    }
    .outcome h2 { font-size: 18px; margin: 0 0 8px; }
    .outcome-actions { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-top: 14px; }
    .outcome-error { align-items: center; display: flex; gap: 8px; justify-content: space-between; margin-top: 10px; }
    .outcome-error span { flex: 1; }
    .sound-row { align-items: center; display: flex; gap: 8px; margin-top: 12px; }
    .sound-row label { align-items: center; display: inline-flex; gap: 6px; }
    .sound-row input[type="checkbox"] { min-height: 0; width: auto; }
    .sound-row input { min-height: 0; width: 120px; }
    .planner-modal-layer {
      align-items: center; background: rgba(20,19,16,.34); display: flex; inset: 0; justify-content: center;
      padding: 20px; position: fixed; z-index: 45;
    }
    .planner-modal {
      background: var(--paper); border: 1px solid #8e887d; border-radius: 7px; box-shadow: 0 18px 54px rgba(0,0,0,.28);
      display: grid; grid-template-rows: auto minmax(0,1fr) auto; max-height: calc(100vh - 40px); max-width: 920px; width: min(920px, calc(100vw - 40px));
    }
    .planner-modal.compact-modal { max-width: 690px; }
    .planner-modal-header, .planner-modal-footer {
      align-items: center; background: #f4f1ea; display: flex; gap: 8px; padding: 9px 11px; position: sticky; z-index: 2;
    }
    .planner-modal-header { border-bottom: 1px solid var(--line); top: 0; }
    .planner-modal-footer { border-top: 1px solid var(--line); bottom: 0; justify-content: flex-end; }
    .planner-modal-header h2 { font-size: 15px; margin: 0; }
    .planner-modal-body { min-height: 0; overflow: auto; padding: 11px; }
    .modal-close { font-size: 19px; padding: 0; width: 29px; }
    .week-grid, .coach-grid { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
    .week-grid label, .coach-grid label { color: var(--muted); display: grid; font-size: 11px; gap: 4px; }
    .week-grid .wide, .coach-grid .wide { grid-column: 1 / -1; }
    .objective-editor { background: white; border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; padding: 8px; }
    .objective-editor h3 { font-size: 12px; margin: 0 0 7px; }
    .tactic-row { align-items: center; display: grid; gap: 5px; grid-template-columns: minmax(170px,1fr) 104px 98px 74px 28px; margin-top: 5px; }
    .tactic-row .button { padding: 0; }
    .coach-question { margin: 8px 0 12px; }
    .coach-draft { display: grid; gap: 8px; }
    .coach-draft textarea { min-height: 46px; }
    .coach-facts { background: #f1ead9; border-radius: 5px; color: #58431e; padding: 8px; }
    .coach-facts ul { margin: 4px 0 0; padding-left: 18px; }
    .status-pill { background: #ece9e2; border-radius: 999px; display: inline-block; font-size: 10px; padding: 2px 7px; }
    .hidden { display: none !important; }
    .mobile-only { display: none !important; }
    .compact-only { display: none !important; }
    body.compact { min-height: 340px; }
    body.compact .shell { grid-template-rows: 42px minmax(0,1fr); }
    body.compact .tabs, body.compact .statusbar, body.compact .full-only { display: none !important; }
    body.compact .compact-only { display: flex !important; }
    body.compact .main { align-items: stretch; display: flex; padding: 8px; }
    .compact-panel {
      align-items: center; background: #171613; border-radius: 7px; color: white; display: flex; flex: 1;
      flex-direction: column; justify-content: center; min-height: 270px; padding: 14px; text-align: center;
    }
    .compact-task { font-size: 13px; font-weight: 700; max-width: 310px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .compact-countdown { color: #f2ce76; font-size: 58px; font-variant-numeric: tabular-nums; font-weight: 760; line-height: 1.2; }
    .compact-meta { color: #bcb7aa; display: flex; gap: 16px; font-size: 11px; }
    .compact-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
    @media (max-width: 820px), (max-width: 940px) and (max-height: 520px) {
      body { font-size: 14px; }
      body.planner-modal-open .main { overflow: hidden; }
      .shell { grid-template-rows: 56px 46px minmax(0, 1fr) 24px; }
      .header {
        gap: 4px;
        padding-left: max(4px, env(safe-area-inset-left));
        padding-right: max(4px, env(safe-area-inset-right));
      }
      .mobile-only { display: inline-flex !important; }
      .brand-mark { font-size: 20px; }
      .header-title { font-size: 13px; }
      .header-subtitle { display: none; }
      .icon-button {
        height: 44px;
        min-height: 44px;
        min-width: 44px;
        padding: 0 7px;
      }
      .tabs {
        gap: 2px;
        overflow-x: auto;
        padding: 0 max(4px, env(safe-area-inset-left));
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar { display: none; }
      .tab {
        flex: 1 0 auto;
        min-height: 44px;
        min-width: 92px;
        padding: 0 10px;
      }
      .main {
        overscroll-behavior: contain;
        padding: 9px max(8px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
      }
      .statusbar {
        padding-left: max(8px, env(safe-area-inset-left));
        padding-right: max(8px, env(safe-area-inset-right));
      }
      button,
      .button {
        min-height: 44px;
      }
      .button.small { height: 44px; min-height: 44px; }
      input,
      textarea,
      select { font-size: 16px; min-height: 44px; }
      .toolbar {
        align-items: stretch;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 44px minmax(74px, auto);
      }
      .toolbar .date-input { width: 100%; }
      .toolbar .spacer { display: none; }
      .toolbar > .button:last-child { grid-column: 1 / -1; justify-self: end; }
      .meta-row { gap: 7px 12px; }
      .task-header { display: none; }
      .task-row { grid-template-columns: 22px minmax(0, 1fr); padding: 8px 6px 10px; }
      .task-row > *:not(.task-index) { grid-column: 2; }
      .task-row input,
      .task-row select,
      .task-row textarea { min-width: 0; }
      .timer-cell {
        border-top: 1px solid var(--line);
        margin-top: 2px;
        padding-top: 7px;
      }
      .timer-cell .button { flex: 1 1 6.5rem; }
      .duration-input { flex: 0 1 82px; width: 82px; }
      .countdown { align-self: center; min-width: 72px; padding-top: 0; }
      .active-strip {
        position: sticky;
        top: -9px;
        z-index: 8;
      }
      .active-strip .button { flex: 1 1 6.5rem; }
      .planning-grid, .review-grid, .ratings, .outcome-summary, .outcome-lists { grid-template-columns: 1fr; }
      .week-grid, .coach-grid { grid-template-columns: 1fr; }
      .week-grid .wide, .coach-grid .wide { grid-column: auto; }
      .tactic-row { grid-template-columns: 1fr 90px; }
      .tactic-row > *:nth-child(n+3) { grid-column: auto; }
      .planning-grid .wide, .review-grid .wide { grid-column: auto; }
      .save-row {
        flex-wrap: wrap;
      }
      .mobile-sticky-actions {
        background: var(--soft);
        bottom: -1px;
        padding: 8px 0 max(4px, env(safe-area-inset-bottom));
        position: sticky;
        z-index: 7;
      }
      .save-row .button { margin-left: auto; }
      .move-buttons button { min-width: 44px; }
      .table-wrap {
        max-height: min(58dvh, 500px);
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .outcome {
        border-radius: 10px 10px 0 0;
        bottom: 0;
        left: 0;
        max-height: calc(100dvh - env(safe-area-inset-top));
        max-width: none;
        overflow-y: auto;
        padding: 16px max(14px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        top: auto;
        transform: none;
        width: 100%;
      }
      .outcome-actions { grid-template-columns: 1fr; }
      .planner-modal-layer { align-items: flex-end; padding: 0; }
      .planner-modal,
      .planner-modal.compact-modal {
        border-radius: 10px 10px 0 0;
        height: min(94dvh, 760px);
        max-height: calc(100dvh - env(safe-area-inset-top));
        max-width: none;
        width: 100%;
      }
      .planner-modal-header,
      .planner-modal-footer {
        flex-wrap: wrap;
        min-height: 52px;
        padding-left: max(10px, env(safe-area-inset-left));
        padding-right: max(10px, env(safe-area-inset-right));
      }
      .planner-modal-footer {
        padding-bottom: max(9px, env(safe-area-inset-bottom));
      }
      .planner-modal-footer .button { flex: 1 1 8.5rem; }
      .planner-modal-body {
        overscroll-behavior: contain;
        padding: 10px max(10px, env(safe-area-inset-right)) 12px max(10px, env(safe-area-inset-left));
      }
      .toast {
        bottom: max(10px, env(safe-area-inset-bottom));
        left: max(8px, env(safe-area-inset-left));
        max-width: none;
        right: max(8px, env(safe-area-inset-right));
      }
      .rollover-notice { align-items: stretch; flex-wrap: wrap; }
      .rollover-notice span { flex-basis: 100%; min-width: 0; }
      .compact-countdown { font-size: 48px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <button class="icon-button mobile-only" id="mobile-back" title="Back to Sports Cave OS" aria-label="Back to Sports Cave OS">&#8592;</button>
      <div class="brand-mark">SC</div>
      <div><span class="header-title">Daily Planner</span><span class="header-subtitle">Daily Task Execution Sheet</span></div>
      <div class="header-spacer"></div>
      <button class="icon-button full-only" id="week-plan-toggle" title="Open Week Plan" aria-label="Open Week Plan">Week Plan</button>
      <button class="icon-button" id="test-sound" title="Toggle sound" aria-label="Toggle planner sound" aria-pressed="true">Sound on</button>
      <button class="icon-button" id="compact-toggle" title="Compact timer mode" aria-label="Compact timer mode">Compact</button>
    </header>
    <nav class="tabs full-only" aria-label="Daily Planner sections">
      <button class="tab" data-tab="planner" aria-selected="true">Planner</button>
      <button class="tab" data-tab="history" aria-selected="false">History</button>
      <button class="tab" data-tab="weekly" aria-selected="false">Weekly Review</button>
    </nav>
    <main class="main" id="main">
      <section class="full-only" id="view"></section>
      <section class="compact-only compact-panel" id="compact-view"></section>
    </main>
    <footer class="statusbar full-only"><span id="connection-status">Waiting for secure session...</span><span id="performance-status">Shell ready</span></footer>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="outcome" class="outcome hidden" role="alertdialog" aria-modal="true" aria-labelledby="outcome-title"></div>
  <div id="planner-modal-root"></div>
  <script>
  (() => {
    "use strict";
    const shellVisibleAt = performance.now();
    const storedFullBounds = (() => {
      try {
        const value = JSON.parse(localStorage.getItem("scPlannerFullBounds") || "null");
        return value && value.width >= 500 && value.height >= 420 ? value : null;
      } catch (_error) { return null; }
    })();
    const state = {
      token: "", tab: "planner", bundle: null, draft: null, editingNew: false,
      loading: true, saving: false, saveError: "", saveRequestId: 0, saveController: null,
      lastSaveSignature: "", lastSaveAt: 0,
      historyLoaded: false, weeklyLoaded: false,
      historyPeriod: "today", historyStart: "", historyEnd: "", historyRows: [],
      weeklyAnchor: "", weekly: null, statusTimer: null, countdownTimer: null,
      toastTimer: null, seenEvents: new Set(), chimePlaying: false, chimeNodes: [],
      chimeStopTimer: null, audio: null, volume: Number(localStorage.getItem("scPlannerVolume") || .75),
      soundEnabled: localStorage.getItem("scPlannerSoundEnabled") !== "0",
      outcomeSaving: false, pendingOutcome: null, outcomeTimerId: "",
      compact: localStorage.getItem("scPlannerCompact") === "1",
      fullBounds: storedFullBounds, dataStartedAt: 0, initialLoadComplete: false,
      pendingFocusActive: false, timerScope: "", terminalTimerIds: new Set(),
      timerEpoch: 0, plannerLoadId: 0, outcomeFocusReturn: null, pendingReviewFocus: "",
      weekPlan: null, weekPlanAnchor: "", weekPlanLoading: false, coach: null,
    };
    const surfaceId = `planner-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const timerChannel = "BroadcastChannel" in window ? new BroadcastChannel("sports-cave-daily-planner") : null;
    const timerStorageKey = () => `scSportsCavePlannerTimerState:${state.timerScope || "none"}`;
    const view = document.querySelector("#view");
    const compactView = document.querySelector("#compact-view");
    const statusText = document.querySelector("#connection-status");
    const performanceText = document.querySelector("#performance-status");
    const toast = document.querySelector("#toast");
    let outcome = document.querySelector("#outcome");
    const ensureOutcomeModal = () => {
      if (outcome?.isConnected) return outcome;
      outcome = document.createElement("div");

          const key = `${event.event}:${timer.id}:${timer.updated_at || ""}`;
          if (state.seenEvents.has(key)) return;
          state.seenEvents.add(key);
          if (event.event === "halfway") runClaimedSideEffect("halfway", timer, () => showToast(`Halfway through: ${event.task || timer.task || "Daily Planner task"} \u2014 ${formatClock(timer.remaining_seconds)} remaining.`,"info",7000));
          if (event.event === "expired") showOutcomeClaimed({...timer, task:event.task || timer.task});
        });
        const timer = activeTimer();
        if (timer.outcome_required || timer.status === "expired") {
          const outcomeVisible = showOutcome(timer);
          if (outcomeVisible && (previousId !== timer.id || immediate)) {
            runClaimedSideEffect("time-up", timer, playTimeUpChime);
          }
        }
        updateTimerDisplays();
      } catch (_error) {}
      if (reconciledEpoch === state.timerEpoch) scheduleStatus();
    };
    const scheduleStatus = () => {
      clearTimeout(state.statusTimer);
      const delay = activeTimer().id ? 10000 : 30000;
      state.statusTimer = setTimeout(refreshStatus, delay);
    };

    const periodDates = (period) => {
      const today = isoToday();
      if (period === "7") return [addDays(today,-6),today];
      if (period === "30") return [addDays(today,-29),today];
      if (period === "custom") return [state.historyStart || addDays(today,-6), state.historyEnd || today];
      return [today,today];
    };
    const loadHistory = async () => {
      const [start,end] = periodDates(state.historyPeriod);
      if (end < start) return showToast("End date must be on or after the start date.","error");
      view.innerHTML = '<div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton"></div>';
      try {
        const payload = await requestJson(`/api/os/daily-planner/history?start=${start}&end=${end}`);
        state.historyRows = payload.rows || []; state.historyLoaded = true; renderHistory();
      } catch (error) { view.innerHTML = `<div class="notice error">${escapeHtml(error.message)}</div>`; }
    };
    const renderHistory = () => {
      const [start,end] = periodDates(state.historyPeriod);
      const rows = state.historyRows || [];
      view.innerHTML = `<div class="toolbar"><div class="segmented">${[["today","Today"],["7","Last 7 days"],["30","Last 30 days"],["custom","Custom"]].map(([value,label]) => `<button class="button ${state.historyPeriod === value ? "active" : ""}" data-period="${value}">${label}</button>`).join("")}</div>${state.historyPeriod === "custom" ? `<input class="date-input" type="date" id="history-start" value="${start}"><input class="date-input" type="date" id="history-end" value="${end}"><button class="button" data-action="apply-history">Apply</button>` : ""}<span class="header-spacer"></span><span>${rows.length} task record${rows.length === 1 ? "" : "s"}</span></div>${rows.length ? `<div class="table-wrap"><table><thead><tr><th>Work date</th><th>Task</th><th>Owner</th><th>Allocated</th><th>Actual</th><th>Time saved</th><th>Status</th><th>Outcome / method</th><th>Skip reason</th><th>Completed at</th><th>Notes</th></tr></thead><tbody>${rows.map((row) => { const method = row.completion_method === "finished_early" ? "Finished early" : String(row.completion_method || "").replaceAll("_"," ").replace(/\b\w/g,(value) => value.toUpperCase()); const result = row.outcome === "did_not_finish" ? "Did not finish" : row.outcome === "completed" ? "Completed" : row.outcome === "skipped" ? "Skipped" : ""; const actual = row.timer?.actual_elapsed_seconds ?? row.actual_elapsed_seconds ?? row.timer?.elapsed_seconds; const allocated = row.allocated || (row.allocated_seconds ? formatClock(row.allocated_seconds) : ""); return `<tr data-row-id="${escapeHtml(row.row_id)}"><td>${escapeHtml(row.work_date)}</td><td>${escapeHtml(row.task)}</td><td>${escapeHtml(row.owner)}</td><td>${escapeHtml(allocated)}</td><td>${actual === null || actual === undefined ? "" : escapeHtml(formatClock(actual))}</td><td>${row.time_saved_seconds ? escapeHtml(formatClock(row.time_saved_seconds)) : ""}</td><td>${escapeHtml(row.status)}</td><td>${escapeHtml([result,method].filter(Boolean).join(" · "))}</td><td>${escapeHtml(row.skip_reason || "")}</td><td>${escapeHtml(formatTimestamp(row.timer?.outcome_at || row.completed_at || row.finished_at))}</td><td>${escapeHtml(row.notes)}</td></tr>`; }).join("")}</tbody></table></div>` : '<div class="empty"><div><strong>No Daily Planner tasks</strong><span>No records exist for this period.</span></div></div>'}`;
    };
    const loadWeekly = async () => {
      const anchor = state.weeklyAnchor || state.bundle?.work_date || isoToday();
      view.innerHTML = '<div class="skeleton short"></div><div class="skeleton"></div><div class="skeleton"></div>';
      try { state.weekly = await requestJson(`/api/os/daily-planner/weekly-review?date=${anchor}`); state.weeklyLoaded = true; renderWeekly(); }
      catch (error) { view.innerHTML = `<div class="notice error">${escapeHtml(error.message)}</div>`; }
    };
    const renderWeekly = () => {
      const data = state.weekly || {}; const summary = data.summary || {}; const sheets = data.sheets || [];
      const staff = summary.staff_completion || [];
      const weekPlanData = data.week_plan || {}; const weekPlan = weekPlanData.plan || {}; const objectives = weekPlan.objectives || [];
      const weekPlanMarkup = weekPlan.id ? `<div class="section-title"><h2>Week Plan</h2><span class="rule"></span><span class="status-pill">${Math.round(weekPlanData.execution?.percentage || 0)}% tactics</span></div><p><strong>${escapeHtml(weekPlan.theme || "No theme")}</strong>${weekPlan.quote_text ? ` · ${escapeHtml(weekPlan.quote_text)}${weekPlan.quote_author ? ` — ${escapeHtml(weekPlan.quote_author)}` : ""}` : ""}</p><div class="table-wrap"><table><thead><tr><th>Objective</th><th>Target</th><th>Result</th><th>Tactics</th><th>Completed</th></tr></thead><tbody>${objectives.map((objective) => `<tr><td>${escapeHtml(objective.title)}</td><td>${escapeHtml(objective.measurable_target)}</td><td>${escapeHtml(String(objective.result || "Not reviewed").replaceAll("_"," "))}</td><td>${(objective.tactics || []).length}</td><td>${(objective.tactics || []).filter((tactic) => tactic.status === "completed").length}</td></tr>`).join("")}</tbody></table></div>` : (weekPlanData.error ? `<div class="notice info">${escapeHtml(weekPlanData.error)}</div>` : "");
      view.innerHTML = `<div class="toolbar"><button class="button" data-action="previous-week">&#8592; Previous</button><input class="date-input" type="date" id="weekly-date" value="${escapeHtml(state.weeklyAnchor || isoToday())}"><button class="button" data-action="next-week">Next &#8594;</button><span>${escapeHtml(formatDate(data.week_start))} - ${escapeHtml(formatDate(data.week_end))}</span></div><div class="outcome-summary"><div class="outcome-stat"><strong>${Math.round(summary.completion_percentage || 0)}%</strong><span>Task completion</span></div><div class="outcome-stat"><strong>${summary.completed || 0}</strong><span>Completed</span></div><div class="outcome-stat"><strong>${summary.did_not_finish || 0}</strong><span>Did not finish</span></div><div class="outcome-stat"><strong>${summary.skipped || 0}</strong><span>Skipped</span></div><div class="outcome-stat"><strong>${summary.unresolved || 0}</strong><span>Remaining</span></div><div class="outcome-stat"><strong>${summary.total_planned || 0}</strong><span>Total planned</span></div></div><div class="meta-row"><span><strong>Focused time:</strong> ${formatClock(summary.actual_focused_seconds || 0)}</span><span><strong>Days reviewed:</strong> ${summary.days_reviewed || 0}</span><span><strong>Average rating:</strong> ${summary.average_day_rating || "-"}</span></div>${staff.length ? `<div class="table-wrap"><table><thead><tr><th>Staff</th><th>Completion</th><th>Completed</th><th>Did not finish</th><th>Skipped</th><th>Remaining</th><th>Total</th><th>Focused</th></tr></thead><tbody>${staff.map((row) => `<tr><td>${escapeHtml(row.staff)}</td><td>${Math.round(row.completion_percentage || 0)}%</td><td>${row.completed || 0}</td><td>${row.did_not_finish || 0}</td><td>${row.skipped || 0}</td><td>${row.unresolved || 0}</td><td>${row.total_planned || 0}</td><td>${formatClock(row.actual_focused_seconds || 0)}</td></tr>`).join("")}</tbody></table></div>` : ""}<div class="section-title"><h2>Week summary</h2><span class="rule"></span></div><p><strong>Biggest wins:</strong> ${escapeHtml((summary.biggest_wins || []).join("; ") || "No wins recorded yet.")}</p><p><strong>Main blockers:</strong> ${escapeHtml((summary.main_blockers || []).join("; ") || "No blockers recorded yet.")}</p><p><strong>Repeated unfinished work:</strong> ${escapeHtml((summary.repeated_carryovers || []).join("; ") || "None repeated this week.")}</p>${sheets.length ? `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Owner</th><th>Status</th><th>Completion</th><th>Tasks</th><th>Rating</th></tr></thead><tbody>${sheets.map((sheet) => { const result = (() => { const tasks = [...(sheet.top_tasks || []),...(sheet.additional_items || [])].filter((task) => String(task.task || task.details || "").trim()); const completed = tasks.filter((task) => terminalOutcome(task) === "completed").length; return {total:tasks.length, percentage:tasks.length ? completed/tasks.length*100 : 0}; })(); return `<tr><td>${escapeHtml(sheet.sheet_date)}</td><td>${escapeHtml(sheet.user_name)}</td><td>${escapeHtml(sheet.status)}</td><td>${Math.round(result.percentage)}%</td><td>${result.total}</td><td>${escapeHtml(sheet.ratings?.["Overall Score"] || "")}</td></tr>`; }).join("")}</tbody></table></div>` : '<div class="empty"><div><strong>No planner records</strong><span>No Daily Planner records were found for this week.</span></div></div>'}`;
      if (weekPlanMarkup) view.querySelector(".toolbar")?.insertAdjacentHTML("afterend", weekPlanMarkup);
    };
    const renderCompact = () => {
      if (!state.compact) return;
      const timer = activeTimer();
      if (!timer.id) {
        compactView.innerHTML = '<div class="compact-task">No active timer</div><div class="compact-countdown">00:00</div><div class="compact-actions"><button class="button" data-action="toggle-compact">Restore full planner</button></div>';
        return;
      }
      compactView.innerHTML = `<div class="compact-task">${escapeHtml(taskForTimer(timer))}</div><div class="compact-countdown" data-countdown="active">${formatClock(timerRemaining(timer))}</div><div class="compact-meta"><span>Allocated ${formatClock(timer.allocated_seconds)}</span><span>Elapsed ${formatClock(timerElapsed(timer))}</span></div><div class="compact-actions">${timer.status === "running" ? '<button class="button" data-action="pause-timer">Pause</button>' : timer.status === "paused" ? '<button class="button" data-action="resume-timer">Resume</button>' : ""}${timer.status === "expired" ? "" : '<button class="button finish" data-action="finish-active">Finish</button>'}<button class="button skip" data-action="skip-active">Skip</button><button class="button" data-action="did-not-finish-active">Did not finish</button><button class="button" data-action="toggle-compact">Restore full planner</button></div>`;
    };
    const renderCurrent = () => {
      document.querySelectorAll(".tab").forEach((button) => button.setAttribute("aria-selected", button.dataset.tab === state.tab ? "true" : "false"));
      if (state.tab === "planner") renderPlanner();
      else if (state.tab === "history") state.historyLoaded ? renderHistory() : loadHistory();
      else state.weeklyLoaded ? renderWeekly() : loadWeekly();
      renderCompact();
    };

    document.querySelectorAll(".tab").forEach((button) => button.addEventListener("click", () => { state.tab = button.dataset.tab; renderCurrent(); }));
    document.querySelector("#week-plan-toggle").addEventListener("click", () => loadWeekPlan(isoToday(),"this"));
    modalRoot.addEventListener("click", async (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) {
        if (event.target.matches("[data-modal-layer]")) closePlannerModal();
        return;
      }
      const action = target.dataset.action;
      if (action === "close-planner-modal") return closePlannerModal();
      if (action === "retry-week-plan") return loadWeekPlan(state.weekPlanAnchor || isoToday(), state.weekPlan?.view || "this");
      if (action === "week-this") return loadWeekPlan(isoToday(),"this");
      if (action === "week-next") return loadWeekPlan(addDays(mondayOf(isoToday()),7),"next");
      if (action === "create-cycle") {
        const fields = Object.fromEntries([...modalRoot.querySelectorAll("[data-cycle-field]")].map((input) => [input.dataset.cycleField,input.value]));
        try {
          const payload = await requestJson("/api/os/daily-planner/week-plan", {method:"POST",body:JSON.stringify({action:"create_cycle",...fields})});
          state.weekPlan = {...payload,view:"this"}; showToast("12-week cycle created.","success"); renderWeekPlan();
        } catch (error) { showToast(error.message,"error",8000); }
        return;
      }
      if (action === "add-objective") { state.weekPlan.plan.objectives.push(blankObjective()); return renderWeekPlan(); }
      const objectiveElement = target.closest("[data-objective-index]");
      const objectiveIndex = Number(objectiveElement?.dataset.objectiveIndex || 0);
      if (action === "remove-objective") { state.weekPlan.plan.objectives.splice(objectiveIndex,1); return renderWeekPlan(); }
      if (action === "add-tactic") { state.weekPlan.plan.objectives[objectiveIndex].tactics.push({action:"",due_day:0,status:"open",estimated_minutes:0}); return renderWeekPlan(); }
      if (action === "remove-tactic") {
        const tacticIndex = Number(target.closest("[data-tactic-index]")?.dataset.tacticIndex || 0);
        state.weekPlan.plan.objectives[objectiveIndex].tactics.splice(tacticIndex,1); return renderWeekPlan();
      }
      if (action === "save-week-plan") return saveWeekPlan();
      if (action === "open-weekly-coach") return openCoach("weekly");
      if (action === "retry-coach-questions") return openCoach(state.coach?.kind || "daily");
      if (action === "coach-continue") {
        const question = state.coach.questions[state.coach.index];
        if (question) {
          const answer = String(modalRoot.querySelector("[data-coach-answer]")?.value || "").trim();
          if (!answer) { showToast("Add a short answer to continue.","error",5000); return; }
          state.coach.answers[question.key] = answer;
          state.coach.index += 1;
        }
        if (state.coach.index >= state.coach.questions.length) return generateCoach();
        return renderCoach();
      }
      if (action === "regenerate-coach") return generateCoach();
      if (action === "edit-coach") return modalRoot.querySelector("[data-coach-field], [data-coach-mip-field], [data-coach-objective-field]")?.focus();
      if (action === "apply-coach") return applyCoach();
    });
    modalRoot.addEventListener("input", (event) => {
      const input = event.target;
      const plan = state.weekPlan?.plan;
      if (input.dataset.weekPlanField && plan) plan[input.dataset.weekPlanField] = input.value;
      const objectiveElement = input.closest?.("[data-objective-index]");
      if (objectiveElement && plan) {
        const objective = plan.objectives[Number(objectiveElement.dataset.objectiveIndex || 0)];
        if (input.dataset.weekField) objective[input.dataset.weekField] = input.value;
        const tacticElement = input.closest("[data-tactic-index]");
        if (tacticElement && input.dataset.tacticField) objective.tactics[Number(tacticElement.dataset.tacticIndex || 0)][input.dataset.tacticField] = input.type === "number" ? Number(input.value || 0) : input.value;
        if (tacticElement && input.matches("[data-tactic-link]")) {
          const tactic = objective.tactics[Number(tacticElement.dataset.tacticIndex || 0)];
          const [sheetId,taskType,taskIndex] = String(input.value || "").split("|");
          tactic.linked_sheet_id = sheetId || ""; tactic.linked_task_type = taskType || ""; tactic.linked_task_index = taskIndex === undefined ? null : Number(taskIndex);
        }
      }
      const coach = state.coach;
      if (!coach?.draft) return;
      if (input.dataset.coachField) coach.draft[input.dataset.coachField] = input.value;
      if (input.dataset.coachQuote) coach.draft.quote[input.dataset.coachQuote] = input.value;
      const mipElement = input.closest?.("[data-coach-mip]");
      if (mipElement && input.dataset.coachMipField) coach.draft.mips[Number(mipElement.dataset.coachMip)][input.dataset.coachMipField] = input.type === "number" ? Number(input.value || 0) : input.value;
      const coachObjective = input.closest?.("[data-coach-objective]");
      if (coachObjective) {
        const objective = coach.draft.objectives[Number(coachObjective.dataset.coachObjective)];
        if (input.dataset.coachObjectiveField) objective[input.dataset.coachObjectiveField] = input.value;
        const coachTactic = input.closest("[data-coach-tactic]");
        if (coachTactic && input.dataset.coachTacticField) objective.tactics[Number(coachTactic.dataset.coachTactic)][input.dataset.coachTacticField] = input.type === "number" ? Number(input.value || 0) : input.value;
      }
    });
    modalRoot.addEventListener("change", (event) => {
      event.target.dispatchEvent(new Event("input", {bubbles:true}));
    });
    document.querySelector("#test-sound").addEventListener("click", async () => {
      state.soundEnabled = !state.soundEnabled;
      localStorage.setItem("scPlannerSoundEnabled", state.soundEnabled ? "1" : "0");
      syncSoundButton();
      if (state.soundEnabled) await playTimeUpChime();
      else stopChime();
    });
    syncSoundButton();
    document.querySelector("#compact-toggle").addEventListener("click", () => setCompact(!state.compact));
    document.querySelector("#mobile-back").addEventListener("click", () => {
      if (window.history.length > 1) window.history.back();
      else window.location.href = "/?page=dashboard";
    });
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (state.compact || window.outerWidth < 500 || window.outerHeight < 420) return;
        state.fullBounds = {width:window.outerWidth, height:window.outerHeight};
        localStorage.setItem("scPlannerFullBounds", JSON.stringify(state.fullBounds));
      }, 180);
    });
    document.addEventListener("click", async (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      const row = target.closest(".task-row");
      const type = row?.dataset.taskType; const index = Number(row?.dataset.taskIndex || 0);
      if (action === "retry") return loadPlanner(state.bundle?.work_date || isoToday());
      if (action === "open-daily-coach") return openCoach("daily");
      if (action === "previous-day") return loadPlanner(addDays(state.bundle.work_date,-1));
      if (action === "next-day") return loadPlanner(addDays(state.bundle.work_date,1));
      if (action === "today") return loadPlanner(isoToday());
      if (action === "plan-tomorrow") return loadPlanner(addDays(state.bundle.work_date,1));
      if (action === "reopen-active") return loadPlanner(activeTimer().sheet_date);
      if (action === "dismiss-review-reminder") {
        const reviewDate = String(target.closest("[data-review-reminder]")?.dataset.reviewReminder || "");
        try { sessionStorage.setItem(`scPlannerReviewReminderDismissed:${state.timerScope || "none"}:${reviewDate}`, "1"); } catch (_error) {}
        target.closest("[data-review-reminder]")?.remove();
        return;
      }
      if (action === "complete-overdue-review") {
        const reviewDate = String(target.closest("[data-review-reminder]")?.dataset.reviewReminder || state.bundle?.review_reminder?.sheet_date || "");
        if (!reviewDate) return;
        state.pendingReviewFocus = reviewDate;
        state.tab = "planner";
        return loadPlanner(reviewDate);
      }
      if (action === "toggle-compact") return setCompact(!state.compact);
      if (action === "finish-active") {
        const timer = activeTimer();
        return applyTaskOutcome(timer.task_type, timer.task_index, "completed", timer, timer.sheet_id, {trigger:target});
      }
      if (action === "skip-active") {
        const timer = activeTimer();
        return applyTaskOutcome(timer.task_type, timer.task_index, "skipped", timer, timer.sheet_id, {trigger:target});
      }
      if (action === "did-not-finish-active") {
        const timer = activeTimer();
        return applyTaskOutcome(timer.task_type, timer.task_index, "did_not_finish", timer, timer.sheet_id, {trigger:target});
      }
      if (action === "create-sheet") { state.editingNew = true; state.saveError = ""; state.draft = normalDraft({}); return renderPlanner(); }
      if (action === "cancel-new") { resetSaveLifecycle({abort:true,clearError:true}); state.editingNew = false; state.draft = null; return renderPlanner(); }
      if (action === "add-task") { ensureDraft().additional_items.push(draftRow("additional", {task:"",details:"",time_blocked:"",status:""})); return renderPlanner(); }
      if (action === "remove-task") { ensureDraft().additional_items.splice(index,1); return renderPlanner(); }
      if (action === "move-up" || action === "move-down") {
        const list = ensureDraft()[type === "top" ? "top_tasks" : "additional_items"];
        const next = index + (action === "move-up" ? -1 : 1);
        if (next >= 0 && next < list.length) [list[index],list[next]] = [list[next],list[index]];
        return renderPlanner();
      }
      if (action === "save-sheet") return saveSheet();
      if (action === "retry-save") return saveSheet();
      if (action === "finish-task") {
        const timer = activeMatches(type,index) ? activeTimer() : {};
        return applyTaskOutcome(type, index, "completed", timer, "", {trigger:target});
      }
      if (action === "skip-task") {
        const timer = activeMatches(type,index) ? activeTimer() : {};
        return applyTaskOutcome(type, index, "skipped", timer, "", {trigger:target});
      }
      if (action === "reopen-task") return applyTaskOutcome(type, index, "reopen", {}, "", {trigger:target});
      if (action === "complete-review") {
        try {
          await mutate({action:"complete_review", sheet_id:state.bundle.sheet.id, review:collectReview()});
          if (state.bundle.review_reminder?.sheet_date === state.bundle.work_date) state.bundle.review_reminder = {};
          showToast("Daily Review complete.","success");
          await loadPlanner(state.bundle.work_date);
        }
        catch (error) { showToast(error.message,"error",8000); }
        return;
      }
      if (action === "start-timer") {
        await enableAudio();
        const minutes = Number(row.querySelector(".duration-input")?.value || 0);
        return timerAction("start_timer", {sheet_id:state.bundle.sheet.id, task_type:type, task_index:index, allocated_seconds:Math.max(1,Math.round(minutes*60)), display_task:ensureDraft()[type === "top" ? "top_tasks" : "additional_items"][index]?.task || "Daily Planner task"});
      }
      if (action === "pause-timer") return timerAction("pause_timer", {timer_id:activeTimer().id});
      if (action === "resume-timer") return timerAction("resume_timer", {timer_id:activeTimer().id});
      if (action === "reset-timer") {
        if (window.confirm("Reset this timer? The task completion status will not change.")) return timerAction("reset_timer", {timer_id:activeTimer().id});
        return;
      }
      if (action === "apply-history") {
        state.historyStart = document.querySelector("#history-start")?.value || "";
        state.historyEnd = document.querySelector("#history-end")?.value || "";
        return loadHistory();
      }
      if (action === "previous-week" || action === "next-week") { state.weeklyAnchor = addDays(state.weeklyAnchor || isoToday(), action === "previous-week" ? -7 : 7); state.weeklyLoaded = false; return loadWeekly(); }
    });
    document.addEventListener("change", (event) => {
      if (event.target.id === "work-date") loadPlanner(event.target.value);
      if (event.target.id === "weekly-date") { state.weeklyAnchor = event.target.value; state.weeklyLoaded = false; loadWeekly(); }
      const periodButton = event.target.closest?.("[data-period]");
      if (periodButton) { state.historyPeriod = periodButton.dataset.period; state.historyLoaded = false; loadHistory(); }
    });
    document.addEventListener("click", (event) => {
      const periodButton = event.target.closest("[data-period]");
      if (!periodButton) return;
      state.historyPeriod = periodButton.dataset.period; state.historyLoaded = false; loadHistory();
    });
    state.countdownTimer = setInterval(updateTimerDisplays, 1000);
    window.addEventListener("pagehide", () => resetSaveLifecycle({abort:true}));
    showSkeleton();
    setCompact(state.compact);
    try {
      const launchAuth = JSON.parse(sessionStorage.getItem("scSportsCavePlannerLaunchAuth") || "null");
      sessionStorage.removeItem("scSportsCavePlannerLaunchAuth");
      if (launchAuth?.token && Date.now() - Number(launchAuth.created_at || 0) < 300000) {
        setTimeout(() => acceptPlannerAuth(launchAuth), 0);
      }
    } catch (_error) {}
    postReady();
    setTimeout(postReady, 250);
    setTimeout(postReady, 900);
  })();
  </script>
