<!doctype html><html><head><style>body{margin:0;font:14px Arial;color:#333}label{display:block;margin:0 0 8px}textarea{box-sizing:border-box;width:100%;height:260px;resize:vertical;border:1px solid #d8d3ca;border-radius:8px;background:#fff;color:#202020;padding:12px;font:13px/1.5 Consolas,monospace}textarea:focus{outline:2px solid #b49450}small{display:block;margin-top:6px;color:#666}</style></head><body><label for="html">Email HTML</label><textarea id="html" spellcheck="false" placeholder="&lt;!-- Paste your email HTML here --&gt;"></textarea><small id="state">HTML source · Save draft to persist.</small><script>
const input=document.getElementById('html');let sent=null,timer=null,args={};
function resizeEditor(){const height=args.fit_viewport?Math.max(430,parent.innerHeight-340):(args.height||440);parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:height+52},'*');input.style.height=height+'px';}
addEventListener('resize',resizeEditor);
function emit(){clearTimeout(timer);if(input.value===sent)return;sent=input.value;parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:sent},'*');document.getElementById('state').textContent='HTML source · Save draft to persist.';}
input.addEventListener('input',()=>{clearTimeout(timer);document.getElementById('state').textContent='Unsaved source';timer=setTimeout(emit,250)});input.addEventListener('blur',emit);
addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;if(sent===null){input.value=e.data.args.source;sent=input.value;}args=e.data.args;resizeEditor();});
parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
</script></body></html>
