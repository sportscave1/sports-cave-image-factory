<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font:14px system-ui;color:#30343a}button{font:inherit;padding:8px 13px;border:1px solid #d4d7db;border-radius:7px;background:white;cursor:pointer}button:disabled{opacity:.5}p{margin:6px 0;font-size:12px;color:#9a4529}
</style></head><body>
<button id="copy" aria-label="Copy Upload Prompt" disabled>Copy Upload Prompt</button><p id="status" role="status"></p>
<script>
(() => {
  const button=document.getElementById('copy'),status=document.getElementById('status');
  let identity=[],text='',revision=0,timer;
  const post=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
  const resize=()=>post('streamlit:setFrameHeight',{height:document.body.scrollHeight+4});
  window.addEventListener('message',event=>{
    if(event.source!==parent||event.data?.type!=='streamlit:render')return;
    const args=event.data.args||{},next=args.identity||[];
    if(JSON.stringify(next)!==JSON.stringify(identity)||text!==args.text){
      revision++;clearTimeout(timer);identity=next;text=args.text||'';
      button.textContent='Copy Upload Prompt';status.textContent='';
      button.disabled=!text;
    }
    resize();
  });
  button.onclick=async()=>{
    const current=revision,selected=[...identity];
    button.disabled=true;status.textContent='';
    try{
      if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');
      // Text is already prepared: this call runs directly in the click gesture.
      await navigator.clipboard.writeText(text);
      if(current!==revision)return;
      button.textContent='Copied ✓';
      post('streamlit:setComponentValue',{value:{identity:selected,nonce:crypto.randomUUID()},dataType:'json'});
      timer=setTimeout(()=>{if(current===revision){button.textContent='Copy Upload Prompt';resize();}},2000);
    }catch(error){
      if(current!==revision)return;
      status.textContent='Copy failed. Allow clipboard access for this site, then click Copy Upload Prompt again.';
    }finally{
      if(current===revision){button.disabled=!text;resize();}
    }
  };
  post('streamlit:componentReady',{apiVersion:1});
  resize();
})();
</script></body></html>
