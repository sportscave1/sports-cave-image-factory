<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Editions status</title>
<style>body{font:13px system-ui;color:#243145;margin:12px}h2{font-size:15px;margin:0 0 10px}dl{display:grid;grid-template-columns:85px 1fr;gap:6px;margin:0}dt{color:#626a78}dd{margin:0;overflow-wrap:anywhere}button{font:inherit;background:white;border:1px solid #ccd0d4;border-radius:4px;height:28px;margin:10px 5px 0 0;padding:3px 9px;cursor:pointer}#review{width:100%;height:400px;border:0}#ready{color:#28633e}small{display:block;margin-top:10px;color:#626a78}[hidden]{display:none!important}</style></head><body>
<h2>Auto Editions</h2><dl><dt>Stage</dt><dd id="stage">Loading…</dd><dt>Checkpoint</dt><dd id="checkpoint">—</dd><dt>Reason</dt><dd id="reason">—</dd></dl><div id="actions"></div><button id="refresh">Refresh</button><small id="ready">Production Ready requires verified supplier assets. Cloud Ready permits preview downloads. Shopify sync and fulfilment remain separate.</small><iframe id="review" title="Existing Auto Editions visual review" hidden></iframe>
<script>
const pid=new URLSearchParams(location.search).get('product_gid'),$=id=>document.getElementById(id);let current=null,busy=false,timer;
async function request(path,body){const r=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Status unavailable');return d;}
function size(){parent.postMessage({type:'sports-cave-psd-size',height:document.body.scrollHeight+20},location.origin);}
async function load(){if(busy)return;busy=true;try{const d=await request('/api/auto-editions/status',{product_gids:[pid]});current=d.rows[0];$('stage').textContent=current.icon+' '+current.status;$('checkpoint').textContent=[current.checkpoint,current.checkpoint_at].filter(Boolean).join(' · ')||'—';$('reason').textContent=[current.reason,d.companion_connected===true?'Companion Connected':d.companion_connected===false?'Companion heartbeat stale or disconnected; check Windows startup and internet.':''].filter(Boolean).join(' · ')||'—';const allocation=new URLSearchParams(location.search).get('allocation_id');if(/^[1-9][0-9]*$/.test(allocation||'')&&['Cloud Ready','Production Ready'].includes(current.status)&&!document.getElementById('download-jpg')){const link=document.createElement('a');link.id='download-jpg';link.textContent='Download JPG';link.href='/auto-editions/download?allocation_id='+allocation;$('actions').after(link);}else if(!['Cloud Ready','Production Ready'].includes(current.status))document.getElementById('download-jpg')?.remove();const actions=current.actions||[];for(const button of $('actions').children)button.hidden=!actions.includes(button.dataset.action);for(const action of actions){if($('actions').querySelector('[data-action="'+action+'"]'))continue;const b=document.createElement('button');b.dataset.action=action;b.textContent={'connect':'Connect','prepare-now':'Prepare Now','retry':'Retry','review':'Review','recheck':'Recheck validation'}[action];b.onclick=()=>act(action,b);$('actions').append(b);}if(['Cloud Ready','Production Ready'].includes(current.status))$('review').hidden=true;size();}catch(e){$('stage').textContent='? Unavailable';$('reason').textContent='Authoritative status unavailable. Retry refresh.';for(const b of $('actions').children)b.hidden=true;}finally{busy=false;}}
async function act(action,button){if(action==='review'){$('review').src='/auto-editions/onboarding?compact=1&product_gid='+encodeURIComponent(pid);$('review').hidden=false;size();return;}button.disabled=true;try{await request(['connect','recheck'].includes(action)?'/api/auto-editions/status/'+action:'/api/auto-editions/onboarding/'+action,{product_gid:pid});await load();parent.postMessage({type:'sports-cave-auto-edition-updated'},location.origin);}catch(e){$('reason').textContent=e.message;}finally{button.disabled=false;}}
$('refresh').onclick=load;addEventListener('message',e=>{if(e.origin===location.origin&&e.source===$('review').contentWindow&&e.data?.type==='sports-cave-auto-edition-updated'){load();parent.postMessage(e.data,location.origin);}});timer=setInterval(()=>{if(!document.hidden)load();},25000);addEventListener('pagehide',()=>clearInterval(timer));load();
</script></body></html>
