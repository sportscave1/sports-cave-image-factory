<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Editions preparation</title><style>
body{font:14px system-ui;margin:8px;color:#243145}button,select{font:inherit;padding:5px 8px;margin:3px;border:1px solid #ccd0d4;border-radius:5px;background:white}button{cursor:pointer}button:disabled{opacity:.5}#summary{line-height:1.8;font-size:12px;white-space:nowrap;overflow-x:auto}#host{font-size:12px;white-space:nowrap;overflow-x:auto}#status{min-height:22px}#reason{white-space:pre-wrap}img{max-width:100%;max-height:480px}small{color:#626a78}[hidden]{display:none!important}
</style></head><body>
<div id="summary" role="status">Loading preparation progress...</div>
<button id="resume">Resume sales-first queue</button><button id="refresh">Refresh</button><p><label><input id="hostConsent" type="checkbox"> Allow this computer's existing Photoshop companion to prepare linked PSDs in the background.</label><button id="connect" disabled>Connect preparation computer</button><button id="pause">Disconnect my preparation hosts</button></p>
<p id="host"></p><p id="status" role="status"></p><small>One-time preparation uses the authorised Photoshop companion. Order downloads remain entirely in Render. Qualifying approved standards are validated automatically. New or altered artwork needs review; supplier validation is required for production.</small>
<p><select id="products" aria-label="Preparation product"></select><button id="prepareNow" disabled>Prepare Now</button><button id="retry" disabled>Retry</button><button id="review" disabled>Review prepared artwork</button></p>
<div id="reason"></div><section id="quality" hidden><img id="preview" alt="Prepared first edition for visual quality review"><p><label><input id="confirm" type="checkbox"> Composition, original plaque placement, number, faces, signatures, logos and enlargement quality checked for preview use.</label></p><button id="approve" disabled>Approve preview downloads</button></section>
<script>
const $=id=>document.getElementById(id),local='http://127.0.0.1:18762';let rows=[],popup,nonce,connected=false,registering=false,timer,continuous=false,loading=false;
const compact=new URLSearchParams(location.search).get('compact')==='1',product=new URLSearchParams(location.search).get('product_gid');
if(compact){for(const id of ['summary','resume','refresh','host','status'])$(id).hidden=true;$('hostConsent').parentElement.parentElement.hidden=true;$('products').parentElement.hidden=true;document.querySelector('small').hidden=true;document.body.style.margin='0';}
const status=text=>$('status').textContent=text;
async function api(path,body){const response=await fetch('/api/auto-editions/onboarding'+path,{credentials:'same-origin',...(body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})});const data=await response.json();if(!response.ok)throw Error(data.error||'Preparation unavailable.');return data;}
function selected(){return rows.find(r=>r.product_gid===$('products').value);}
function change(keepReview=false){const row=selected();$('reason').textContent=row?.reason||'';$('retry').disabled=!row||!['Blocked','Needs PSD Repair'].includes(row.status)||!!row.preparation_hash;$('prepareNow').disabled=!row||!['Awaiting preparation','Deferred'].includes(row.status);$('review').disabled=!row?.preparation_hash;if(!keepReview){$('quality').hidden=true;$('confirm').checked=false;$('approve').disabled=true;}}
async function load(passive=false){if(loading)return;loading=true;try{
 const old=$('products').value,oldHash=selected()?.preparation_hash,data=await api('');
 continuous=data.continuous_enabled===true;
 if(passive&&(!$('quality').hidden||['SELECT','INPUT'].includes(document.activeElement?.tagName)))return;
 const keepReview=!$('quality').hidden&&data.rows.some(r=>r.product_gid===old&&r.preparation_hash===oldHash);
 rows=data.rows;
 if(continuous&&data.counts){
  $('summary').textContent=['Total mapped','Cloud Ready','Preparing','Queued','Needs Review','Needs PSD Repair','Failed','Remaining'].map(k=>k+': '+(data.counts[k]||0)).join(' · ');
  $('summary').title='Uploaded: '+(data.counts.Uploaded||0)+' · Production Ready: '+(data.counts['Production Ready']||0)+' · Remaining includes designs needing attention.';
  const current=data.current?data.current.title+' — '+data.current.stage:'No active preparation';
  const last=data.last_success?'Last prepared: '+(data.last_success.title||data.last_success.product_gid)+' · '+data.last_success.at:'No completed preparation recorded';
  $('host').textContent=[data.processing,current,last,'Heartbeat: '+(data.host.last_seen||'unavailable')].join(' · ');
 }else{
  const counts={};for(const row of rows)counts[row.status]=(counts[row.status]||0)+1;
  $('summary').textContent=data.mapped+' mapped products / '+rows.length+' queue entries  /  '+['Cloud Ready','Preparing','Needs PSD Repair','Blocked','Awaiting preparation','Deferred'].map(k=>(counts[k]||0)+' '+k).join(' / ');
  $('host').textContent=data.host.last_seen?'Preparation host last contacted server: '+data.host.last_seen:'No preparation host has contacted the server yet.';
 }
 $('resume').hidden=compact||continuous;
 $('products').replaceChildren(...rows.map(r=>new Option(r.product_title+'  -  '+(r.display_status||r.status),r.product_gid)));
 if(rows.some(r=>r.product_gid===old))$('products').value=old;
 change(keepReview);
 }catch(e){status(e.message);}finally{loading=false;}}

function send(type,extra={}){popup?.postMessage({studio:1,nonce,type,...extra},local);}
$('resume').onclick=async()=>{try{const data=await api('/resume',{});status(data.mapped+' existing mappings preserved; commercial priorities refreshed.');await load();}catch(e){status(e.message);}};
$('hostConsent').onchange=()=>{$('connect').disabled=!$('hostConsent').checked;};
$('connect').onclick=()=>{nonce='edition='+Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('');popup=window.open(local+'/pair#'+nonce,'sports-cave-master-preparation','popup,width=420,height=230');if(!popup){status('Allow the one-time preparation companion window, then retry.');return;}connected=false;registering=false;clearInterval(timer);let attempts=0;timer=setInterval(()=>{if(++attempts>60){clearInterval(timer);status('Preparation companion unavailable. Existing queue and assets are retained.');return;}if(!connected)send('request');},1000);send('request');status('Connecting to the existing Photoshop preparation companion...');};
$('pause').onclick=async()=>{try{await api('/host/revoke',{});status('Preparation host access revoked. Source files and completed checkpoints are retained.');}catch(e){status(e.message);}};
addEventListener('message',async event=>{if(event.source!==popup||event.origin!==local||event.data?.studio!==1||event.data.nonce!==nonce)return;const data=event.data;if(data.type==='catalog'&&!registering){connected=true;registering=true;clearInterval(timer);try{const config=await api('/host',{confirm_preparation_host:true});send('edition-prepare-host',{config});timer=setTimeout(()=>status('Preparation host did not acknowledge connection. Update the existing companion and reconnect; the queue is retained.'),30000);status('Authorising background preparation on this computer...');}catch(e){status(e.message);}}if(data.type==='edition-prepare-host-result'){clearTimeout(timer);if(data.error)status(data.error);else{status('Background preparation connected. New Add mappings will be picked up automatically while this Photoshop computer is available.');popup.close();popup=null;load();}}});
$('prepareNow').onclick=async()=>{try{await api('/prepare-now',{product_gid:selected().product_gid});await load();}catch(e){status(e.message);}};
$('refresh').onclick=()=>load(false);$('products').onchange=()=>change(false);
$('retry').onclick=async()=>{try{await api('/retry',{product_gid:selected().product_gid});await load();}catch(e){status(e.message);}};
$('review').onclick=()=>{const row=selected();$('quality').hidden=false;$('preview').src='/api/auto-editions/onboarding/preview?product_gid='+encodeURIComponent(row.product_gid)+'&hash='+encodeURIComponent(row.preparation_hash);};
$('confirm').onchange=()=>{$('approve').disabled=!$('confirm').checked;};
$('approve').onclick=async()=>{try{const row=selected();$('approve').disabled=true;await api('/approve',{product_gid:row.product_gid,hash:row.preparation_hash,confirm_visual_quality:$('confirm').checked});status('Cloud Ready for preview downloads. Production readiness requires supplier validation.');await load();if(compact)parent.postMessage({type:'sports-cave-auto-edition-updated'},location.origin);}catch(e){status(e.message);}};
const polling=setInterval(()=>{if(continuous&&!document.hidden&&$('quality').hidden&&!['SELECT','INPUT'].includes(document.activeElement?.tagName))load(true);},25000);
addEventListener('pagehide',()=>{clearInterval(timer);clearInterval(polling);});load().then(()=>{if(compact){$('products').value=product;if(selected()?.preparation_hash)$('review').click();else $('reason').textContent='Preparation unavailable. Refresh the status.';}});
</script></body></html>
