<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Download JPG</title>
<style>body{font:14px system-ui;margin:18px;color:#243145}h1{font-size:17px;margin:0 0 12px}a,button{font:inherit;padding:8px 12px;border:1px solid #ccd3dd;border-radius:6px;background:#fff;color:#174d92}small{display:block;margin-top:12px;color:#5c6470}.spin:before{content:'';display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#174d92;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}</style></head>
<body><h1>Download JPG</h1><p id="state" role="status" class="spin">Generating…</p><a id="download" hidden>Ready — Download JPG</a><button id="retry" hidden>Retry</button><small>TEST output · Not approved for production printing</small>
<script>
const state=document.getElementById('state'),link=document.getElementById('download'),retry=document.getElementById('retry');
const id=new URLSearchParams(location.search).get('allocation_id');let stopped=false;
addEventListener('pagehide',()=>stopped=true);retry.onclick=()=>location.reload();
async function request(path,options){const r=await fetch(path,options);const j=await r.json();if(!r.ok)throw Error(j.error||'Generation is unavailable.');return j;}
(async()=>{try{const query='?allocation_id='+encodeURIComponent(id);const job=await request('/api/auto-editions/start'+query,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const suffix=query+'&job_id='+encodeURIComponent(job.job_id);
for(let n=0;n<480&&!stopped;n++){const r=await request('/api/auto-editions/state'+suffix);if(r.status==='Blocked')throw Error('Generation is blocked. Ask an administrator to review this design.');if(r.status==='Ready'){state.className='';state.textContent='Ready';link.href='/api/auto-editions/file'+suffix;link.download=r.filename;link.hidden=false;link.click();return;}await new Promise(resolve=>setTimeout(resolve,750));}if(!stopped)throw Error('Generation is taking longer than expected. Retry to check the same job.');
}catch(error){state.className='';state.textContent=error.message;retry.hidden=false;}})();
</script></body></html>
