<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Bulk Review</title>
<style>
body{font:14px system-ui;margin:12px;color:#28323d;background:#fff}button{padding:7px 10px;background:#fff;border:1px solid #ccd2d9;border-radius:5px;cursor:pointer}button:disabled{opacity:.45;cursor:default}header{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:#fff;padding:6px 0;z-index:1}h2{font-size:17px;margin:0 0 5px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}figure{margin:0;border:1px solid #e0e4e8;border-radius:6px;padding:7px;min-width:0}figure img{width:100%;height:160px;object-fit:contain;cursor:zoom-in;background:#f6f7f8}figcaption{margin-top:5px;overflow-wrap:anywhere}small{display:block;color:#637083}dialog{max-width:95vw;max-height:95vh;border:1px solid #ccd2d9;border-radius:8px}dialog img{display:block;max-width:85vw;max-height:80vh}#message{margin:8px 0;color:#536274}#proof{width:min(700px,95vw)}
</style></head><body>
<h2>Bulk Review</h2><small>Review artwork, plaque and number placement. Approval permits TEST previews only. Use Review / Repair for designs needing attention.</small>
<header><button id="select">Select All Eligible</button><button id="clear">Clear Selection</button><button id="approve" disabled>Approve Selected</button><button id="all" disabled>Approve All Eligible</button><button id="reload">Refresh</button></header>
<div id="message" role="status">Loading review metadata…</div><div id="grid"></div>
<dialog id="large"><button id="close-large">Close preview</button><img id="large-image" alt="Larger artwork preview"></dialog>
<dialog id="proof"><p id="confirmation"></p><label><input type="checkbox" id="confirm"> I have reviewed the selected artwork, plaques, edition numbers, borders and enlargement quality.</label><p>Current source, files and evidence will be rechecked. Supplier certification remains separate.</p><button id="cancel">Cancel</button> <button id="accept" disabled>Confirm TEST Approval</button></dialog>
<script>
const $=id=>document.getElementById(id);let ids=[],rows=[],selected=new Set(),pending=[],busy=false,generation=0;
const timings={};window.reviewTimings=timings;
async function api(path,body){const r=await fetch('/api/auto-editions/bulk/'+path,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Review unavailable.');return d;}
function controls(){const eligible=rows.filter(r=>r.eligible).length;$('approve').disabled=busy||!selected.size;$('all').disabled=busy||!eligible;for(const id of ['select','clear','reload'])$(id).disabled=busy;for(const box of document.querySelectorAll('#grid input'))box.disabled=busy||!rows.find(r=>r.product_gid===box.value)?.eligible;}
function imageURL(row,large=false){return '/api/auto-editions/bulk/image?'+new URLSearchParams({product_gid:row.product_gid,hash:row.hash,...(large?{large:'1'}:{})});}
async function images(tasks,version){let next=0,finished=0;const start=performance.now();async function worker(){while(next<tasks.length&&version===generation){const task=tasks[next++];await new Promise(resolve=>{task.img.onload=resolve;task.img.onerror=()=>{task.row.eligible=false;selected.delete(task.row.product_gid);const card=task.img.closest('figure');card.querySelector('input').checked=false;card.querySelector('small').textContent='Preview unavailable. Refresh or use Review / Repair.';controls();resolve();};task.img.src=imageURL(task.row);});finished++;if(finished===Math.min(8,tasks.length)){timings.initialThumbnailsMs=performance.now()-start;}}}await Promise.all(Array.from({length:Math.min(3,tasks.length)},worker));if(version===generation)timings.allThumbnailsMs=performance.now()-start;}
async function load(){if(busy)return;const version=++generation;selected.clear();const start=performance.now();$('message').textContent='Loading review metadata…';try{const data=await api('list',{product_gids:ids});if(version!==generation)return;rows=data.rows;$('grid').replaceChildren();const tasks=[];for(const row of rows){const card=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption'),label=document.createElement('label'),box=document.createElement('input'),detail=document.createElement('small'),link=document.createElement('a');img.alt=row.title;img.width=300;img.height=180;img.decoding='async';img.onclick=()=>{$('large-image').src=imageURL(row,true);$('large').showModal();};box.type='checkbox';box.value=row.product_gid;box.disabled=!row.eligible;box.onchange=()=>{box.checked?selected.add(row.product_gid):selected.delete(row.product_gid);controls();};label.append(box,document.createTextNode(row.title));caption.append(label);detail.textContent=row.eligible?'Eligible for confirmed TEST review':row.reason;link.textContent='Review / Repair';link.href='/auto-editions/status?'+new URLSearchParams({product_gid:row.product_gid});link.target='_blank';link.rel='noopener';card.append(img,caption,detail,link);$('grid').append(card);if(row.hash)tasks.push({img,row});}timings.galleryMetadataMs=performance.now()-start;timings.serverMetadataMs=data.duration_ms;$('message').textContent=rows.length+' designs need review · '+rows.filter(r=>r.eligible).length+' eligible';controls();images(tasks,version);}catch(e){$('message').textContent=e.message;}}
function selectAll(){selected=new Set(rows.filter(r=>r.eligible).map(r=>r.product_gid));for(const b of document.querySelectorAll('#grid input'))b.checked=selected.has(b.value);controls();}
function confirm(all){if(all)selectAll();pending=rows.filter(r=>r.eligible&&selected.has(r.product_gid)).map(r=>({product_gid:r.product_gid,hash:r.hash}));if(!pending.length)return;$('confirmation').textContent='Approve '+pending.length+' selected designs?';$('confirm').checked=false;$('accept').disabled=true;$('proof').showModal();}
$('select').onclick=selectAll;$('clear').onclick=()=>{selected.clear();for(const b of document.querySelectorAll('#grid input'))b.checked=false;controls();};$('approve').onclick=()=>confirm(false);$('all').onclick=()=>confirm(true);$('reload').onclick=load;$('close-large').onclick=()=>{$('large').close();$('large-image').removeAttribute('src');};$('cancel').onclick=()=>$('proof').close();$('confirm').onchange=()=>$('accept').disabled=!$('confirm').checked;
$('accept').onclick=async()=>{if(busy||!$('confirm').checked)return;busy=true;$('proof').close();controls();$('message').textContent='Rechecking current files and approving eligible designs…';const start=performance.now();try{const d=await api('approve',{items:pending,confirm_visual_quality:true});timings.bulkApprovalMs=performance.now()-start;timings.serverApprovalMs=d.duration_ms;for(const result of d.results){selected.delete(result.product_gid);const row=rows.find(r=>r.product_gid===result.product_gid);if(row)row.eligible=false;const box=[...document.querySelectorAll('#grid input')].find(b=>b.value===result.product_gid);if(box){box.checked=false;box.closest('figure').querySelector('small').textContent=result.result;}}$('message').textContent=Object.entries(d.counts).map(([k,v])=>k+': '+v).join(' / ');parent.postMessage({type:'sports-cave-auto-edition-updated'},location.origin);}catch(e){$('message').textContent=e.message;}finally{busy=false;controls();}};
addEventListener('message',event=>{if(event.source!==parent||event.origin!==location.origin||event.data?.type!=='sports-cave-bulk-products')return;ids=event.data.product_gids||[];load();});parent.postMessage({type:'sports-cave-bulk-ready'},location.origin);
</script></body></html>
