<style>

</style></head><body>
<h2>Bulk Review</h2><small>Review artwork, plaque and number placement. Approval permits TEST previews only. Use Review / Repair for designs needing attention.</small>
<header><button id="select">Select All Eligible in Batch</button><button id="clear">Clear Selection</button><button id="approve" disabled>Approve Selected</button><button id="reload">Refresh</button><button id="retry" hidden>Retry</button><button id="previous" disabled>Previous</button><button id="next" disabled>Next</button><small id="batch-count"></small></header>
<div id="progress" role="status" aria-live="polite"></div><button id="retry-approval" hidden>Retry approval tracking</button>
<div id="message" role="status" aria-live="polite">Loading review metadata…</div><div id="grid"></div>
<dialog id="large"><button id="close-large">Close preview</button><div id="large-status" role="status"></div><img id="large-image" alt="Larger artwork preview"></dialog>
<dialog id="proof"><p id="confirmation"></p><label><input type="checkbox" id="confirm"> I have reviewed the selected artwork, plaques, edition numbers, borders and enlargement quality.</label><p>Current source, files and evidence will be rechecked. Supplier certification remains separate.</p><button id="cancel">Cancel</button> <button id="accept" disabled>Confirm TEST Approval</button></dialog>
<script>

function visible(row){const b=row.img.getBoundingClientRect();return b.bottom>0&&b.top<innerHeight&&b.right>0&&b.left<innerWidth;}

const visibleImages=new IntersectionObserver(entries=>{for(const entry of entries){const row=entry.target._row;if(entry.isIntersecting)queueImage(row);}},{rootMargin:'0px'});

  $('batch-count').textContent=totalRemaining===null?'':'Batch '+(pageIndex+1)+' · '+totalRemaining+' remaining / '+totalAtOpen+' total';

function controls(defer=false){if(!defer){cancelAnimationFrame(controlsFrame);controlsFrame=0;updateControls();return;}if(!controlsFrame)controlsFrame=requestAnimationFrame(()=>{controlsFrame=0;updateControls();});}
function updateControls(){
  const ready=rows.filter(r=>r.eligible&&r.previewReady).length,confirming=$('proof').open;

  $('reload').disabled=busy||confirming;$('retry').disabled=busy||loading;

}
async function api(path,body,timeout=10000,signal){

function imageURL(row,large=false){return '/api/auto-editions/bulk/image?'+new URLSearchParams({product_gid:row.product_gid,hash:row.hash,...(large?{large:'1'}:{})});}
function queueImage(row){

          if(batchError?.name==='AbortError'){row.imageState='waiting';row.cacheChecked=false;continue;}
          if(speculative&&!value?.blob&&!value?.jpeg){row.imageState='waiting';row.cacheChecked=false;if(visible(row))queueImage(row);continue;}

            if((!batchError.status||batchError.status>=500)&&!(row.warmRetries||0)){

            continue;
          }
          if(value?.hash===row.hash&&value.state==='Unavailable'){row.imageState='failed';row.retryPreview.hidden=false;row.detail.textContent=value.error||'Preview unavailable. Retry Preview.';continue;}

            if(performance.now()-row.previewStarted>=90000){row.imageState='failed';row.retryPreview.hidden=false;row.detail.textContent='Preview is taking too long. Retry Preview.';continue;}
            row.imageState='waiting';row.cacheChecked=false;row.retryTimer=setTimeout(()=>{if(task.version===generation&&!disposed&&!row.removed)queueImage(row);},previewDelay(row));continue;

    })();
  }
}
async function fetchPreview(row,large=false,signal){
  const response=await fetch(imageURL(row,large),{credentials:'same-origin',signal});

  if(!response.ok){let message='Preview request failed ('+response.status+').';try{const body=await response.json();message=body.error||message;}catch{}const error=Error(message);error.status=response.status;throw error;}
  if(!response.headers.get('content-type')?.startsWith('image/'))throw Error('Preview returned an invalid content type.');
  return {blob:await response.blob()};
}
function pumpImages(){

    activeImages++;row.imageState='loading';row.previewStarted ||= performance.now();row.detail.textContent=row.operationText||(row.eligible?'Loading preview…':row.reason+' · Loading preview…');let settled=false;
    const controller=new AbortController();requests.add(controller);

      if(settled)return;settled=true;clearTimeout(timer);controller.abort();requests.delete(controller);row.img.onload=row.img.onerror=null;imageCancels.delete(cancel);delete row.cancelImage;activeImages--;
      if(!ok)row.img.removeAttribute('src');revokePreview(row);

      if(version===generation&&!disposed&&!cancelled){
        const transient=error&&(!error.status||error.status>=500)&&(row.transientRetries||0)<1;
        if((waiting||transient)&&performance.now()-row.previewStarted<90000){
          if(transient)row.transientRetries=(row.transientRetries||0)+1;
          row.imageState='waiting';if(waiting)row.cacheChecked=false;row.detail.textContent=waiting?'Loading verified preview…':'Preview temporarily unavailable. Retrying…';

          else{row.retryPreview.hidden=true;row.detail.textContent=row.operationText||(row.eligible?'Eligible for confirmed TEST review':row.reason);}

          if(visible(row)&&!timings.firstViewportResolvedMs&&rows.filter(visible).every(r=>r.previewReady||r.imageState==='failed'))timings.firstViewportResolvedMs=performance.now()-thumbnailStart;
          if(loadedImages===Math.min(8,rows.length))timings.initialThumbnailsMs=performance.now()-thumbnailStart;
          timings.allThumbnailsMs=performance.now()-thumbnailStart;controls(true);summary();

    };
    const cancel=()=>finish(false,true),timer=setTimeout(()=>finish(false,false,false,Error('Preview request timed out.')),10000);row.cancelImage=cancel;imageCancels.add(cancel);

}
function largePreview(row){
  if(!row.previewReady){row.previewStarted=0;queueImage(row);return;}
  clearTimeout(largeTimer);largeController?.abort();$('large-status').textContent='Loading larger preview…';$('large').showModal();
  const started=performance.now(),image=$('large-image');

    if(disposed||!$('large').open)return;
    const controller=new AbortController();largeController=controller;requests.add(controller);const deadline=setTimeout(()=>controller.abort(),10000);

      const result=await fetchPreview(row,true,controller.signal);if(disposed||!$('large').open)return;

      const url=URL.createObjectURL(result.blob);image.onload=()=>{URL.revokeObjectURL(url);$('large-status').textContent='';};image.onerror=()=>{URL.revokeObjectURL(url);$('large-status').textContent='Larger preview could not be decoded. Close and retry.';};image.src=url;
    }catch(error){if($('large').open)$('large-status').textContent=error.message||'Larger preview unavailable. Close and retry.';}

}
function append(data){
  const fragment=document.createDocumentFragment();
  for(const value of data){
    if(byId.has(value.product_gid))continue;
    const row={...value,reviewEligible:value.eligible,previewReady:false,imageState:'waiting'},card=document.createElement('figure'),img=document.createElement('img'),caption=document.createElement('figcaption'),label=document.createElement('label'),box=document.createElement('input'),detail=document.createElement('small'),link=document.createElement('a'),retryPreview=document.createElement('button');
    img.alt=row.title;img.width=300;img.height=180;img.decoding='async';img._row=row;img.onclick=()=>largePreview(row);
    box.type='checkbox';box.value=row.product_gid;box.disabled=true;box.onchange=()=>{if(box.checked&&row.eligible&&row.previewReady)selected.add(row.product_gid);else selected.delete(row.product_gid);controls();};
    label.append(box,document.createTextNode(row.title));caption.append(label);detail.textContent=row.eligible?'Loading preview…':row.reason;
    link.textContent='Review / Repair';link.href='/auto-editions/status?'+new URLSearchParams({product_gid:row.product_gid});link.target='_blank';link.rel='noopener';

let retryTarget=null;
function rememberBatch(){
  batchSelections.set(pageIndex,new Set(rows.filter(r=>selected.has(r.product_gid)).map(r=>r.product_gid+'|'+r.hash)));
  batchScroll.set(pageIndex,scrollY);
}
function removeCard(row){
  row.removed=true;clearTimeout(row.retryTimer);nearImages.unobserve(row.img);visibleImages.unobserve(row.img);

async function loadPage(targetIndex=pageIndex,startCursor=pageStarts[targetIndex],refill=false){

function navigateBatch(delta){

function refillBatch(){

}
function cancelWork(){for(const request of requests)request.abort();requests.clear();imageTasks.length=0;warmTasks.length=0;nearImages.disconnect();visibleImages.disconnect();for(const row of rows){clearTimeout(row.retryTimer);revokePreview(row);row.img.removeAttribute('src');}for(const cancel of [...imageCancels])cancel();clearTimeout(largeTimer);$('large-image').removeAttribute('src');}

function requestContext(){

function selectAll(){selected=new Set(rows.filter(r=>r.eligible&&r.previewReady).map(r=>r.product_gid));controls();}
function confirmSelection(){

}
$('select').onclick=selectAll;$('clear').onclick=()=>{selected.clear();controls();};$('approve').onclick=confirmSelection;
$('reload').onclick=reset;$('retry').onclick=()=>{if(loading||busy)return;errorText='';if(started)loadPage(...(retryTarget||[pageIndex]));else requestContext();};$('previous').onclick=()=>navigateBatch(-1);$('next').onclick=()=>navigateBatch(1);
$('close-large').onclick=()=>{$('large').close();clearTimeout(largeTimer);$('large-image').removeAttribute('src');};
$('large').addEventListener('close',()=>{clearTimeout(largeTimer);largeController?.abort();$('large-image').onload=$('large-image').onerror=null;$('large-image').removeAttribute('src');});
$('cancel').onclick=()=>{$('proof').close();controls();};$('proof').addEventListener('cancel',()=>queueMicrotask(controls));$('confirm').onchange=()=>$('accept').disabled=!$('confirm').checked;

function saveRequest(value){sessionStorage.setItem(approvalStorage,JSON.stringify(value));approvalRequest=value;}
function clearRequest(){try{sessionStorage.removeItem(approvalStorage);}catch{}approvalRequest=null;}
function applyOperations(){
  for(const row of rows){const op=operationStates.get(row.product_gid);if(!op||op.hash!==row.hash)continue;
    const ready=['Cloud Ready','Production Ready'].includes(op.current_status)&&op.current_hash===row.hash;
    if(op.state==='Approved'&&ready){const key=row.product_gid+'|'+row.hash;removeCard(row);if(!acceptedPreparations.has(key)){acceptedPreparations.add(key);if(totalRemaining!==null)totalRemaining=Math.max(0,totalRemaining-1);refillBatch();}continue;}
    const active=['Pending','Processing'].includes(op.state),key=JSON.stringify([op.state,op.reason,op.job_id]);
    row.operationText=active?'Approving…'+(op.state==='Pending'?' · Queued for validation':''):op.state==='Approved'?'TEST approval committed'+(op.current_status?' · '+op.current_status:''):op.state==='Failed'?'Approval Failed · '+op.reason:op.state+' · '+op.reason;
    row.eligible=active?false:row.reviewEligible;
    row.detail.textContent=row.operationText;row.detail.classList.toggle('approving',active);
    if(active||row.operationKey!==key)selected.delete(row.product_gid);row.operationKey=key;
  }
  rows=rows.filter(r=>!r.removed);
}
function queueFailures(operations){
  for(const op of operations){if(!['Failed','Needs Attention'].includes(op.state)||byId.has(op.product_gid)||restoredFailures.has(op.job_id||op.product_gid))continue;restoredFailures.add(op.job_id||op.product_gid);failureQueue.push(op.product_gid);}
  drainFailures();
}
async function drainFailures(){
  if(restoringFailures||loading||disposed||!failureQueue.length)return;
  // Failed operations remain visible through ordinary paged listing. Never append
  // background failure cards outside the current ten-design selection scope.
  failureQueue.length=0;
  if(pageIndex===0)refillBatch();
  else{resultText='Some approvals need attention. Use Previous or Refresh to review their batch.';summary();}
}

function showProgress(data,notify=true){
  operationStates.clear();for(const op of data.rows)operationStates.set(op.product_gid,op);applyOperations();
  const counts=data.counts,done=['Approved','Skipped','Needs Attention','Failed'].reduce((sum,k)=>sum+counts[k],0),total=data.rows.length;
  $('progress').textContent=(data.active?'Approving '+Math.min(total,done+counts.Processing)+' of '+total+' designs… · ':'')+Object.entries(counts).map(([key,value])=>key+': '+value).join(' / ');
  $('retry-approval').hidden=true;queueFailures(data.rows);controls();summary();
  if(notify)parent.postMessage({type:'sports-cave-bulk-progress',rows:data.rows},location.origin);
}
async function trackApprovals(){
  if(disposed||!started)return;
  if(approvalFlight){trackingAgain=true;return;}
  clearTimeout(approvalTimer);approvalFlight=true;
  try{
    const data=await api('progress',approvalRequest?{batch_id:approvalRequest.request_id}:{product_gids:ids,watch:[...operationStates.keys()].filter(pid=>ids.includes(pid))},8000);if(disposed)return;
    if(approvalRequest&&!data.found){
      $('progress').textContent='Request not recorded yet. Retry submission using the same saved request ID.';
      $('retry-approval').textContent='Reconcile and retry submission';$('retry-approval').hidden=false;return;
    }
    if(approvalRequest&&data.found){const key=approvalRequest.request_id;if(submissionInPopup&&(data.active||data.counts.Approved)&&!data.counts.Failed&&!data.counts['Needs Attention']&&!data.counts.Skipped){handoffAccepted(key,data);return;}submissionInPopup=false;clearRequest();}
    trackingFailures=0;showProgress(data);
    if(!data.active){if(approvalRequest)clearRequest();return;}
    approvalTimer=setTimeout(trackApprovals,3000);
  }catch(error){if(!disposed){$('progress').textContent='Progress temporarily unavailable. Accepted work continues in the background. Retry tracking to retrieve recorded results.';$('retry-approval').textContent='Retry approval tracking';$('retry-approval').hidden=false;if(error.status!==403&&++trackingFailures<=3)approvalTimer=setTimeout(trackApprovals,[3000,6000,12000][trackingFailures-1]);}}
  finally{approvalFlight=false;if(trackingAgain&&!disposed){trackingAgain=false;queueMicrotask(trackApprovals);}}
}
function recoverApprovals(){
  try{const value=JSON.parse(sessionStorage.getItem(approvalStorage)||'null');if(value?.request_id&&Array.isArray(value.items))approvalRequest=value;}catch{}
  trackApprovals();
}
function handoffAccepted(batchID,data){
  if(data?.rows)showProgress(data,false);
  clearRequest();submissionInPopup=false;
  parent.postMessage({type:'sports-cave-bulk-accepted',batch_id:batchID,rows:data?.rows||[],partial:!!(data?.counts?.Failed||data?.counts?.['Needs Attention']||data?.counts?.Skipped)},location.origin);
}
async function submitApproval(){
  if(busy||!approvalRequest||disposed)return;submissionInPopup=true;busy=true;controls();$('progress').textContent='Saving confirmed approval batch…';
  try{
    const start=performance.now(),data=await api('approve',{...approvalRequest,confirm_visual_quality:true},10000);if(disposed)return;
    if(data.batch_id!==approvalRequest.request_id||!data.accepted)throw Error('Checking saved request…');
    timings.batchAcknowledgementMs=performance.now()-start;
    const acceptedID=approvalRequest.request_id;handoffAccepted(acceptedID,data);
    if(!data.rows)$('progress').textContent='Approval batch accepted. Current progress is in Auto Editions.';
  }catch(error){if(!disposed){
    const rejected=[403,409].includes(error.status);
    for(const item of approvalRequest?.items||[]){const row=byId.get(item.product_gid);if(row)row.detail.textContent=rejected?'Submission rejected: '+error.message:'Checking durable acceptance before retry…';}
    $('progress').textContent=rejected?'Submission rejected: '+error.message:'Acknowledgement delayed. Reconciling the saved request before any retry…';
  }}
  finally{busy=false;if(!disposed){controls();trackApprovals();}}
}
$('retry-approval').onclick=async()=>{
  if(busy||approvalFlight)return;
  if(!approvalRequest){restoredFailures.clear();trackApprovals();return;}
  try{
    const data=await api('progress',{batch_id:approvalRequest.request_id},8000);
    if(data.found){const key=approvalRequest.request_id;handoffAccepted(key,data);if(data.active)approvalTimer=setTimeout(trackApprovals,3000);else clearRequest();}
    else await submitApproval();
  }catch(error){$('progress').textContent='Connection unavailable. Your saved request ID is retained; retry tracking when connected.';}
};
$('accept').onclick=()=>{
  if(busy||!$('confirm').checked)return;
  try{saveRequest({request_id:crypto.randomUUID(),items:pending});}
  catch{ $('progress').textContent='Browser storage unavailable. Enable session storage before submitting a recoverable batch.';return; }
  $('proof').close();submitApproval();
};

function dispose(){if(disposed)return;disposed=true;generation++;clearTimeout(bootstrapTimer);clearTimeout(approvalTimer);cancelAnimationFrame(controlsFrame);cancelWork();clearTimeout(refillTimer);}
addEventListener('pagehide',dispose);
addEventListener('message',event=>{
  if(event.origin!==location.origin)return;
  const bridge=parent.SportsCaveEditionBulk;
  const owningBridge=event.source===bridge?.sourceWindow&&bridge?.ownsGallery(window);
  if(event.source!==parent&&!owningBridge)return;
  if(event.data?.type==='sports-cave-bulk-close'){dispose();return;}
  if(event.data?.type!=='sports-cave-bulk-products'||!Array.isArray(event.data.product_gids))return;
  const next=[...new Set(event.data.product_gids)],key=JSON.stringify(next);if(started&&key===contextKey)return;
  ids=next;contextKey=key;started=true;clearTimeout(bootstrapTimer);reset();
});
controls();requestContext();
</script></body></html>
