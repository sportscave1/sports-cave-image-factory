    <style>

    <div class="app" id="app">

    <script src="/files-original-actions.js"></script>
    <script>
      const STORAGE_KEY = "sports-cave-files-state-v2";
      const CLIPBOARD_KEY = "sports-cave-files-clipboard-v1";
      const CHUNK_BYTES = 8 * 1024 * 1024;
      const MAX_UPLOAD_CONCURRENT = 2;
      const MAX_THUMBNAIL_CONCURRENT = 4;
      const MAX_CLIENT_THUMBNAILS = 160;
      const FOLDER_PAGE_SIZE = 500;
      const nameCollator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
      const MAX_CLIENT_FOLDER_CACHE = 24;
      const CLIENT_FOLDER_REVALIDATE_SECONDS = 20;
      const VIEW_MODES = ["large", "medium", "small", "list", "details"];
      const VIEW_LABELS = { large: "Comfortable icons", medium: "Compact icons", small: "Small icons", list: "List", details: "Details" };
      const SORT_LABELS = { name: "Name", modified: "Date modified", type: "Type", size: "Size" };

      const elements = Object.fromEntries([
        "backButton", "forwardButton", "upButton", "refreshButton", "breadcrumbs", "searchInput", "searchClear",
        "openButton", "newButton", "uploadButton", "copyButton", "downloadButton", "renameButton", "deleteButton", "sortButton", "viewButton", "moreButton",
        "results", "resultsShell", "detailsHeader", "dateModifiedHeader", "modifiedSortArrow", "items", "dropOverlay", "itemCount", "selectionCount", "filesInput", "folderInput",
        "menu", "modalBackdrop", "modal", "toast", "toastText", "toastAction", "loadingIndicator",
        "uploadPanel", "uploadRows", "uploadTitle", "uploadClose", "fileTooltip",
        "previewPanel", "previewTitle", "previewClose", "previewFrame", "previewMount"
      ].map(id => [id, document.getElementById(id)]));
      document.querySelectorAll(".command").forEach(button => {
        const label = button.querySelector(".command-label")?.textContent.trim();
        if (label) { button.setAttribute("aria-label", label); button.title = label; }
      });

      function restoredState() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {}; }
        catch (_) { return {}; }
      }

      function restoredClipboard() {
        try {
          const value = JSON.parse(sessionStorage.getItem(CLIPBOARD_KEY) || "null");
          return value && ["copy", "cut"].includes(value.mode) && Array.isArray(value.items)
            ? value
            : { mode: "", items: [] };
        } catch (_) {
          return { mode: "", items: [] };
        }
      }

      const restored = restoredState();
      const query = new URLSearchParams(location.search);
      const linkedProduct = query.get('psd_product_gid');
      let savedEditionId = null;
      const requestedRelativePath = query.get("relative_path") || "";
      const state = {
        rootPath: "",
        rootName: "Sportscave Team Folder",
        cacheNamespace: "",
        currentPath: requestedRelativePath ? "" : (query.get("path") || String(restored.currentPath || "")),
        timeZone: "UTC",
        back: Array.isArray(restored.back) ? restored.back.slice(-30) : [],
        forward: Array.isArray(restored.forward) ? restored.forward.slice(-30) : [],
        view: VIEW_MODES.includes(query.get("view")) ? query.get("view") : (VIEW_MODES.includes(restored.view) ? restored.view : "medium"),
        sortKey: Object.hasOwn(SORT_LABELS, query.get("sort")) ? query.get("sort") : (Object.hasOwn(SORT_LABELS, restored.sortKey) ? restored.sortKey : "name"),
        sortDir: (query.get("dir") || restored.sortDir) === "desc" ? "desc" : "asc",
        searchByPath: restored.searchByPath && typeof restored.searchByPath === "object" ? restored.searchByPath : {},
        items: [],
        canDelete: false,
        selection: new Set(),
        focusedPath: "",
        anchorIndex: -1,
        loading: false,
        loadingMore: false,
        navigationToken: 0,
        folderCache: new Map(),
        folderPositions: new Map(),
        virtual: null,
        scrollFrame: 0,
        folderRequests: new Map(),
        folderControllers: new Map(),
        visibleItemsCache: { items: null, search: "", sortKey: "", sortDir: "", value: [] },
        openStamp: { path: "", time: 0 },
        toastTimer: 0,
        toastIdentity: "",
        imageViewerWindow: null,
        imageViewerReady: false,
        imageViewerPending: null,
        imageViewerRetryTimer: 0,
        menuParent: null,
        thumbnailObserver: null,
        thumbnailQueue: [],
        thumbnailActive: 0,
        thumbnailControllers: new Set(),
        thumbnailTasks: new Map(),
        thumbnailInFlight: new Set(),
        thumbnailCache: new Map(),
        thumbnailFailures: new Map(),
        thumbnailGeneration: 0,
        dragDepth: 0,
        uploadRows: [],
        uploadQueue: [],
        uploadActive: 0,
        uploadRefreshTimer: 0,
        uploadConflict: restored.uploadConflict || "cancel",
        clipboard: restoredClipboard(),
        clipboardBusy: false,
        tooltipTimer: 0,
        tooltipItem: null,
        tooltipPointer: { x: 0, y: 0 },
      };

      function persistState() {
        const payload = {
          currentPath: state.currentPath,
          back: state.back.slice(-30),
          forward: state.forward.slice(-30),
          view: state.view,
          sortKey: state.sortKey,
          sortDir: state.sortDir,
          searchByPath: state.searchByPath,
          uploadConflict: state.uploadConflict,
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (_) {}
        const params = new URLSearchParams();
        if (state.currentPath) params.set("path", state.currentPath);
        params.set("view", state.view);
        params.set("sort", state.sortKey);
        params.set("dir", state.sortDir);
        const search = currentSearch();
        if (search) params.set("q", search);
        history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
      }

      function persistClipboard() {
        try {
          if (state.clipboard.items.length) sessionStorage.setItem(CLIPBOARD_KEY, JSON.stringify(state.clipboard));
          else sessionStorage.removeItem(CLIPBOARD_KEY);
        } catch (_) {}
      }

      function currentSearch() {
        return String(state.searchByPath[state.currentPath] || "");
      }

      function apiJson(path, options) {
        return fetch(path, Object.assign({ credentials: "same-origin" }, options || {})).then(async response => {
          let payload = {};
          try { payload = await response.json(); } catch (_) {}
          if (!response.ok || payload.ok === false) {
            const error = new Error(payload.message || "Files could not complete this action.");
            error.code = payload.code || "files_error";
            error.status = response.status;
            error.offset = payload.offset;
            error.conflicts = Array.from(payload.conflicts || []);
            error.payload = payload;
            throw error;
          }
          return payload;
        });
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
      }

      function pathId(path) {
        let hash = 2166136261;
        for (const char of String(path || "")) {
          hash ^= char.codePointAt(0);
          hash = Math.imul(hash, 16777619);
        }
        return `files-item-${(hash >>> 0).toString(16)}`;
      }

      function formatDate(value, { includeZone = false } = {}) {
        if (!value) return "-";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "-";
        let formatter;
        try {
          formatter = new Intl.DateTimeFormat("en-AU", {
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit",
            hour12: true,
            timeZone: state.timeZone,
            ...(includeZone ? { timeZoneName: "short" } : {}),
          });
        } catch (_) {
          formatter = new Intl.DateTimeFormat("en-AU", {
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit",
            hour12: true,
            timeZone: "UTC",
            ...(includeZone ? { timeZoneName: "short" } : {}),
          });
        }
        const parts = Object.fromEntries(
          formatter.formatToParts(date)
            .filter(part => part.type !== "literal")
            .map(part => [part.type, part.value])
        );
        const base = `${parts.day} ${parts.month} ${parts.year}, ${parts.hour}:${parts.minute} ${String(parts.dayPeriod || "").toUpperCase()}`;
        if (!includeZone) return base;
        const zone = state.timeZone === "Asia/Manila" ? "PHT" : String(parts.timeZoneName || "UTC");
        return `${base} ${zone}`;
      }

      function hideFileTooltip() {
        window.clearTimeout(state.tooltipTimer);
        state.tooltipTimer = 0;
        state.tooltipItem = null;
        elements.fileTooltip.classList.remove("visible");
        elements.fileTooltip.setAttribute("aria-hidden", "true");
        elements.fileTooltip.replaceChildren();
      }

      function positionFileTooltip() {
        if (!elements.fileTooltip.classList.contains("visible")) return;
        const offset = 14;
        const bounds = elements.fileTooltip.getBoundingClientRect();
        const left = Math.max(6, Math.min(state.tooltipPointer.x + offset, window.innerWidth - bounds.width - 6));
        const preferredTop = state.tooltipPointer.y + offset;
        const top = preferredTop + bounds.height <= window.innerHeight - 6
          ? preferredTop
          : Math.max(6, state.tooltipPointer.y - bounds.height - 8);
        elements.fileTooltip.style.left = `${left}px`;
        elements.fileTooltip.style.top = `${top}px`;
      }

      function showFileTooltip(item) {
        if (!item || state.loading) return;
        elements.fileTooltip.replaceChildren();
        const name = document.createElement("div");
        name.className = "file-tooltip-name";
        name.textContent = item.name;
        elements.fileTooltip.appendChild(name);
        const lines = [];
        if (item.tag === "folder") {
          lines.push(`Item type: ${item.tooltip_type || "File folder"}`);
          if (item.latest_activity) {
            lines.push(`Latest known activity: ${item.latest_activity_tooltip_label || formatDate(item.latest_activity, { includeZone: true })}`);
          }
        } else {
          lines.push(`Item type: ${item.tooltip_type || item.type || "File"}`);
          lines.push(`Date modified: ${item.modified_tooltip_label || formatDate(item.modified, { includeZone: true })}`);
          lines.push(`Size: ${item.tooltip_size_label || item.size_label || "0 B"}`);
          const dimensions = item.kind === "image" ? item.dimensions : null;
          const width = Number(dimensions && dimensions.width);
          const height = Number(dimensions && dimensions.height);
          if (width > 0 && height > 0) lines.push(`Dimensions: ${width} \u00d7 ${height}`);
        }
        lines.forEach(text => {
          const line = document.createElement("div");
          line.className = "file-tooltip-line";
          line.textContent = text;
          elements.fileTooltip.appendChild(line);
        });
        state.tooltipItem = item;
        elements.fileTooltip.classList.add("visible");
        elements.fileTooltip.setAttribute("aria-hidden", "false");
        positionFileTooltip();
      }

      function scheduleFileTooltip(item, event) {
        hideFileTooltip();
        state.tooltipPointer = { x: event.clientX, y: event.clientY };
        state.tooltipTimer = window.setTimeout(() => showFileTooltip(item), 600);
      }

      function moveFileTooltip(event) {
        state.tooltipPointer = { x: event.clientX, y: event.clientY };
        positionFileTooltip();
      }

      const TEMPORARY_TOAST_MS = 3000;
      function showToast(message, { kind = "", duration = TEMPORARY_TOAST_MS, actionLabel = "", action = null } = {}) {
        const identity = `${kind}:${String(message || "")}:${String(actionLabel || "")}`;
        if (state.toastIdentity === identity && elements.toast.classList.contains("visible")) {
          // Repeated copy failures may have a new selection snapshot.
          elements.toastAction.onclick = action || null;
          return;
        }
        window.clearTimeout(state.toastTimer);
        state.toastIdentity = identity;
        elements.toast.className = `toast visible${kind ? ` ${kind}` : ""}`;
        elements.toastText.textContent = String(message || "");
        elements.toastAction.style.display = actionLabel ? "block" : "none";
        elements.toastAction.textContent = actionLabel;
        elements.toastAction.onclick = action || null;
        if (duration > 0) {
          state.toastTimer = window.setTimeout(() => {
            elements.toast.classList.remove("visible");
            elements.toastText.textContent = "";
            elements.toastAction.onclick = null;
            state.toastIdentity = "";
            state.toastTimer = 0;
          }, duration);
        }
      }

      function itemIcon(item, { thumbnail = true } = {}) {
        const ext = String(item.extension || "").toUpperCase();
        if (item.kind === "photoshop") {
          const label = ext === "PSB" ? "PSB" : "PSD";
          return `<svg viewBox="0 0 104 120" role="img" aria-label="${label} Photoshop document"><path d="M8 3h65l23 23v91H8z" fill="#001d35" stroke="#23a8f2" stroke-width="4"/><path d="M73 3v24h23" fill="#0b4f79" stroke="#23a8f2" stroke-width="4"/><text x="52" y="65" text-anchor="middle" fill="#31a8ff" font-family="Segoe UI,Arial,sans-serif" font-size="39" font-weight="700">Ps</text><text x="52" y="96" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">${label}</text></svg>`;
        }
        if (item.kind === "folder") {
          return `<svg viewBox="0 0 56 48" aria-hidden="true"><path d="M4 14V9a3 3 0 0 1 3-3h14l5 6h23a3 3 0 0 1 3 3v24a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3Z" fill="#e5c16a" stroke="#ad8735" stroke-width="1.4"/><path d="M4 17h48v22a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3Z" fill="#f2d58b" stroke="#ad8735" stroke-width="1.4"/></svg>`;
        }
        if (thumbnail && item.thumbnail_url) {
          return `${itemIcon(item, {thumbnail:false})}<span class="thumbnail-skeleton" aria-hidden="true"></span><img class="thumbnail" alt="" decoding="async" data-thumbnail-url="${escapeHtml(item.thumbnail_url)}" data-thumbnail-key="${escapeHtml(item.thumbnail_key || item.thumbnail_url)}">`;
        }
        const colors = {
          image: ["#287a4b", "IMG"], pdf: ["#b3261e", "PDF"], document: ["#185abd", ext || "DOC"],
          sheet: ["#107c41", ext || "XLS"], video: ["#744da9", "VID"], archive: ["#8a6419", ext || "ZIP"],
          design: ["#7b3fa0", ext || "ART"], file: ["#65717b", ext || "FILE"]
        };
        const [color, badge] = colors[item.kind] || colors.file;
        return `<svg viewBox="0 0 96 112" aria-hidden="true"><path d="M9 3h56l22 22v84H9z" fill="#f8fafb" stroke="#aeb7bd" stroke-width="3"/><path d="M65 3v23h22" fill="#e4e9ec" stroke="#aeb7bd" stroke-width="3"/><rect x="18" y="54" width="60" height="29" rx="3" fill="${color}"/><text x="48" y="74" text-anchor="middle" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">${escapeHtml(String(badge).slice(0, 5))}</text></svg>`;
      }

      function visibleItems() {
        const search = currentSearch().trim().toLocaleLowerCase();
        const cached = state.visibleItemsCache;
        if (
          cached.items === state.items
          && cached.search === search
          && cached.sortKey === state.sortKey
          && cached.sortDir === state.sortDir
        ) {
          return cached.value;
        }
        const filtered = search ? state.items.filter(item => item.name.toLocaleLowerCase().includes(search)) : state.items.slice();
        const direction = state.sortDir === "desc" ? -1 : 1;
        const value = filtered.sort((left, right) => {
          if (left.tag !== right.tag) return left.tag === "folder" ? -1 : 1;
          let a;
          let b;
          if (state.sortKey === "modified") {
            a = Date.parse(left.modified || "");
            b = Date.parse(right.modified || "");
            const aValid = Number.isFinite(a);
            const bValid = Number.isFinite(b);
            if (aValid !== bValid) return aValid ? -1 : 1;
            if (!aValid && !bValid) return nameCollator.compare(String(left.name), String(right.name));
          }
          else if (state.sortKey === "size") { a = Number(left.size || 0); b = Number(right.size || 0); }
          else if (state.sortKey === "type") { a = left.type; b = right.type; }
          else { a = left.name; b = right.name; }
          if (typeof a === "number") return (a - b) * direction;
          return nameCollator.compare(String(a), String(b)) * direction;
        });
        state.visibleItemsCache = {
          items: state.items,
          search,
          sortKey: state.sortKey,
          sortDir: state.sortDir,
          value,
        };
        return value;
      }

      function renderBreadcrumbs() {
        elements.breadcrumbs.replaceChildren();
        const root = state.rootPath;
        const relative = state.currentPath && root && state.currentPath.toLocaleLowerCase().startsWith(root.toLocaleLowerCase())
          ? state.currentPath.slice(root.length).replace(/^\/+/, "") : "";
        const crumbs = [{ label: state.rootName || "Files", path: root }];
        let built = root;
        for (const part of relative.split("/").filter(Boolean)) {
          built = `${built}/${part}`.replace(/\/{2,}/g, "/");
          crumbs.push({ label: part, path: built });
        }
        crumbs.forEach((crumb, index) => {
          const button = document.createElement("button");
          button.className = "crumb";
          button.type = "button";
          button.title = crumb.label;
          const label = document.createElement("span");
          label.textContent = crumb.label;
          button.appendChild(label);
          button.disabled = index === crumbs.length - 1;
          button.onclick = () => navigateTo(crumb.path);
          elements.breadcrumbs.appendChild(button);
        });
      }

      function createItemElement(item, index) {
        const row = document.createElement("div");
        row.className = "file-item";
        row.id = pathId(item.path);
        row.dataset.path = item.path;
        row.dataset.index = String(index);
        row._item = item;
        row._view = state.view;
        row.setAttribute("role", "option");
        row.setAttribute("aria-label", `${item.name}, ${item.type}`);
        row.tabIndex = item.path === state.focusedPath ? 0 : -1;
        row.draggable = false;

        const icon = document.createElement("span");
        icon.className = "file-icon";
        icon.innerHTML = itemIcon(item);
        const thumbnailImage = item.thumbnail_url && item.kind !== "photoshop" && item.kind !== "folder" ? icon.querySelector("img.thumbnail") : null;
        if (thumbnailImage) icon.classList.add("thumbnail-capable");
        if (thumbnailImage && (state.thumbnailFailures.get(thumbnailImage.dataset.thumbnailKey) || 0) > Date.now()) icon.classList.add("thumbnail-failed");
        const thumbnailEntry = thumbnailImage && state.thumbnailCache.get(thumbnailImage.dataset.thumbnailKey);
        if (thumbnailEntry && thumbnailEntry.expires > Date.now()) {
          icon.classList.add("thumbnail-cached");
          installThumbnail(thumbnailImage, thumbnailImage.dataset.thumbnailKey, thumbnailEntry.url);
        }
        const name = document.createElement("span");
        name.className = "item-name";
        name.textContent = item.name;
        name.title = item.name;

        if (state.view === "details") {
          const nameCell = document.createElement("span");
          nameCell.className = "details-name";
          nameCell.append(icon, name);
          row.append(
            nameCell,
            detailCell(item.status, "detail-status"),
            detailCell(item.modified_label || formatDate(item.modified), "detail-modified"),
            detailCell(item.type, "detail-type"),
            detailCell(item.size_label, "detail-size")
          );
        } else {
          row.append(icon, name);
          if (state.view === "list") {
            row.append(detailCell(item.modified_label || formatDate(item.modified), "item-secondary"), detailCell(item.size_label, "item-secondary"));
          }
        }

        row.addEventListener("mouseenter", event => scheduleFileTooltip(item, event));
        row.addEventListener("mousemove", moveFileTooltip);
        row.addEventListener("mouseleave", hideFileTooltip);
        row.addEventListener("mousedown", hideFileTooltip);
        row.addEventListener("click", event => {
          if (event.detail > 1) return;
          row.focus({preventScroll:true});
          if (event.ctrlKey || event.metaKey) selectByIndex(Number(row.dataset.index), { toggle: true });
          else if (event.shiftKey) selectByIndex(Number(row.dataset.index), { range: true });
          else {
            setSingleSelection(item.path, Number(row.dataset.index));
          }
        });
        row.addEventListener("dblclick", event => { event.preventDefault(); event.stopPropagation(); setSingleSelection(item.path,Number(row.dataset.index));openPreferredItem(item); });
        row.addEventListener("contextmenu", event => {
          hideFileTooltip();
          event.preventDefault();
          event.stopPropagation();
          if (!state.selection.has(item.path)) setSingleSelection(item.path, Number(row.dataset.index));
          showItemContextMenu(item, event.clientX, event.clientY);
        });
        row.addEventListener("keydown", event => handleItemKeydown(event, item, Number(row.dataset.index)));
        row.addEventListener("dragstart", event => {
          hideFileTooltip();
          event.preventDefault();
          event.stopPropagation();
        });
        return row;
      }

      function detailCell(text, className) {
        const cell = document.createElement("span");
        cell.className = `detail-cell ${className || ""}`;
        cell.textContent = text || "-";
        return cell;
      }

      function renderModifiedSortHeader() {
        const active = state.sortKey === "modified";
        elements.modifiedSortArrow.textContent = active ? (state.sortDir === "desc" ? "\u2193" : "\u2191") : "";
        elements.dateModifiedHeader.setAttribute("aria-pressed", active ? "true" : "false");
        elements.dateModifiedHeader.title = active
          ? `Date modified, ${state.sortDir === "desc" ? "newest first" : "oldest first"}`
          : "Sort by date modified";
      }

      function renderItems() {
        finishSelectionDrag(true);
        hideFileTooltip();
        const activePath = document.activeElement?.closest?.(".file-item")?.dataset.path;
        const retained = new Map(Array.from(elements.items.children).filter(row => row._view === state.view).map(row => [row.dataset.path, row]));
        state.retainedRows = retained;
        state.virtual = null;
        elements.items.style.height = "";
        elements.items.className = `items view-${state.view}`;
        elements.detailsHeader.classList.toggle("visible", state.view === "details");
        elements.detailsHeader.setAttribute("aria-hidden", state.view === "details" ? "false" : "true");
        renderModifiedSortHeader();
        elements.items.replaceChildren();
        if (state.loading && !state.items.length) {
          return;
        }
        const items = visibleItems();
        if (!items.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = state.items.length ? "No items match your search" : "This folder is empty";
          elements.items.appendChild(empty);
        } else {
          const fragment = document.createDocumentFragment();
          if (items.length > 200) {
            const probe = createItemElement(items[0], 0);
            elements.items.appendChild(probe);
            const style = getComputedStyle(elements.items);
            const columns = style.display === "grid" ? style.gridTemplateColumns.split(" ").length : 1;
            const gapX = parseFloat(style.columnGap) || 0;
            const gapY = parseFloat(style.rowGap) || 0;
            const height = probe.offsetHeight;
            const width = (elements.items.clientWidth - (columns - 1) * gapX) / columns;
            probe.remove();
            state.virtual = { items, columns, gapX, gapY, height, width, start: -1, end: -1 };
            elements.items.classList.add("virtual");
            elements.items.style.height = `${Math.ceil(items.length / columns) * (height + gapY) - gapY}px`;
            renderVirtualRows();
          } else items.forEach((item, index) => fragment.appendChild(reuseItemElement(item, index)));
          elements.items.appendChild(fragment);
        }
        updateSelectionUi();
        setupLazyThumbnails();
        state.retainedRows = null;
        if (activePath) document.getElementById(pathId(activePath))?.focus({preventScroll:true});
      }

      function reuseItemElement(item, index) {
        const old = state.retainedRows?.get(item.path);
        // Metadata objects are reused within a page/view; changing metadata rebuilds safely.
        if (old && (old._item === item || JSON.stringify(old._item) === JSON.stringify(item))) {
          old.dataset.index = String(index); old.style.cssText = "";
          return old;
        }
        return createItemElement(item, index);
      }

      function renderVirtualRows() {
        const v = state.virtual;
        if (!v) return;
        const stride = v.height + v.gapY;
        const top = Math.max(0, elements.results.scrollTop - elements.items.offsetTop);
        // Dense icon rows expose more items. One buffered row keeps nearby
        // content ready without multiplying offscreen DOM/thumbnail work.
        const overscan = ["medium", "large"].includes(state.view) ? 1 : 2;
        const start = Math.max(0, Math.floor(top / stride) - overscan) * v.columns;
        const end = Math.min(v.items.length, (Math.ceil((top + elements.results.clientHeight) / stride) + overscan) * v.columns);
        if (start === v.start && end === v.end) return;
        v.start = start; v.end = end;
        const existing = new Map(Array.from(elements.items.children, row => [Number(row.dataset.index), row]));
        for (const [index, row] of existing) if (index < start || index >= end) row.remove();
        for (let index = start; index < end; index++) {
          const row = existing.get(index) || reuseItemElement(v.items[index], index);
          row.style.top = `${Math.floor(index / v.columns) * stride}px`;
          row.style.left = `${(index % v.columns) * (v.width + v.gapX)}px`;
          row.style.width = `${v.width}px`; row.style.height = `${v.height}px`;
          row.setAttribute("aria-posinset", String(index + 1));
          row.setAttribute("aria-setsize", String(v.items.length));
          if (!row.isConnected) elements.items.appendChild(row);
        }
        updateSelectionUi();
        setupLazyThumbnails();
      }

      function revealItem(path, focus = false) {
        const index = visibleItems().findIndex(item => item.path === path);
        if (index < 0) return;
        if (state.virtual) {
          const v = state.virtual;
          elements.results.scrollTop = elements.items.offsetTop + Math.floor(index / v.columns) * (v.height + v.gapY);
          renderVirtualRows();
        }
        const row = document.getElementById(pathId(path));
        row?.scrollIntoView({ block: "nearest" });
        if (focus) row?.focus({ preventScroll: true });
      }

      function renderNavigation() {
        elements.backButton.disabled = state.back.length === 0;
        elements.forwardButton.disabled = state.forward.length === 0;
        elements.upButton.disabled = !state.rootPath || state.currentPath.toLocaleLowerCase() === state.rootPath.toLocaleLowerCase();
        elements.refreshButton.disabled = state.loading;
        renderBreadcrumbs();
        elements.searchInput.value = currentSearch();
        const folderName = state.currentPath.split("/").filter(Boolean).pop() || state.rootName || "this folder";
        elements.searchInput.placeholder = `Search ${folderName}`;
        elements.searchClear.hidden = !currentSearch();
      }

      function renderStatus() {
        elements.loadingIndicator.hidden = !(state.loading && !state.items.length);
        if (state.loading && !state.items.length) {
          elements.itemCount.textContent = "";
          elements.selectionCount.textContent = "";
          return;
        }
        const visible = visibleItems().length;
        elements.itemCount.textContent = currentSearch()
          ? `${visible} of ${state.items.length} items`
          : `${state.items.length} item${state.items.length === 1 ? "" : "s"}`;
        if (state.loadingMore) elements.itemCount.textContent += " Â· loading moreâ€¦";
        else if (state.incomplete) elements.itemCount.textContent += " Â· incomplete â€” Refresh to retry";
        const clipboardCount = state.clipboard.items.length;
        elements.selectionCount.textContent = state.selection.size
          ? `${state.selection.size} selected`
          : (clipboardCount
            ? `${clipboardCount} item${clipboardCount === 1 ? "" : "s"} ${state.clipboard.mode === "cut" ? "ready to move" : "ready to paste in Files"}`
            : "");
      }

      function selectedItems() {
        const selected = state.selection;
        return state.items.filter(item => selected.has(item.path));
      }

      function updateSelectionUi() {
        document.querySelectorAll(".file-item").forEach(row => {
          const selected = state.selection.has(row.dataset.path);
          row.classList.toggle("selected", selected);
          row.classList.toggle("focused", row.dataset.path === state.focusedPath);
          row.classList.toggle(
            "cut-pending",
            state.clipboard.mode === "cut" && state.clipboard.items.some(item => item.path === row.dataset.path)
          );
          row.setAttribute("aria-selected", selected ? "true" : "false");
          row.tabIndex = row.dataset.path === state.focusedPath ? 0 : -1;
        });
        const chosen = selectedItems();
        const allFiles = chosen.length > 0 && chosen.every(item => item.tag !== "folder");
        elements.openButton.disabled = chosen.length !== 1;
        elements.downloadButton.disabled = !allFiles;
        elements.copyButton.disabled = !allFiles || Boolean(state.originalCopyBusy);
        if (!state.originalCopyBusy && !state.copyResetTimer) setCopyLabel(chosen.length > 1 ? `Copy ${chosen.length} files` : "Copy");
        elements.renameButton.disabled = chosen.length !== 1 || chosen[0].protected;
        elements.deleteButton.disabled = !state.canDelete || !chosen.length || chosen.some(item => item.protected);
        renderStatus();
      }

      function setSingleSelection(path, index) {
        state.selection = new Set(path ? [path] : []);
        state.focusedPath = path || "";
        state.anchorIndex = Number.isInteger(index) ? index : visibleItems().findIndex(item => item.path === path);
        updateSelectionUi();
      }

      function clearSelection() {
        state.selection.clear();
        state.focusedPath = "";
        state.anchorIndex = -1;
        updateSelectionUi();
      }

      function selectByIndex(index, { toggle = false, range = false } = {}) {
        const items = visibleItems();
        const item = items[index];
        if (!item) return;
        if (range) {
          const anchor = state.anchorIndex >= 0 ? state.anchorIndex : index;
          const next = new Set();
          for (let cursor = Math.min(anchor, index); cursor <= Math.max(anchor, index); cursor += 1) next.add(items[cursor].path);
          state.selection = next;
        } else if (toggle) {
          if (state.selection.has(item.path)) state.selection.delete(item.path);
          else state.selection.add(item.path);
          state.anchorIndex = index;
        } else {
          state.selection = new Set([item.path]);
          state.anchorIndex = index;
        }
        state.focusedPath = item.path;
        updateSelectionUi();
      }

      function renderAll() {
        renderNavigation();
        renderItems();
        if (state.restorePosition) {
          const saved = state.restorePosition; state.restorePosition = null;
          state.selection = new Set(saved.selection.filter(path => state.items.some(item => item.path === path)));
          state.focusedPath = saved.focused;
          elements.results.scrollTop = saved.scroll;
          renderVirtualRows(); updateSelectionUi();
        }
        renderStatus();
        persistState();
      }

      function folderCacheKey(path) {
        return [
          String(state.cacheNamespace || "anonymous"),
          String(state.rootPath || ""),
          String(path || "").replace(/\/+$/, ""),
        ].join("|").toLocaleLowerCase();
      }

      function cachedFolder(path) {
        const entry = cachedFolderEntry(path);
        return entry ? entry.payload : null;
      }

      function cachedFolderEntry(path) {
        const key = folderCacheKey(path);
        const cached = state.folderCache.get(key);
        if (!cached || cached.expiresAt <= Date.now()) {
          if (cached) state.folderCache.delete(key);
          return null;
        }
        state.folderCache.delete(key);
        state.folderCache.set(key, cached);
        return cached;
      }

      function rememberFolder(payload, requestedPath) {
        const seconds = Math.max(1, Math.min(180, Number(payload.cached_for_seconds || 30)));
        const entry = {
          payload,
          cachedAt: Date.now(),
          expiresAt: Date.now() + seconds * 1000,
        };
        const previousNamespace = state.cacheNamespace;
        const previousRoot = state.rootPath;
        state.cacheNamespace = String(payload.cache_namespace || previousNamespace || "");
        state.rootPath = String(payload.root_path || previousRoot || "");
        for (const path of [requestedPath, payload.current_path]) {
          const key = folderCacheKey(path);
          if (!key) continue;
          state.folderCache.delete(key);
          state.folderCache.set(key, entry);
        }
        state.cacheNamespace = previousNamespace;
        state.rootPath = previousRoot;
        while (state.folderCache.size > MAX_CLIENT_FOLDER_CACHE) {
          state.folderCache.delete(state.folderCache.keys().next().value);
        }
      }

      function invalidateClientFolderCache(...paths) {
        const targets = paths.map(path => folderCacheKey(path)).filter(Boolean);
        if (!targets.length) {
          state.folderCache.clear();
          return;
        }
        for (const key of Array.from(state.folderCache.keys())) {
          if (targets.includes(key)) state.folderCache.delete(key);
        }
      }

      function requestFolder(path, refresh, page = "", relativePath = "") {
        const params = new URLSearchParams();
        if (relativePath) params.set("relative_path", relativePath);
        else if (path) params.set("path", path);
        if (refresh) params.set("refresh", "1");
        params.set("page_size", String(FOLDER_PAGE_SIZE));
        if (page) params.set("page", page);
        const requestKey = `${relativePath ? `relative:${relativePath}` : folderCacheKey(path)}|${refresh ? "refresh" : "normal"}|${page || "first"}`;
        if (!page && state.folderRequests.has(requestKey)) {
          return state.folderRequests.get(requestKey);
        }
        const controller = typeof AbortController === "function" ? new AbortController() : null;
        if (controller) state.folderControllers.set(requestKey, controller);
        const controlledRequest = apiJson(
          `/api/files-list?${params.toString()}`,
          controller ? { signal: controller.signal } : {}
        ).finally(() => {
          if (state.folderControllers.get(requestKey) === controller) {
            state.folderRequests.delete(requestKey);
            state.folderControllers.delete(requestKey);
          }
        });
        if (!page) state.folderRequests.set(requestKey, controlledRequest);
        return controlledRequest;
      }

      function abortStaleFolderRequests(exceptPath = null) {
        const keepPrefix = exceptPath == null ? "" : `${folderCacheKey(exceptPath)}|`;
        for (const [key, controller] of Array.from(state.folderControllers.entries())) {
          if (keepPrefix && key.startsWith(keepPrefix)) continue;
          if (controller && typeof controller.abort === "function") controller.abort();
          state.folderControllers.delete(key);
          state.folderRequests.delete(key);
        }
      }

      function applyFolderPayload(payload) {
        if (state.cacheNamespace && payload.cache_namespace && state.cacheNamespace !== String(payload.cache_namespace)) {
          stopThumbnailLoading();
          state.thumbnailCache.forEach(value => URL.revokeObjectURL(value.url));
          state.thumbnailCache.clear(); state.thumbnailFailures.clear(); state.folderCache.clear();
          closePreview(); elements.previewFrame?.remove(); elements.previewFrame = null;
          state.imageViewerWindow = null; state.imageViewerReady = false;
        }
        state.rootPath = String(payload.root_path || "");
        state.rootName = String(payload.root_name || "Files");
        state.cacheNamespace = String(payload.cache_namespace || state.cacheNamespace || "");
        state.currentPath = String(payload.current_path || state.rootPath);
        state.timeZone = String(payload.timezone || "UTC");
        state.items = Array.from(payload.items || []);
        if (state.pinnedItem && state.pinnedFolder === state.currentPath && payload.has_more && !state.items.some(item => item.id === state.pinnedItem.id)) state.items.push(state.pinnedItem);
        const availablePaths = new Set(state.items.map(item => item.path));
        state.selection = new Set(Array.from(state.selection).filter(path => availablePaths.has(path)));
        state.canDelete = Boolean(payload.can_delete);
        state.searchByPath[state.currentPath] = state.searchByPath[state.currentPath] || "";
      }


      function parentPath(path) {
        const clean = String(path || "").replace(/\/+$/, "");
        if (!clean || clean.toLocaleLowerCase() === state.rootPath.toLocaleLowerCase()) return state.rootPath;
        const parent = clean.slice(0, clean.lastIndexOf("/"));
        return parent.toLocaleLowerCase().startsWith(state.rootPath.toLocaleLowerCase()) ? parent : state.rootPath;
      }

      async function loadFolder(path, { refresh = false, preserveScroll = false, relativePath = "" } = {}) {
        state.openStamp = {path:"",time:0};
        const token = ++state.navigationToken;
        state.incomplete = false;
        if (state.currentPath && state.items.length) {
          state.folderPositions.set(state.currentPath, { scroll:elements.results.scrollTop, selection:Array.from(state.selection), focused:state.focusedPath });
          while (state.folderPositions.size > 24) state.folderPositions.delete(state.folderPositions.keys().next().value);
        }
        const position = state.folderPositions.get(path);
        const oldScroll = preserveScroll ? elements.results.scrollTop : (position?.scroll || 0);
        preserveScroll = preserveScroll || Boolean(position);
        state.restorePosition = position || null;
        if (path !== state.pinnedFolder) state.pinnedItem = null;
        abortStaleFolderRequests(path);
        const cachedEntry = refresh ? null : cachedFolderEntry(path);
        if (cachedEntry) {
          const cached = cachedEntry.payload;
          const needsMorePages = Boolean(cached.has_more && cached.next_page);
          const shouldRevalidate = !needsMorePages && Date.now() - cachedEntry.cachedAt > CLIENT_FOLDER_REVALIDATE_SECONDS * 1000;
          closeMenus();
          clearSelection();
          stopThumbnailLoading();
          applyFolderPayload(cached);
          state.loading = false;
          state.loadingMore = needsMorePages || shouldRevalidate;
          renderAll();
          elements.results.scrollTop = preserveScroll ? oldScroll : 0;
          if (needsMorePages) {
            await continueFolderPages(path, cached, token, oldScroll, preserveScroll);
            return true;
          }
          if (!shouldRevalidate) return true;
          requestFolder(path, true)
            .then(async payload => {
              if (token !== state.navigationToken) return;
              rememberFolder(payload, path);
              applyFolderPayload(payload);
              state.loading = false;
              state.loadingMore = Boolean(payload.has_more && payload.next_page);
              renderAll();
              await continueFolderPages(path, payload, token, oldScroll, preserveScroll);
            })
            .catch(() => {
              if (token !== state.navigationToken) return;
              state.loadingMore = false; state.incomplete = true;
              showToast("Cached folder could not be refreshed. Refresh to retry.", {kind:"error",duration:6000});
              renderStatus();
            });
          return true;
        }
        state.loading = true;
        state.loadingMore = false;
        if (path !== state.currentPath || relativePath) { state.currentPath = path; state.items = []; }
        closeMenus();
        clearSelection();
        stopThumbnailLoading();
        renderItems();
        renderNavigation();
        renderStatus();
        try {
          const payload = await requestFolder(path, refresh, "", relativePath);
          if (token !== state.navigationToken) return false;
          const resolvedPath = String(payload.current_path || path || "");
          rememberFolder(payload, resolvedPath);
          applyFolderPayload(payload);
          state.loading = false;
          state.loadingMore = Boolean(payload.has_more && payload.next_page);
          renderAll();
          elements.results.scrollTop = preserveScroll ? oldScroll : 0;
          await continueFolderPages(resolvedPath, payload, token, oldScroll, preserveScroll);
          return true;
        } catch (error) {
          if (token !== state.navigationToken) return false;
          state.loading = false;
          state.loadingMore = false;
          state.items = [];
          renderAll();
          const message = error.status === 403
            ? "Files access expired. Sign in again in Sports Cave OS, then reopen Files."
            : (error.message || "This folder could not be loaded right now.");
          showToast(message, { kind: "error", duration: 6000 });
          return false;
        }
      }

      async function continueFolderPages(path, firstPayload, token, oldScroll, preserveScroll) {
        let payload = firstPayload;
        while (payload && payload.has_more && payload.next_page) {
          try {
            payload = await requestFolder(path, false, payload.next_page);
          } catch (error) {
            if (token === state.navigationToken) {
              state.loadingMore = false;
              state.incomplete = true;
              showToast("Folder listing is incomplete. Refresh to retry.", {kind:"error",duration:6000});
              renderStatus();
            }
            return;
          }
          if (token !== state.navigationToken) return;
          rememberFolder(payload, path);
          applyFolderPayload(payload);
          state.loading = false;
          state.loadingMore = Boolean(payload.has_more && payload.next_page);
          renderAll();
          if (preserveScroll) elements.results.scrollTop = oldScroll;
        }
        if (token === state.navigationToken) {
          state.loadingMore = false;
          renderStatus();
        }
      }

      async function navigateTo(path, { remember = true, refresh = false, preserveScroll = false } = {}) {
        const target = String(path || state.rootPath || "");
        if (!refresh && target && target === state.currentPath) return true;
        const previous = state.currentPath;
        if (remember && previous && previous !== target) {
          state.back.push(previous);
          state.back = state.back.slice(-30);
          state.forward = [];
        }
        const navigation = state.navigationToken + 1;
        const loaded = await loadFolder(target, { refresh, preserveScroll });
        if (navigation === state.navigationToken && !loaded && remember && previous && state.back[state.back.length - 1] === previous) state.back.pop();
        return loaded;
      }

      async function navigateBack() {
        if (!state.back.length) return;
        const destination = state.back.pop();
        if (state.currentPath) state.forward.push(state.currentPath);
        const navigation = state.navigationToken + 1;
        if (!await loadFolder(destination) && navigation === state.navigationToken) {
          state.forward.pop();
          state.back.push(destination);
        }
      }

      async function navigateForward() {
        if (!state.forward.length) return;
        const destination = state.forward.pop();
        if (state.currentPath) state.back.push(state.currentPath);
        const navigation = state.navigationToken + 1;
        if (!await loadFolder(destination) && navigation === state.navigationToken) {
          state.back.pop();
          state.forward.push(destination);
        }
      }

      function relativeFolderPath() {
        const root = String(state.rootPath || "");
        const current = String(state.currentPath || "");
        return root && current.toLocaleLowerCase().startsWith(root.toLocaleLowerCase())
          ? current.slice(root.length).replace(/^\/+/, "")
          : "";
      }

      function viewerThumbnail(path) {
        const item = state.items.find(item => item.desktop_relative_path === path);
        const cached = item && state.thumbnailCache.get(item.thumbnail_key || item.thumbnail_url);
        return cached && cached.expires > Date.now() ? cached.url : "";
      }

      function viewerNavigation() {
        return visibleItems().filter(item => item.kind === "image" || item.extension === "psd")
          .map(item => ({path:item.desktop_relative_path, name:item.name, revision:item.revision || ""}));
      }

      function clearImageViewerDelivery(requestId = "") {
        if (
          requestId
          && state.imageViewerPending
          && state.imageViewerPending.requestId !== requestId
        ) {
          return;
        }
        window.clearTimeout(state.imageViewerRetryTimer);
        state.imageViewerRetryTimer = 0;
        state.imageViewerPending = null;
      }

      function deliverPendingImageViewerRequest() {
        const pending = state.imageViewerPending;
        const viewer = state.imageViewerWindow;
        if (!pending || !viewer || viewer.closed || !state.imageViewerReady) return;
        try {
          viewer.postMessage({
            type: "sports-cave-image-viewer-open",
            version: 1,
            requestId: pending.requestId,
            path: pending.path,
            folder: pending.folder,
            name: pending.name,
            images: viewerNavigation(),
            revision: pending.revision,
            thumbnail: viewerThumbnail(pending.path),
          }, location.origin);
        } catch (_) {
          state.imageViewerReady = false;
          return;
        }
        pending.attempts += 1;
        window.clearTimeout(state.imageViewerRetryTimer);
        if (pending.attempts < 8) {
          state.imageViewerRetryTimer = window.setTimeout(
            deliverPendingImageViewerRequest,
            300
          );
        } else {
          clearImageViewerDelivery(pending.requestId);
          showToast("The image viewer did not accept the selected image.", {
            kind: "error",
            duration: 0,
            actionLabel: "Close preview",
            action: closePreview,
          });
        }
      }

      function queueImageViewerRequest(viewerRequest) {
        window.clearTimeout(state.imageViewerRetryTimer);
        state.imageViewerRetryTimer = 0;
        state.imageViewerPending = {
          ...viewerRequest,
          requestId: dragRequestId(),
          attempts: 0,
        };
        deliverPendingImageViewerRequest();
      }

      function openImageViewer(item) {
        const viewerRequest = {
          path: String(item.desktop_relative_path || ""),
          folder: relativeFolderPath(), name: String(item.name || "File"),
          revision: String(item.rev || item.revision || ""),
        };
        state.previewOpener = document.activeElement;
        elements.previewTitle.textContent = viewerRequest.name;
        elements.previewPanel.hidden = false;
        for (const child of document.body.children) {
          if (child !== elements.previewPanel && child.tagName !== "SCRIPT") child.inert = true;
        }
        if (!elements.previewFrame) {
          elements.previewFrame = document.createElement("iframe");
          elements.previewFrame.id = "previewFrame"; elements.previewFrame.title = "File preview";
          elements.previewFrame.allow = "clipboard-write";
          elements.previewFrame.src = "/files-image-viewer?" + new URLSearchParams({
            embedded:"1", path:viewerRequest.path, folder:viewerRequest.folder,
            name:viewerRequest.name, rev:viewerRequest.revision,
          });
          elements.previewMount.appendChild(elements.previewFrame);
        }
        state.imageViewerWindow = elements.previewFrame.contentWindow;
        queueImageViewerRequest(viewerRequest);
        elements.previewClose.focus();
      }

      function closePreview() {
        if (elements.previewPanel.hidden) return;
        clearImageViewerDelivery();
        state.imageViewerWindow?.postMessage({type:"sports-cave-image-viewer-suspend", version:1}, location.origin);
        elements.previewPanel.hidden = true;
        for (const child of document.body.children) child.inert = false;
        state.openStamp = {path:"",time:0};
        if (state.previewOpener?.isConnected) state.previewOpener.focus();
        else revealItem(state.focusedPath, true);
      }

      function originalDownloadUrl(item) {
        return savedEditionId === item.id
          ? '/api/auto-editions/file?allocation_id='+encodeURIComponent(query.get('edition_allocation'))+'&job_id='+encodeURIComponent(query.get('edition_job'))
          : `/api/files-download?path=${encodeURIComponent(item.path)}`;
      }

      function setCopyLabel(label) {
        elements.copyButton.querySelector(".command-label").textContent = label;
        elements.copyButton.setAttribute("aria-label", label);
        elements.copyButton.title = label;
      }

      async function copyOriginalFiles(items = selectedItems()) {
        if (state.originalCopyBusy) return;
        const files = items.filter(item => item.tag !== "folder");
        if (!files.length || files.length !== items.length) return;
        const snapshot = FilesOriginal.snapshot(files.map(item => ({...item, url:originalDownloadUrl(item)})));
        clearTimeout(state.copyResetTimer); state.copyResetTimer = 0;
        state.originalCopyBusy = true;
        setCopyLabel("Copying…"); updateSelectionUi();
        try {
          await FilesOriginal.copy(snapshot);
          setCopyLabel(`Copied ${snapshot.length} files`);
        } catch (error) {
          setCopyLabel("Copy unavailable");
          showToast(error.message || "File copy failed. Use Download Original.", {
            kind:"error", duration:0, actionLabel:"Download Original",
            action:() => startDownload(snapshot),
          });
        } finally {
          state.originalCopyBusy = false;
          state.copyResetTimer = setTimeout(() => {
            state.copyResetTimer = 0; updateSelectionUi();
          }, 2000);
          updateSelectionUi();
        }
      }

      function openItem(item) {
        if (!item) return;
        const now = Date.now();
        if (state.openStamp.path === item.path && now - state.openStamp.time < 650) return;
        state.openStamp = { path: item.path, time: now };
        closeMenus();
        if (item.kind === "folder") {
          navigateTo(item.path);
        } else {
          openImageViewer(item);
        }
      }

      function startDownload(items = selectedItems()) {
        const files = items.filter(item => item.tag !== "folder");
        if (!files.length || files.length !== items.length) {
          showToast("Select one or more files. Folder download is not available.", { kind: "error", duration: 4500 });
          return;
        }
        const identity = files.map(item => item.id || item.path).sort().join("|");
        if (state.downloadStamp?.identity === identity && Date.now() - state.downloadStamp.time < 650) return;
        state.downloadStamp = {identity, time:Date.now()};
        showToast(files.length === 1 ? `Downloading ${files[0].name}...` : `Starting ${files.length} downloads. Your browser may ask to allow multiple downloads.`, { duration: 5000 });
        files.forEach((item, index) => {
          const downloadUrl = item.url || originalDownloadUrl(item);
          window.setTimeout(() => {
            const frame = document.createElement("iframe");
            frame.hidden = true;
            frame.src = downloadUrl;
            document.body.appendChild(frame);
            window.setTimeout(() => frame.remove(), 120000);
          }, index * 350);
        });
      }

      function copyText(value) {
        const text = String(value || "");
        const fallback = () => {
          const input = document.createElement("textarea");
          input.value = text;
          input.style.position = "fixed";
          input.style.opacity = "0";
          document.body.appendChild(input);
          input.select();
          document.execCommand("copy");
          input.remove();
        };
        const operation = navigator.clipboard && window.isSecureContext ? navigator.clipboard.writeText(text) : Promise.resolve(fallback());
        operation.then(() => showToast("Path copied", { kind: "success" })).catch(() => {
          fallback();
          showToast("Path copied", { kind: "success" });
        });
      }

      function displayPath(item) {
        return [state.rootName, String(item.desktop_relative_path || "").replaceAll("/", "\\")].filter(Boolean).join("\\");
      }

      function closeMenus() {
        document.querySelectorAll(".menu.open").forEach(menu => menu.classList.remove("open"));
        document.querySelectorAll(".submenu").forEach(menu => menu.remove());
        elements.menu.replaceChildren();
      }

      function menuDivider() { return { separator: true }; }

      function fillMenu(menu, definitions) {
        menu.replaceChildren();
        definitions.forEach(definition => {
          if (definition.separator) {
            const divider = document.createElement("div");
            divider.className = "menu-separator";
            menu.appendChild(divider);
            return;
          }
          if (definition.heading) {
            const label = document.createElement("div");
            label.className = "menu-label";
            label.textContent = definition.heading;
            menu.appendChild(label);
            return;
          }
          const button = document.createElement("button");
          button.className = "menu-button";
          button.type = "button";
          button.disabled = Boolean(definition.disabled);
          const check = document.createElement("span");
          check.className = "check";
          check.textContent = definition.checked ? "\u2713" : "";
          const icon = document.createElement("span");
          icon.className = "menu-icon";
          icon.textContent = definition.icon || "";
          const label = document.createElement("span");
          label.textContent = definition.label;
          button.append(check, icon, label);
          if (definition.submenu) {
            const arrow = document.createElement("span");
            arrow.className = "arrow";
            arrow.textContent = ">";
            button.appendChild(arrow);
            const showChild = () => showSubmenu(button, definition.submenu);
            button.addEventListener("mouseenter", showChild);
            button.addEventListener("click", event => { event.stopPropagation(); showChild(); });
          } else {
            button.addEventListener("click", event => {
              event.preventDefault();
              event.stopPropagation();
              closeMenus();
              if (definition.action) definition.action();
            });
          }
          menu.appendChild(button);
        });
      }

      function positionMenu(menu, x, y) {
        menu.style.left = `${Math.max(4, x)}px`;
        menu.style.top = `${Math.max(4, y)}px`;
        menu.classList.add("open");
        const bounds = menu.getBoundingClientRect();
        menu.style.left = `${Math.max(4, Math.min(x, window.innerWidth - bounds.width - 6))}px`;
        menu.style.top = `${Math.max(4, Math.min(y, window.innerHeight - bounds.height - 6))}px`;
      }

      function showMenu(definitions, x, y) {
        closeMenus();
        fillMenu(elements.menu, definitions);
        positionMenu(elements.menu, x, y);
        const first = elements.menu.querySelector("button:not(:disabled)");
        if (first) first.focus({ preventScroll: true });
      }

      function showSubmenu(parent, definitions) {
        document.querySelectorAll(".submenu").forEach(menu => menu.remove());
        const child = document.createElement("div");
        child.className = "menu submenu";
        document.body.appendChild(child);
        fillMenu(child, definitions);
        child.classList.add("open");
        const parentBounds = parent.getBoundingClientRect();
        const bounds = child.getBoundingClientRect();
        const x = parentBounds.right + bounds.width <= window.innerWidth - 5 ? parentBounds.right - 2 : parentBounds.left - bounds.width + 2;
        const y = Math.min(parentBounds.top, window.innerHeight - bounds.height - 6);
        child.style.left = `${Math.max(4, x)}px`;
        child.style.top = `${Math.max(4, y)}px`;
      }

      function sortMenuDefinitions() {
        return [
          ...Object.entries(SORT_LABELS)
            .filter(([key]) => key !== "modified")
            .map(([key, label]) => ({ label, checked: state.sortKey === key, action: () => setSort(key, state.sortDir) })),
          { label: "Date modified \u2014 newest first", checked: state.sortKey === "modified" && state.sortDir === "desc", action: () => setSort("modified", "desc") },
          { label: "Date modified \u2014 oldest first", checked: state.sortKey === "modified" && state.sortDir === "asc", action: () => setSort("modified", "asc") },
          menuDivider(),
          { label: "Ascending", checked: state.sortDir === "asc", action: () => setSort(state.sortKey, "asc") },
          { label: "Descending", checked: state.sortDir === "desc", action: () => setSort(state.sortKey, "desc") },
        ];
      }

      function viewMenuDefinitions() {
        return VIEW_MODES.map(view => ({ label: VIEW_LABELS[view], checked: state.view === view, action: () => setView(view) }));
      }

      function uploadMenuDefinitions() {
        return [
          { label: "Upload files", action: () => elements.filesInput.click() },
          { label: "Upload folder", action: () => elements.folderInput.click() },
          menuDivider(),
          { heading: "If a name already exists" },
          { label: "Cancel", checked: state.uploadConflict === "cancel", action: () => setUploadConflict("cancel") },
          { label: "Keep both", checked: state.uploadConflict === "keep_both", action: () => setUploadConflict("keep_both") },
          { label: "Replace", checked: state.uploadConflict === "replace", action: () => setUploadConflict("replace") },
        ];
      }

      function setSort(key, direction) {
        state.sortKey = key;
        state.sortDir = direction;
        state.anchorIndex = -1;
        renderItems();
        renderStatus();
        persistState();
        const directionLabel = key === "modified"
          ? (direction === "desc" ? "newest first" : "oldest first")
          : (direction === "asc" ? "ascending" : "descending");
        showToast(`Sorted by ${SORT_LABELS[key]}, ${directionLabel}`, { duration: 1800 });
      }

      function setView(view) {
        if (!VIEW_MODES.includes(view)) return;
        state.view = view;
        renderItems();
        persistState();
      }

      function setUploadConflict(conflict) {
        state.uploadConflict = conflict;
        persistState();
        showToast(`Upload conflict: ${conflict.replace("_", " ")}`, { duration: 1800 });
      }

      function clipboardPayload(items) {
        return items.map(item => ({
          path: String(item.path || ""),
          relative_path: String(item.desktop_relative_path || ""),
          name: String(item.name || ""),
          tag: String(item.tag || "file"),
          kind: String(item.kind || "file"),
          size: Number(item.size || 0),
          extension: String(item.extension || ""),
          id: String(item.id || ""),
          revision: String(item.revision || ""),
        })).filter(item => item.relative_path);
      }

      function setFilesClipboard(mode, items = selectedItems()) {
        const chosen = clipboardPayload(items);
        if (!chosen.length || !["copy", "cut"].includes(mode)) return;
        state.clipboard = { mode, items: chosen, createdAt: Date.now() };
        persistClipboard();
        updateSelectionUi();
        const count = chosen.length;
        showToast(mode === "cut"
          ? `${count} item${count === 1 ? "" : "s"} ready to move inside Sports Cave Files`
          : `${count} item${count === 1 ? "" : "s"} copied inside Sports Cave Files`,
          {kind:"success", duration:2200});
      }

      function clearFilesClipboard() {
        state.clipboard = { mode: "", items: [] };
        persistClipboard();
        updateSelectionUi();
      }

      function canPasteHere() {
        if (state.clipboardBusy || !state.clipboard.items.length || !state.currentPath) return false;
        const destination = relativeFolderPath().toLocaleLowerCase();
        if (state.clipboard.items.some(item => {
          const source = item.relative_path.toLocaleLowerCase();
          return item.tag === "folder" && (destination === source || destination.startsWith(`${source}/`));
        })) return false;
        if (state.clipboard.mode === "cut") {
          const movable = state.clipboard.items.some(item => {
            const sourceParent = item.relative_path.includes("/")
              ? item.relative_path.slice(0, item.relative_path.lastIndexOf("/"))
              : "";
            return sourceParent.toLocaleLowerCase() !== destination;
          });
          if (!movable) return false;
        }
        return true;
      }

      async function pasteFiles(conflict = "prompt") {
        if (!canPasteHere()) return;
        const operation = state.clipboard.mode === "cut" ? "move" : "copy";
        state.clipboardBusy = true;
        closeMenus();
        showToast("Pasting items...", { duration: 1800 });
        try {
          const payload = await apiJson("/api/files-paste", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              paths: state.clipboard.items.map(item => item.relative_path),
              destination: relativeFolderPath(),
              operation,
              conflict,
            }),
          });
          const successful = Array.from(payload.successful || []);
          const failed = Array.from(payload.failed || []);
          const skipped = Array.from(payload.skipped || []);
          if (operation === "move" && successful.length) {
            const movedPaths = new Set(successful.map(item => String(item.source_path || "").toLocaleLowerCase()));
            state.clipboard.items = state.clipboard.items.filter(
              item => !movedPaths.has(String(item.path || "").toLocaleLowerCase())
            );
            if (state.clipboard.items.length) {
              persistClipboard();
              updateSelectionUi();
            } else {
              clearFilesClipboard();
            }
          }
          const folderName = state.currentPath.split("/").filter(Boolean).pop() || state.rootName;
          if (failed.length) {
            showToast(`Pasted ${successful.length}; ${failed.length} failed. Failed items remain in the clipboard.`, { kind: "error", duration: 6000 });
          } else if (skipped.length && successful.length) {
            showToast(`Pasted ${successful.length}; ${skipped.length} skipped. Skipped items remain in the clipboard.`, { duration: 4500 });
          } else if (skipped.length && !successful.length) {
            showToast("No items were pasted.", { duration: 3000 });
          } else {
            showToast(`${operation === "move" ? "Moved" : "Copied"} to ${folderName}`, { kind: "success", duration: 2400 });
          }
          invalidateClientFolderCache(state.currentPath);
          await navigateTo(state.currentPath, { remember: false, refresh: true, preserveScroll: true });
        } catch (error) {
          if (error.code === "paste_conflict" && error.conflicts.length) showPasteConflictDialog(error.conflicts);
          else showToast(error.message, { kind: "error", duration: 6000 });
        } finally {
          state.clipboardBusy = false;
          updateSelectionUi();
        }

      function stopThumbnailLoading() {
        state.thumbnailGeneration += 1;
        if (state.thumbnailObserver) state.thumbnailObserver.disconnect();
        state.thumbnailObserver = null;
        state.thumbnailQueue = [];
        state.thumbnailControllers.forEach(controller => controller.abort());
        state.thumbnailControllers.clear();
        state.thumbnailInFlight.clear();
        // Aborted requests still occupy a slot until their finally block runs.
      }

      function rememberThumbnail(key, objectUrl) {
        if (state.thumbnailCache.has(key)) URL.revokeObjectURL(state.thumbnailCache.get(key).url);
        state.thumbnailCache.delete(key);
        state.thumbnailCache.set(key, {url:objectUrl, expires:Date.now()+30000});
        while (state.thumbnailCache.size > MAX_CLIENT_THUMBNAILS) {
          const oldest = state.thumbnailCache.keys().next().value;
          URL.revokeObjectURL(state.thumbnailCache.get(oldest).url);
          state.thumbnailCache.delete(oldest);
        }
      }

      function installThumbnail(image, key, objectUrl) {
        if (
          image
          && image.dataset.thumbnailKey === key
        ) {
          image.style.visibility = "";
          image.onload = () => {
            if (image.dataset.thumbnailKey !== key || image.getAttribute("src") !== objectUrl) return;
            image.parentElement?.classList.remove("thumbnail-failed");
            state.thumbnailFailures.delete(key);
            image.parentElement?.classList.add("has-thumbnail");
          };
          image.onerror = () => {
            if (image.getAttribute("src") !== objectUrl) return;
            image.removeAttribute("src"); image.parentElement?.classList.remove("has-thumbnail");
            thumbnailUnavailable(image, key);
          };
          image.src = objectUrl;
          if (image.complete && image.naturalWidth) image.onload();
        }
      }

      function thumbnailUnavailable(image, key) {
        image.parentElement?.classList.add("thumbnail-failed");
        state.thumbnailFailures.set(key, Date.now()+10000);
        while(state.thumbnailFailures.size>256) state.thumbnailFailures.delete(state.thumbnailFailures.keys().next().value);
      }

      async function fetchThumbnail(task) {
        const controller = new AbortController();
        state.thumbnailControllers.add(controller);
        state.thumbnailTasks.set(controller, task);
        task.image.dataset.thumbnailPending = "1";
        try {
          let response;
          for (let attempt=0; attempt<15; attempt++) {
            response = await fetch(task.url, { credentials: "same-origin", signal: controller.signal });
            if (response.status !== 202) break;
            await response.body?.cancel();
            await new Promise((resolve,reject)=>{
              const abort=()=>{clearTimeout(timer);reject(new DOMException("Aborted","AbortError"));};
              const timer=setTimeout(()=>{controller.signal.removeEventListener("abort",abort);resolve();},1000);
              controller.signal.addEventListener("abort",abort,{once:true});
              if(controller.signal.aborted)abort();
            });
          }
          if(response.status===202){ thumbnailUnavailable(task.image,task.key); return; }
          if (!response.ok || task.generation !== state.thumbnailGeneration) {
            if (!response.ok && task.image.isConnected) thumbnailUnavailable(task.image,task.key);
            return;
          }
          const blob = await response.blob();
          if (task.generation !== state.thumbnailGeneration) return;
          if (!blob.type.startsWith("image/") || blob.size > 4*1024*1024) { thumbnailUnavailable(task.image,task.key); return; }
          const objectUrl = URL.createObjectURL(blob);
          rememberThumbnail(task.key, objectUrl);
          installThumbnail(task.image, task.key, objectUrl);
        } catch (error) {
          if (error.name !== "AbortError") thumbnailUnavailable(task.image,task.key);
        } finally {
          state.thumbnailControllers.delete(controller);
          state.thumbnailTasks.delete(controller);
          delete task.image.dataset.thumbnailPending;
          if (task.generation === state.thumbnailGeneration) state.thumbnailInFlight.delete(task.key);
          state.thumbnailActive = Math.max(0, state.thumbnailActive - 1);
          drainThumbnailQueue();
        }
      }

      function drainThumbnailQueue() {
        while (state.thumbnailActive < MAX_THUMBNAIL_CONCURRENT && state.thumbnailQueue.length) {
          const task = state.thumbnailQueue.shift();
          if (!task || !task.image.isConnected || task.generation !== state.thumbnailGeneration || state.thumbnailInFlight.has(task.key)) continue;
          state.thumbnailInFlight.add(task.key);
          state.thumbnailActive += 1;
          fetchThumbnail(task);
        }
      }

      function setupLazyThumbnails() {
        state.thumbnailObserver?.disconnect();
        state.thumbnailQueue = state.thumbnailQueue.filter(task => task.image.isConnected);
        state.thumbnailTasks.forEach((task, controller) => { if (!task.image.isConnected) controller.abort(); });
        const generation = state.thumbnailGeneration;
        const images = Array.from(elements.items.querySelectorAll("img[data-thumbnail-url]"));
        if (!images.length) return;
        state.thumbnailObserver = new IntersectionObserver(records => {
          records.forEach(record => {
            const image = record.target;
            const key = image.dataset.thumbnailKey;
            if (!record.isIntersecting) {
              state.thumbnailQueue = state.thumbnailQueue.filter(task => task.image !== image);
              state.thumbnailTasks.forEach((task, controller) => { if (task.image === image) controller.abort(); });
              return;
            }
            if (image.getAttribute("src") || image.dataset.thumbnailPending) return;
            if ((state.thumbnailFailures.get(key)||0)>Date.now()) {image.parentElement?.classList.add("thumbnail-failed");return;}
            image.parentElement?.classList.remove("thumbnail-failed");
            const cached = state.thumbnailCache.get(key);
            if (cached && cached.expires > Date.now()) {
              installThumbnail(image,key,cached.url); return;
            }
            if (cached) { URL.revokeObjectURL(cached.url); state.thumbnailCache.delete(key); }
            if (!state.thumbnailQueue.some(task => task.image === image)) state.thumbnailQueue.push({ image, key, url: image.dataset.thumbnailUrl, generation });
          });
          drainThumbnailQueue();
        }, { root: elements.results, rootMargin: "120px 0px", threshold: 0.01 });
        images.forEach(image => state.thumbnailObserver.observe(image));
      }

      function sizeLabel(bytes) {

        const units = ["B", "KB", "MB", "GB", "TB"];
        const index = Math.min(units.length - 1, Math.floor(Math.log(value) / Math.log(1024)));
        const amount = value / Math.pow(1024, index);
        return `${amount < 10 && index ? amount.toFixed(1) : Math.round(amount)} ${units[index]}`;
      }

      let verifiedColourWorkflow=null;
      const workflowLabel=document.createElement('label');workflowLabel.style.cssText='font:12px system-ui;margin:6px';
      workflowLabel.textContent='Verified PSD workflow (administrator): ';
      const workflowInput=document.createElement('input');workflowInput.type='file';workflowInput.accept='.json';workflowInput.title='Independent creation/export manifest, up to 64 KB. Leave empty for ordinary uploads.';

      async function startUpload(row) {
        const payload = await apiJson("/api/files-upload/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            current_path: row.destinationPath,

            size: row.size,

          }),
        });
        row.uploadId = payload.upload_id;
        row.uploadSecret = payload.upload_secret;
        row.uploaded = Number(payload.offset || 0);
      }

      function uploadStatus(row) {
        return apiJson(`/api/files-upload/status?upload_id=${encodeURIComponent(row.uploadId)}`, {
          headers: { "X-Upload-Secret": row.uploadSecret },
        });
      }

      async function uploadChunk(row, blob, final) {
        for (let attempt = 0; attempt < 3; attempt += 1) {
          try {
            return await apiJson("/api/files-upload/chunk", {
              method: "POST",
              headers: {
                "Content-Type": "application/octet-stream",
                "X-Upload-Id": row.uploadId,
                "X-Upload-Secret": row.uploadSecret,
                "X-Upload-Offset": String(row.uploaded),
                "X-Upload-Final": final ? "true" : "false",
              },
              body: blob,
            });
          } catch (error) {
            if (error.code === "offset_mismatch") {
              const status = await uploadStatus(row);
              row.uploaded = Number(status.offset || row.uploaded);
              return status;
            }
            if (attempt === 2) throw error;
            await new Promise(resolve => window.setTimeout(resolve, 500 * (attempt + 1)));
          }
        }
      }

      async function runUpload(row) {
        row.status = "uploading";
        row.error = "";
        row.errorCode = "";
        renderUploads();
        try {
          if (!row.uploadId) await startUpload(row);
          else {
            const status = await uploadStatus(row);
            row.uploaded = Number(status.offset || 0);
            if (status.state === "completed") return completeUpload(row);
          }
          while (row.uploaded < row.size || (row.size === 0 && row.uploaded === 0)) {
            const end = Math.min(row.size, row.uploaded + CHUNK_BYTES);
            const final = end >= row.size;
            const payload = await uploadChunk(row, row.file.slice(row.uploaded, end), final);
            row.uploaded = Number(payload.offset || end);
            renderUploads();
            if (payload.state === "completed" || final) return completeUpload(row);
          }

      async function walkEntry(entry, prefix) {
        if (entry.isFile) {

          return [{ file, relativePath: `${prefix}${file.name}` }];

        if (!entry.isDirectory) return [];
        const reader = entry.createReader();
        const children = [];
        while (true) {
          const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
          if (!batch.length) break;
          children.push(...batch);

        return (await Promise.all(children.map(child => walkEntry(child, `${prefix}${entry.name}/`)))).flat();
