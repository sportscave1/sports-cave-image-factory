<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open file — Sports Cave OS</title><style>body{font:15px system-ui;margin:0;background:#f6f8fb;color:#17233c}main{padding:24px;max-width:500px;margin:auto}h1{font-size:22px}button,a{display:inline-block;padding:10px 15px;margin:8px 5px 0 0;border-radius:8px;border:1px solid #ced8e8;background:white;color:#17233c}button{cursor:pointer}p{line-height:1.5;overflow-wrap:anywhere}</style><main><h1>Open file</h1><p id="status" role="status">Connecting to Sports Cave Desktop…</p><button id="cancel">Cancel</button><a href="/" target="_blank" rel="noreferrer">Sign in to Sports Cave Desktop</a><button onclick="window.close()">Close</button></main><script>
const status=document.querySelector('#status'),bridge=window.chrome?.webview,code=location.hash.slice(1);history.replaceState(null,'',location.pathname);
let started=false,requestId='',cancelled=false,readyTimer;
const message=t=>status.textContent=t;
const api=async(method)=>{const r=await fetch('/api/files-native-launch/claim',{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Your session may have expired. Sign in with the same account, then retry from Files.');return d;};
document.querySelector('#cancel').onclick=async()=>{cancelled=true;clearTimeout(readyTimer);if(requestId&&bridge)bridge.postMessage({action:'cancel',request_id:requestId});try{await api('DELETE')}catch(_){}message('Opening cancelled. Return to Files to try again.');};
if(!bridge||! /^[A-Za-z0-9_-]{43}$/.test(code))message('Use the refreshed Windows helper (version 11 or later). Return to Files and choose Open desktop helper.');
else{bridge.addEventListener('message',async e=>{const m=e.data;if(m?.type!=='sports-cave-desktop'||cancelled)return;if(m.action==='capabilities'){clearTimeout(readyTimer);if(started)return;if(m.version<11||!m.capabilities?.includes('verifiedOpen')){message('Refresh the Windows helper to version 11 or later, then retry from Files.');return;}started=true;try{const d=await api('POST');if(cancelled)return;requestId=crypto.randomUUID();message('Verifying the exact file revision. Dropbox may hydrate a synced file; otherwise the verified cache is used.');bridge.postMessage({action:d.action,request_id:requestId,transfer:d.transfer});}catch(e){message(e.message);}}else if(m.request_id===requestId){if(m.action==='progress'){message('Preparing file… '+Math.round(100*m.complete/Math.max(1,m.total))+'%');}else if(m.ok){message('Windows received the file-opening request. If no compatible app is installed, use Open With from Files.');document.querySelector('#cancel').disabled=true;}else message(m.message||'Windows could not open this file. Check your network, file permissions and installed apps, then retry.');}});bridge.postMessage({action:'hello',request_id:crypto.randomUUID()});readyTimer=setTimeout(()=>message('Desktop helper did not respond. Refresh it to version 11 or later, then retry from Files.'),6000);}
</script></html>
