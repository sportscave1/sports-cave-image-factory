</style><script src="grid-core.js"></script></head><body><div id="root"></div><script>
'use strict';let args={},page=0,filter='all',selected=new Set(),timer=null,inView=true,pendingSelection=null;const root=document.getElementById('root'),core=OrdersGridCore,SIZE=core.PAGE_SIZE;
function post(type,data){parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function event(type,data={}){post('streamlit:setComponentValue',{value:{type,event:Date.now()+'-'+Math.random().toString(36).slice(2),...data}})}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function link(label,url){const a=node('a',label);a.href=url;a.target='_blank';a.rel='noopener';return a}
function selectionChanged(){pendingSelection=Array.from(selected);event('select',{ids:pendingSelection})}
function height(){
 let available=parent.innerHeight-370;
 try{const host=window.frameElement,main=parent.document.querySelector('main');if(host){const top=host.getBoundingClientRect().top+(main?.scrollTop||0);const chrome=(root.querySelector('.tools')?.getBoundingClientRect().height||36)+(root.querySelector('nav')?.getBoundingClientRect().height||40)+28;available=parent.innerHeight-top-chrome;}}catch{}
 document.documentElement.style.setProperty('--table-height',Math.max(300,Math.min(650,available))+'px');
 post('streamlit:setFrameHeight',{height:Math.min(850,Math.ceil(document.body.scrollHeight)+2)});
}
function statusCell(value){const text=String(value||'—'),lower=text.toLowerCase();let tone='neutral',icon='';if(lower==='complete'){tone='green';icon='✓ ';}else if(lower==='qa ready'){tone='blue';icon='✓ ';}else if(/needs|review|refund|blocked|error/.test(lower)){tone='amber';icon='! ';}return node('span',icon+text,'badge '+tone)}
function render(){
 const scroll=document.querySelector('.scroll')?.scrollTop||0,focus=document.activeElement?.id;root.replaceChildren();const rows=args.rows||[],filtered=core.filtered(rows,filter);page=Math.min(page,Math.max(0,Math.ceil(filtered.length/SIZE)-1));const shown=core.pageRows(filtered,page);
 const tools=node('div',undefined,'tools'),filters=node('div',undefined,'filters');filters.setAttribute('role','group');filters.setAttribute('aria-label','Filter orders by status');
 for(const [id,label] of [['all','All orders'],['attention','Needs attention'],['ready','Ready for review'],['complete','Complete']]){const b=node('button',label,'filter');b.setAttribute('aria-pressed',String(filter===id));b.append(node('span',String(core.filtered(rows,id).length),'count'));b.onclick=()=>{filter=id;page=0;render()};filters.append(b)}tools.append(filters,node('span',new Set(rows.map(r=>r.cells?.order)).size+' orders / '+rows.length+' editions / 50 per page','summary'));root.append(tools);
 const wrap=node('div',undefined,'scroll'),table=node('table');table.setAttribute('aria-label','Orders and edition preparation');const cg=node('colgroup');for(const width of ['3%','16%','30%','10%','15%','12%','14%']){const col=node('col');col.style.width=width;cg.append(col)}table.append(cg);
 const head=node('thead'),hr=node('tr'),firstHead=node('th'),all=node('input');all.type='checkbox';all.id='select-visible-orders';all.setAttribute('aria-label','Select all units on this page');all.checked=shown.length>0&&shown.every(r=>selected.has(r.id));all.indeterminate=shown.some(r=>selected.has(r.id))&&!all.checked;all.disabled=!shown.length;all.onchange=()=>{selected=core.togglePage(selected,shown,all.checked);selectionChanged();render()};firstHead.append(all);hr.append(firstHead);for(const label of ['Order & customer','Artwork & variant','Edition','Fulfilment','PSD · Edition JPG','Prodigi']){const th=node('th',label);th.scope='col';hr.append(th)}head.append(hr);table.append(head);const body=node('tbody');
 for(const r of shown){const c=r.cells||{},tr=node('tr');tr.dataset.unitId=r.id;tr.setAttribute('aria-selected',String(selected.has(r.id)));if(selected.has(r.id))tr.className='selected';const choose=node('input');choose.type='checkbox';choose.id='select-'+r.id;choose.checked=selected.has(r.id);choose.setAttribute('aria-label','Select '+c.order+' '+c.edition);choose.onchange=()=>{choose.checked?selected.add(r.id):selected.delete(r.id);tr.classList.toggle('selected',choose.checked);tr.setAttribute('aria-selected',String(choose.checked));selectionChanged();render()};const pick=node('td');pick.append(choose);tr.append(pick);
 const order=node('td'),copy=node('button',String(c.order||'—').replace(/^⧉\s*/,''),'order-copy');copy.title='Copy order number';copy.setAttribute('aria-label','Copy '+copy.textContent);copy.onclick=async()=>{try{await navigator.clipboard.writeText(copy.textContent);copy.title='Copied'}catch{copy.title='Select the order number to copy'}};order.append(copy,node('span',c.customer||'—','secondary'));tr.append(order);
 const artwork=node('td');artwork.append(node('span',c.product||'—','primary'),node('span',[c.variant,c.shipping,c.date].filter(Boolean).join(' '+String.fromCharCode(183)+' '),'secondary'));tr.append(artwork);const edition=node('td');edition.append(node('span',c.edition||'—','edition'));tr.append(edition);const fulfilment=node('td');fulfilment.append(statusCell(c.prodigi));tr.append(fulfilment);
 const files=node('td'),fileLinks=node('div',undefined,'files');fileLinks.append(r.psd?link('Open PSD',r.psd):node('span','PSD unavailable','pending'));fileLinks.append(r.jpg?link(r.jpg_label||'Open JPG',r.jpg):node('span',r.jpg_label||'JPG unavailable','pending'));files.append(fileLinks);tr.append(files);
 const action=node('td'),s=r.state||{};let a;if(s.url)a=link(s.label,s.url);else if(s.action){a=node('button',s.label);a.setAttribute('aria-label',s.label+' '+String(c.order||'').replace(/^⧉\s*/,'')+' '+c.edition);a.onclick=()=>{a.disabled=true;event(s.action,{id:r.id})}}else a=node('span',s.label||'—');a.className=s.action||s.url?'action '+(s.tone||''):s.tone||'pending';a.title=s.detail||'';action.append(a);tr.append(action);body.append(tr)}
 table.append(body);wrap.append(table);if(!shown.length)wrap.append(node('div','No orders in this view','empty'));root.append(wrap);wrap.scrollTop=scroll;const nav=node('nav'),sel=node('div',undefined,'selection');sel.setAttribute('aria-live','polite');sel.append(node(selected.size?'strong':'span',selected.size?selected.size+' selected':'Select an edition to use the actions above'));if(selected.size){const clear=node('button','Clear selection','clear');clear.onclick=()=>{selected.clear();selectionChanged();render()};sel.append(clear)}const pagination=node('div',undefined,'pagination'),prev=node('button','Previous'),next=node('button','Next');prev.disabled=page===0;next.disabled=(page+1)*SIZE>=filtered.length;prev.onclick=()=>{page--;render();document.querySelector('.scroll').scrollTop=0};next.onclick=()=>{page++;render();document.querySelector('.scroll').scrollTop=0};pagination.append(node('span',filtered.length?(page*SIZE+1)+'–'+Math.min((page+1)*SIZE,filtered.length)+' of '+filtered.length:'0 orders'),prev,next);nav.append(sel,pagination);root.append(nav);if(focus)document.getElementById(focus)?.focus({preventScroll:true});height();poll();
}
function poll(){if(timer){clearInterval(timer);timer=null}if(args.active)timer=setInterval(()=>{if(!document.hidden&&inView)event('refresh')},10000)}
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;const prior=(args.rows||[]).map(r=>r.id).join();args=e.data.args||{};if(prior!==(args.rows||[]).map(r=>r.id).join())page=0;const incoming=args.selected||[];if(pendingSelection&&incoming.length===pendingSelection.length&&pendingSelection.every(id=>incoming.includes(id)))pendingSelection=null;selected=new Set(pendingSelection||incoming);render()});parent.addEventListener('resize',height);new IntersectionObserver(es=>{inView=es.some(e=>e.isIntersecting)}).observe(root);post('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
