<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:#30332e;background:#fffefa;font:13px system-ui,sans-serif}.scroll{max-height:560px;overflow:auto;border:1px solid #e4e2da;border-radius:6px}table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}th{background:#f3f2ec;color:#64665f;text-align:left;position:sticky;top:0;z-index:2;font-weight:500}td,th{padding:7px 6px;border-bottom:1px solid #eeece5;vertical-align:top;overflow-wrap:anywhere;line-height:1.35}tbody tr:hover{background:#f7f5ef}tr.selected{background:#eee7d7}a,button{color:#2650ad;font:inherit}a{text-decoration:none}a:hover,button:hover{text-decoration:underline}button{border:0;background:transparent;padding:0;text-align:left;cursor:pointer}input{accent-color:#92712f;width:16px;height:16px;margin:2px 0}th:first-child,td:first-child{width:28px;text-align:center}.success{color:#238044;font-weight:600}.warning{color:#946407;font-weight:600}.pending,.muted{color:#72756b}.pending{white-space:normal}.sub{display:block;font-size:11px;color:#777}.empty{padding:20px}nav{display:flex;justify-content:flex-end;align-items:center;gap:16px;font-size:12px;padding:6px}nav button:disabled{opacity:.4;cursor:default}:focus-visible{outline:2px solid #9a7937;outline-offset:2px}@media(max-width:900px){body{font-size:12px}td,th{padding:6px 4px}}
</style></head><body><div id="root"></div><script>
'use strict';let args={},page=0,selected=new Set(),timer=null,inView=true;const root=document.getElementById('root');
function post(type,data){parent.postMessage({isStreamlitMessage:true,type,...data},'*')}
function event(type,data={}){post('streamlit:setComponentValue',{value:{type,event:Date.now()+'-'+Math.random().toString(36).slice(2),...data}})}
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function link(label,url){const a=node('a',label);a.href=url;a.target='_blank';a.rel='noopener';return a}
const cols=[['order','Order',8],['edition','Edition',6],['customer','Customer',10],['product','Product',19],['variant','Variant',8],['shipping','Shipping',7],['date','Date',7],['prodigi','Fulfilment',8],['psd','PSD',5],['jpg','Edition JPG',8],['send','Prodigi',9]];
function height(){post('streamlit:setFrameHeight',{height:Math.min(610,Math.ceil(document.body.scrollHeight)+2)})}
function render(){const old=document.querySelector('.scroll'),scroll=old?.scrollTop||0;root.replaceChildren();const wrap=node('div',undefined,'scroll'),table=node('table'),head=node('thead'),hr=node('tr'),cg=node('colgroup');cg.append(node('col'));for(const c of cols){const col=node('col');col.style.width=c[2]+'%';cg.append(col)}table.append(cg);hr.append(node('th'));for(const c of cols)hr.append(node('th',c[1]));head.append(hr);table.append(head);const body=node('tbody'),rows=args.rows||[],shown=rows.slice(page*20,page*20+20);
for(const r of shown){const tr=node('tr');if(selected.has(r.id))tr.className='selected';const choose=node('input');choose.type='checkbox';choose.checked=selected.has(r.id);choose.setAttribute('aria-label','Select '+r.cells.order+' '+r.cells.edition);choose.onchange=()=>{choose.checked?selected.add(r.id):selected.delete(r.id);event('select',{ids:Array.from(selected)})};const first=node('td');first.append(choose);tr.append(first);
for(const [key] of cols){const td=node('td');if(key==='psd')td.append(r.psd?link('Open PSD',r.psd):node('span','—'));else if(key==='jpg')td.append(r.jpg?link(r.jpg_label||'Open',r.jpg):node('span',r.jpg_label||'—'));else if(key==='send'){const s=r.state||{};let a;if(s.url)a=link(s.label,s.url);else if(s.action){a=node('button',s.label);a.onclick=()=>{a.disabled=true;event(s.action,{id:r.id})}}else a=node('span',s.label||'—');a.className=s.tone||'';a.title=s.detail||'';td.append(a)}else td.append(node('span',r.cells[key]||'—'));tr.append(td)}body.append(tr)}table.append(body);wrap.append(table);if(!shown.length)wrap.append(node('div','No matching orders','empty'));root.append(wrap);wrap.scrollTop=scroll;const nav=node('nav'),prev=node('button','Previous'),next=node('button','Next');prev.disabled=page===0;next.disabled=(page+1)*20>=rows.length;prev.onclick=()=>{page--;render()};next.onclick=()=>{page++;render()};nav.append(node('span',rows.length+' units'),prev,node('span',(page*20+1)+'–'+Math.min((page+1)*20,rows.length)),next);root.append(nav);height();poll()}
function poll(){if(timer){clearInterval(timer);timer=null}if(args.active)timer=setInterval(()=>{if(!document.hidden&&inView)event('refresh')},10000)}
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;const prior=(args.rows||[]).map(r=>r.id).join();args=e.data.args||{};if(prior!==(args.rows||[]).map(r=>r.id).join())page=0;selected=new Set(args.selected||[]);render()});new IntersectionObserver(es=>{inView=es.some(e=>e.isIntersecting)}).observe(root);post('streamlit:componentReady',{apiVersion:1});height();
</script></body></html>
