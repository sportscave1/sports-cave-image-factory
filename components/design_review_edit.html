<script>
(() => {
  const listenerKey = Symbol.for('sports-cave.design-review.edit-create-v2');
  if (document[listenerKey]) return;
  document[listenerKey] = true;

  const applyEdit = async (action, comments, requestId, errorTarget) => {
    const creating = Boolean(action.dataset.designCreate);
    if (errorTarget) errorTarget.textContent = '';
    if (action.getAttribute('aria-busy') === 'true') return;
    action.setAttribute('aria-busy', 'true');
    const card = action.closest('[class*="st-key-design-review-card-"]') || action.closest('.st-key-design-review-toolbar');
    card?.querySelector('.sc-review-edit-feedback')?.remove();
    const feedback = document.createElement('div');
    feedback.className = 'sc-review-edit-feedback';
    feedback.role = 'status';
    feedback.textContent = creating ? 'Adding design to companion…' : 'Adding edit to companion…';
    card?.append(feedback);
    try {
      const url = new URL(action.dataset.designReviewPrompt || '/api/design-review/create-queue', location.origin);
      url.pathname = creating ? '/api/design-review/create-queue' : '/api/design-review/edit-queue';
      const response = await fetch(url.pathname + url.search, {
        method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(creating ? {brief:comments, request_id:requestId} : {comments})
      });
      const data = await response.json();
      if (!response.ok || !data.queued) throw new Error(data.error || 'Could not queue the edit.');
      feedback.textContent = (creating ? 'Design' : 'Edit') + ' queued. Companion will open, paste and submit it automatically.';
      document.dispatchEvent(new CustomEvent('sc-design-edit-queued'));
      return true;
    } catch (error) {
      feedback.textContent = error.message || 'Could not queue the design. Try again.';
      if (errorTarget) errorTarget.textContent = feedback.textContent;
      return false;
    } finally {
      action.removeAttribute('aria-busy');
    }
  };

  const style = document.createElement('style');
  style.textContent = `
    .sc-review-edit-dialog { box-sizing:border-box; width:min(440px, calc(100vw - 32px)); padding:24px; border:1px solid #e3dace; border-radius:14px; background:#fffdfa; color:#191919; box-shadow:0 16px 60px #0003; font:16px/1.5 system-ui,sans-serif; }
    .sc-review-edit-dialog::backdrop { background:#0006; }
    .sc-review-edit-dialog label { display:block; margin-bottom:12px; font-size:17px; font-weight:600; }
    .sc-review-edit-dialog textarea { box-sizing:border-box; width:100%; min-height:120px; padding:10px 12px; border:1px solid #d8d0c5; border-radius:8px; background:#fff; color:#191919; font:inherit; resize:vertical; }
    .sc-review-edit-dialog textarea:focus-visible, .sc-review-edit-dialog button:focus-visible { outline:2px solid #a87922; outline-offset:2px; }
    .sc-review-edit-dialog footer { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
    .sc-review-edit-dialog button { padding:7px 16px; border:1px solid #ddd3c5; border-radius:8px; background:#fff; color:#191919; font:inherit; cursor:pointer; }
    .sc-review-edit-dialog button[type=submit] { background:#d5a340; border-color:#d5a340; }
  `;
  document.head.append(style);
  let dialog;
  document.addEventListener('click', (event) => {
    const action = event.target.closest('a[data-design-review-prompt], a[data-design-create]');
    if (!action) return;
    event.preventDefault();
    event.stopImmediatePropagation?.();
    if (action.getAttribute('aria-busy') === 'true' || dialog?.open) return;
    const creating = Boolean(action.dataset.designCreate);
    const requestId = creating ? crypto.randomUUID() : null;
    dialog = document.createElement('dialog');
    const activeDialog = dialog;
    activeDialog.className = 'sc-review-edit-dialog';
    activeDialog.setAttribute('aria-labelledby', 'sc-review-edit-label');
    const form = document.createElement('form');
    const label = document.createElement('label');
    label.id = 'sc-review-edit-label';
    label.htmlFor = 'sc-review-edit-comments';
    label.textContent = creating ? 'What design would you like to create?' : 'What needs changing?';
    const comments = document.createElement('textarea');
    comments.id = 'sc-review-edit-comments';
    comments.placeholder = creating ? 'Describe the athlete, team, rivalry or moment and the design you want…' : 'Describe what’s wrong or how to improve this design…';
    comments.maxLength = 20000;
    comments.required = creating;
    const footer = document.createElement('footer');
    const cancel = document.createElement('button');
    cancel.type = 'button';
    cancel.textContent = 'Cancel';
    cancel.addEventListener('click', () => activeDialog.close());
    const apply = document.createElement('button');
    apply.type = 'submit';
    apply.textContent = creating ? 'Create design' : 'Apply';
    footer.append(cancel, apply);
    const errorMessage = document.createElement('div');
    errorMessage.setAttribute('role', 'alert');
    form.append(label, comments, errorMessage, footer);
    activeDialog.append(form);
    activeDialog.addEventListener('close', () => {
      activeDialog.remove();
      action.focus();
    }, {once:true});
    form.addEventListener('submit', async (submitEvent) => {
      submitEvent.preventDefault();
      if (apply.disabled) return;
      const instructions = comments.value.trim();
      if (creating && !instructions) { comments.focus(); return; }
      apply.disabled = true;
      if (creating) {
        if (await applyEdit(action, instructions, requestId, errorMessage)) activeDialog.close();
        else apply.disabled = false;
      } else {
        activeDialog.close();
        void applyEdit(action, instructions);
      }
    });
    document.body.append(activeDialog);
    activeDialog.showModal();
    comments.focus();
  }, true);
})();
</script>
